  grammar:[
    { t:'EGON: nago, zaude, dago…', h:`
      <p><b>Egon</b> es «estar». Sirve para decir <b>cómo</b> está alguien o algo ahora y <b>dónde</b> está.</p>
      <table><tr><th>Sujeto</th><th>Egon</th><th>Castellano</th></tr>
      <tr><td>ni</td><td><b>nago</b></td><td>estoy</td></tr>
      <tr><td>zu</td><td><b>zaude</b></td><td>estás</td></tr>
      <tr><td>hura</td><td><b>dago</b></td><td>está</td></tr>
      <tr><td>gu</td><td><b>gaude</b></td><td>estamos</td></tr>
      <tr><td>zuek</td><td><b>zaudete</b></td><td>estáis</td></tr>
      <tr><td>haiek</td><td><b>daude</b></td><td>están</td></tr></table>
      <p>Fíjate: el sujeto va <b>sin -k</b> (es NOR, como con izan): <i>ni nago</i>, nunca «nik nago».</p>
      <div class="ex"><b>Etxean nago.</b><span>Estoy en casa.</span></div>
      <div class="ex"><b>Afrika oso urruti dago.</b><span>África está muy lejos.</span></div>
      <div class="ex"><b>Zenbat ikasle daude? — Hamar.</b><span>¿Cuántos alumnos hay? — Diez.</span></div>
      <p>El «dónde» (<i>Non dago?</i>) se ve a fondo en la unidad <i>Non dago?</i>.</p>
      <div class="warn">En Bizkaia oirás <i>dagoz</i> por <b>daude</b> y <i>zagoz</i> por <b>zaude</b>. En batua: <b>daude</b>, <b>zaude</b>.</div>` },
    { t:'Zer moduz zaude?', h:`
      <p>Para preguntar qué tal está alguien:</p>
      <div class="ex"><b>Zer moduz zaude? / Nola zaude?</b><span>¿Qué tal estás? / ¿Cómo estás?</span></div>
      <p>Respuestas, de mejor a peor:</p>
      <table><tr><th>Euskera</th><th>Castellano</th></tr>
      <tr><td><b>Primeran</b> nago</td><td>estoy genial</td></tr>
      <tr><td><b>Oso ondo</b> nago</td><td>estoy muy bien</td></tr>
      <tr><td><b>Ondo</b> nago</td><td>estoy bien</td></tr>
      <tr><td><b>Nahiko ondo</b> nago</td><td>estoy bastante bien</td></tr>
      <tr><td><b>Erdipurdi</b> nago</td><td>estoy regular</td></tr>
      <tr><td><b>Ez nago oso ondo</b></td><td>no estoy muy bien</td></tr>
      <tr><td><b>Gaizki</b> nago</td><td>estoy mal</td></tr></table>
      <div class="ex"><b>Ni oso ondo nago, eta zuek zer moduz zaudete?</b><span>Yo estoy muy bien, ¿y vosotros qué tal estáis?</span></div>
      <div class="warn"><b>Ondo</b> (bien) no es <b>ona</b> (bueno): <i>ondo nago</i> = estoy bien; <i>ona da</i> = es bueno.</div>` },
    { t:'Izan con -a, egon sin -a', h:`
      <p>Con <b>izan</b> (es) el adjetivo lleva artículo. Con <b>egon</b> (está) va <b>sin artículo</b>, y no cambia en plural:</p>
      <table><tr><th>Nolakoa da? (izan)</th><th>Nola dago? (egon)</th></tr>
      <tr><td>Katu<b>a</b> garbi<b>a</b> da</td><td>Katu<b>a</b> garbi dago</td></tr>
      <tr><td>Txerri<b>ak</b> zikin<b>ak</b> dira</td><td>Txerri<b>ak</b> zikin daude</td></tr>
      <tr><td>Garbi<b>a</b> naiz</td><td>Garbi nago</td></tr>
      <tr><td>Garbi<b>ak</b> gara</td><td>Garbi gaude</td></tr></table>
      <p>El nombre (<i>katua, txerriak</i>) sí lleva su artículo; lo que se queda desnudo es el adjetivo que va con egon.</p>
      <div class="warn">«Gu tristeak gaude» es incorrecto: <b>Gu triste gaude</b>. Y «Ni pozika nago» tampoco: <b>pozik nago</b>.</div>` },
    { t:'Palabras en -ta, -ik y -rez', h:`
      <p>Muchas palabras de estado ya tienen su propia terminación. Se usan tal cual con egon, nunca con -a ni -ak:</p>
      <table><tr><th>Terminación</th><th>Ejemplos</th></tr>
      <tr><td>verbo + <b>-ta / -da</b> (como «-ado» en castellano)</td><td>nekatu → nekatu<b>ta</b>, itxi → itxi<b>ta</b>, eseri → eseri<b>ta</b>, hil → hil<b>da</b>, etzan → etzan<b>da</b></td></tr>
      <tr><td><b>-(r)ik</b></td><td>poz<b>ik</b>, gaixo<b>rik</b>, isil<b>ik</b>, bizi<b>rik</b>, zut<b>ik</b></td></tr>
      <tr><td><b>-(r)ez</b></td><td>negar<b>rez</b> (llorando)</td></tr></table>
      <div class="ex"><b>Neska horiek nekatuta daude.</b><span>Esas chicas están cansadas.</span></div>
      <div class="ex"><b>Amona gaixorik dago.</b><span>La abuela está enferma.</span></div>
      <p>La <b>-a</b> final de <i>nekatuta</i> no es un artículo: es parte de la palabra. Por eso no se quita y no pasa a «nekatutak».</p>` },
    { t:'Nolakoa? ≠ Nola?', h:`
      <p>Con la misma palabra cambia el sentido: <b>da</b> habla de cómo <b>es</b> (carácter, siempre); <b>dago</b>, de cómo <b>está</b> ahora.</p>
      <table><tr><th>Es (izan)</th><th>Está (egon)</th></tr>
      <tr><td>Ane alai<b>a da</b> — es alegre</td><td>Ane alai <b>dago</b> — está alegre</td></tr>
      <tr><td>Lasai<b>a naiz</b> — soy tranquilo</td><td>Lasai <b>nago</b> — estoy tranquilo</td></tr>
      <tr><td>Isil<b>ak zarete</b> — sois callados</td><td>Isil<b>ik zaudete</b> — estáis callados</td></tr>
      <tr><td>Triste<b>a zara</b> — eres triste</td><td>Triste <b>zaude</b> — estás triste</td></tr></table>
      <p>Y la pregunta va a juego:</p>
      <div class="ex"><b>Jon triste dago. → Nola dago Jon?</b><span>Jon está triste. → ¿Cómo está Jon?</span></div>
      <div class="ex"><b>Marta argala da. → Nolakoa da Marta?</b><span>Marta es delgada. → ¿Cómo es Marta?</span></div>` },
    { t:'Ez nago…, …zaude?', h:`
      <p>En la negativa, <b>ez + egon</b> salta delante y el estado va detrás:</p>
      <div class="ex"><b>Nekatuta nago. → Ez nago nekatuta.</b><span>Estoy cansado. → No estoy cansado.</span></div>
      <div class="ex"><b>Marta ez dago lotan.</b><span>Marta no está dormida.</span></div>
      <p>Para preguntar, basta con la entonación:</p>
      <div class="ex"><b>Nekatuta zaude? — Bai, nekatuta nago. / Ez, ez nago nekatuta.</b><span>¿Estás cansado? — Sí, lo estoy. / No, no lo estoy.</span></div>
      <p>Para graduar, igual que con izan: <i>oso urduri nago</i>, <i>nahiko lasai dago</i>, <i>ez nago batere urduri</i> (nada nervioso).</p>` }
  ],

  grammar:[
    { t:'Non? -an, -ean, -etan', h:`
      <p>Para decir <b>dónde</b>, el euskera no usa «en»: pone una terminación al final de la palabra.</p>
      <p>Con nombres de lugar ya lo sabes: <i>Bilbo<b>n</b>, Irun<b>en</b></i> (unidad <i>Non bizi zara?</i>). Con nombres comunes, la terminación lleva dentro el artículo:</p>
      <table><tr><th></th><th>en <b>la</b>… (singular)</th><th>en <b>las</b>… (plural)</th></tr>
      <tr><td>etxe (vocal)</td><td>etxe<b>an</b></td><td>etxe<b>etan</b></td></tr>
      <tr><td>zuhaitz (consonante)</td><td>zuhaitz<b>ean</b></td><td>zuhaitz<b>etan</b></td></tr>
      <tr><td>eskola (a de la palabra)</td><td>eskola<b>n</b></td><td>eskol<b>etan</b></td></tr>
      <tr><td>lur (r)</td><td>lur<b>rean</b></td><td>lur<b>retan</b></td></tr></table>
      <div class="ex"><b>Non dago Jon? — Etxean dago.</b><span>¿Dónde está Jon? — Está en casa.</span></div>
      <div class="ex"><b>Txoriak zuhaitzetan daude.</b><span>Los pájaros están en los árboles.</span></div>
      <div class="warn">Las palabras en <b>-a</b> de verdad (<i>eskola, denda, taberna</i>): en singular solo se añade <b>-n</b> (<i>eskolan</i>, no «eskolaan»); en plural la a desaparece (<i>dendetan</i>, no «dendaetan»).</div>
      <p>La r final casi siempre se duplica: <i>lurrean, izterrean</i>. La excepción más común: <i>ur</i> (agua) → <i>urean</i>.</p>` },
    { t:'El mugagabe: sin «los/las»', h:`
      <p>En castellano no es lo mismo «en <b>los</b> tres pueblos» que «en tres pueblos». En euskera esa diferencia va en la terminación. La forma sin artículo se llama <b>mugagabe</b>:</p>
      <table><tr><th></th><th>con «los/las»</th><th>sin artículo (mugagabe)</th></tr>
      <tr><td>herri</td><td>hiru herri<b>etan</b></td><td>hiru herri<b>tan</b></td></tr>
      <tr><td>taberna</td><td>bost tabern<b>etan</b></td><td>bost taberna<b>tan</b></td></tr>
      <tr><td>zuhaitz</td><td>zuhaitz<b>etan</b></td><td>zuhaitz<b>etan</b></td></tr></table>
      <p>Tras vocal: <b>-tan</b>. Tras consonante: <b>-etan</b>, igual que el plural (por eso con consonante no se nota).</p>
      <div class="ex"><b>Hiru herritan bizi izan naiz.</b><span>He vivido en tres pueblos.</span></div>
      <div class="ex"><b>Hiru herrietan euskaltegi bat dago.</b><span>En los tres pueblos hay un euskaltegi.</span></div>
      <p><b>El truco:</b> piensa la frase en castellano. ¿Dirías «los/las»? Entonces plural (-etan). ¿No? Entonces mugagabe.</p>
      <div class="warn">Las palabras en -a se quedan con su a en el mugagabe: <i>taberna<b>tan</b>, eskola<b>tan</b></i>. Solo la pierden en plural: <i>tabern<b>etan</b></i>.</div>` },
    { t:'¿Qué palabras piden mugagabe?', h:`
      <p>Llevan mugagabe las palabras que en castellano van <b>sin</b> «los/las»:</p>
      <table><tr><th>Palabra</th><th>Ejemplo</th><th>Castellano</th></tr>
      <tr><td>números (menos bat)</td><td>zortzi herri<b>tan</b></td><td>en ocho pueblos</td></tr>
      <tr><td>zenbat?</td><td>zenbat hiri<b>tan</b>?</td><td>¿en cuántas ciudades?</td></tr>
      <tr><td>zein?</td><td>zein kale<b>tan</b>?</td><td>¿en qué calle?</td></tr>
      <tr><td>zenbait (delante)</td><td>zenbait etxe<b>tan</b></td><td>en algunas casas</td></tr>
      <tr><td>asko (detrás)</td><td>herri asko<b>tan</b></td><td>en muchos pueblos</td></tr>
      <tr><td>gutxi (detrás)</td><td>mendi gutxi<b>tan</b></td><td>en pocos montes</td></tr></table>
      <p>Y en plural normal, las que en castellano llevan «los/las»:</p>
      <table><tr><th>Palabra</th><th>Ejemplo</th><th>Castellano</th></tr>
      <tr><td>guztiak</td><td>kale guzti<b>etan</b></td><td>en todas <b>las</b> calles</td></tr>
      <tr><td>gehienak</td><td>etxe gehien<b>etan</b></td><td>en la mayoría de <b>las</b> casas</td></tr></table>
      <div class="ex"><b>Zein kaletan bizi zara?</b><span>¿En qué calle vives? (no «zein kalean»)</span></div>` },
    { t:'La terminación va al final', h:`
      <p>Cuando el nombre lleva algo detrás (este, un, muchos…), la terminación se pone en <b>la última palabra</b> del grupo; el nombre se queda sin nada:</p>
      <div class="ex"><b>mendi hori → mendi horretan</b><span>ese monte → en ese monte</span></div>
      <div class="ex"><b>etxe bat → etxe batean</b><span>una casa → en una casa</span></div>
      <div class="ex"><b>herri asko → herri askotan</b><span>muchos pueblos → en muchos pueblos</span></div>
      <p>Los demostrativos cambian de forma:</p>
      <table><tr><th></th><th>singular</th><th>plural</th></tr>
      <tr><td>este / estos</td><td>hau → <b>honetan</b></td><td>hauek → <b>hauetan</b></td></tr>
      <tr><td>ese / esos</td><td>hori → <b>horretan</b></td><td>horiek → <b>horietan</b></td></tr>
      <tr><td>aquel / aquellos</td><td>hura → <b>hartan</b></td><td>haiek → <b>haietan</b></td></tr></table>
      <p><b>Bat</b> y <b>batzuk</b> también se declinan ellos: <i>etxe <b>batean</b></i> (en una casa), <i>eskola <b>batzuetan</b></i> (en algunas escuelas).</p>
      <div class="warn"><b>Zenbait</b> y <b>batzuk</b> significan lo mismo, pero <i>zenbait</i> va delante y con mugagabe (<i>zenbait eskolatan</i>), y <i>batzuk</i> va detrás (<i>eskola batzuetan</i>). <i>Batzuetan</i> es lo más corriente al hablar.</div>` },
    { t:'Nonbait, inon ez, edonon', h:`
      <table><tr><th>Euskera</th><th>Castellano</th></tr>
      <tr><td><b>hemen / hor / han</b></td><td>aquí / ahí / allí</td></tr>
      <tr><td><b>nonbait</b></td><td>en algún sitio</td></tr>
      <tr><td><b>inon ez</b></td><td>en ningún sitio</td></tr>
      <tr><td><b>edonon</b></td><td>en cualquier sitio</td></tr></table>
      <div class="ex"><b>Giltzak nonbait daude.</b><span>Las llaves están en algún sitio.</span></div>
      <div class="ex"><b>Giltzak ez daude inon.</b><span>Las llaves no están en ningún sitio.</span></div>
      <div class="warn"><b>Inon</b> solo va con <i>ez</i> o en preguntas: <i>Inon ikusi duzu?</i> (¿lo has visto en algún sitio?). En una frase afirmativa, «en algún sitio» es <b>nonbait</b>.</div>` },
    { t:'Non dago? Non daude?', h:`
      <p>Para preguntar dónde está algo se usa <b>egon</b> (unidad <i>Nola dago?</i>): <i>dago</i> con una cosa, <i>daude</i> con varias.</p>
      <div class="ex"><b>Non dago liburua? — Mahaian dago.</b><span>¿Dónde está el libro? — Está en la mesa.</span></div>
      <div class="ex"><b>Non daude ikasleak? — Euskaltegian daude.</b><span>¿Dónde están los alumnos? — En el euskaltegi.</span></div>
      <p>Con <i>dago</i> / <i>daude</i> también se dice «hay»:</p>
      <div class="ex"><b>Herri askotan euskaltegi bat dago.</b><span>En muchos pueblos hay un euskaltegi.</span></div>
      <div class="ex"><b>Basoetan perretxikoak daude.</b><span>En los bosques hay setas.</span></div>
      <p>Las palabras para decir dónde exactamente (<i>aurrean, atzean, gainean, azpian, ondoan…</i>) llegarán a esta unidad más adelante.</p>` },
    { t:'Ez dago …-rik (no hay)', h:`
      <p>Para decir que <b>no hay</b> algo: <span class="hl">ez dago</span> y la cosa con <b>-rik / -ik</b>, sin artículo. Es lo mismo que <i>ez dauka betaurrekorik</i> (unidad <i>Gorputza</i>), pero con egon.</p>
      <div class="ex"><b>Euli bat dago edalontzian. → Edalontzian ez dago eulirik.</b><span>Hay una mosca en el vaso. → En el vaso no hay ninguna mosca.</span></div>
      <div class="ex"><b>Mahaian ez dago ogirik.</b><span>En la mesa no hay pan.</span></div>
      <table><tr><th>La palabra termina en…</th><th>Forma</th><th>Ejemplo</th></tr>
      <tr><td>vocal</td><td><b>-rik</b></td><td>ogi<b>rik</b>, taberna<b>rik</b>, ikasle<b>rik</b></td></tr>
      <tr><td>consonante</td><td><b>-ik</b></td><td>zuhaitz<b>ik</b>, egurr<b>ik</b> (la r se duplica)</td></tr></table>
      <div class="warn">Con -rik el verbo va <b>siempre en singular</b>: <b>dago</b>, nunca <i>daude</i>, aunque en castellano sean varias cosas. <i>Basoetan perretxikoak <b>daude</b></i> → <i>Basoetan ez <b>dago</b> perretxikorik</i>.</div>
      <p><b>-rik o no:</b> si en castellano cabe «ningún / ninguna», va -rik. Si son cosas o personas concretas («los / las»), se queda el artículo y el verbo concuerda:</p>
      <div class="ex"><b>Euskaltegian ez dago ikaslerik.</b><span>En el euskaltegi no hay alumnos (ninguno).</span></div>
      <div class="ex"><b>Ikasleak ez daude euskaltegian.</b><span>Los alumnos (los nuestros) no están en el euskaltegi.</span></div>
      <p>Para preguntar si hay: <span class="hl">ba- + dago</span> y -rik.</p>
      <div class="ex"><b>Herri honetan badago tabernarik? — Bai, badago. / Ez, ez dago.</b><span>¿En este pueblo hay algún bar? — Sí, hay. / No, no hay.</span></div>` }
  ],

function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(b[i-1]===a[j-1]?0:1));return m[b.length][a.length]}

/* lecciones a medias (v1.16): se guarda la cola entera de la lección en S.runs[id],
   al mostrar cada ejercicio y al corregirlo; así sobrevive a salir, cerrar la app o cambiar de dispositivo */
const RUN_MAX=6, RUN_DAYS=30;
function canResume(m){ return !!(m&&m.id) }
function runPct(r){ return Math.min(99,Math.round((r.done||0)/(r.total||1)*100)) }
function dropRun(id){ if(S.runs&&S.runs[id]){ delete S.runs[id]; save() } }
function pruneRuns(){
  const old=Date.now()-RUN_DAYS*864e5;
  const ks=Object.keys(S.runs).filter(k=>S.runs[k]&&S.runs[k].at>old).sort((a,b)=>S.runs[b].at-S.runs[a].at);
  const keep={}; ks.slice(0,RUN_MAX).forEach(k=>keep[k]=S.runs[k]); S.runs=keep;
}
function lastRun(){ if(!S.runs) return null; pruneRuns(); const ks=Object.keys(S.runs); if(!ks.length) return null;
  return ks.map(k=>S.runs[k]).sort((a,b)=>b.at-a.at)[0] }
function saveRun(at){
  if(!R||!canResume(R.meta)||R.saveOff) return;
  try{
    const uniq=[...new Set(R.queue)];
    // el juego del espía guarda su partida en it.g (con Sets): no se guarda, se empieza otra al volver
    const items=JSON.parse(JSON.stringify(uniq.map(it=>it.t==='spygame'?{t:'spygame'}:it),(k,v)=>v instanceof Set?undefined:v));
    const meta=Object.assign({},R.meta); delete meta.words;
    S.runs=S.runs||{};
    S.runs[R.meta.id]={v:1,at:Date.now(),i:at,items,q:R.queue.map(o=>uniq.indexOf(o)),re:uniq.map((o,k)=>R.retried.has(o)?k:-1).filter(k=>k>=0),
      total:R.total,done:R.done,first:R.first,firstOk:R.firstOk,combo:R.combo,maxCombo:R.maxCombo,el:Date.now()-R.start,meta,ch:R.ch};
    pruneRuns(); save();
  }catch(e){}
}
function resumeLesson(r){
  const objs=r.items, queue=r.q.map(k=>objs[k]);
  if(!queue.length||queue.some(x=>!x)){ dropRun(r.meta.id); toast('No se pudo recuperar la lección'); return }
  startLesson(queue,r.meta,{ch:r.ch||r.meta.ch||'latxi',i:Math.min(r.i,queue.length),total:r.total,done:r.done,first:r.first,firstOk:r.firstOk,combo:0,maxCombo:r.maxCombo||0,start:Date.now()-(r.el||0),retried:new Set((r.re||[]).map(k=>objs[k]))});
}
function openLesson(build,meta,emptyMsg){
  const r=S.runs&&S.runs[meta.id];
  const fresh=()=>{ const q=build(); if(!q.length){ toast(emptyMsg||'No hay ejercicios'); return } dropRun(meta.id); startLesson(q,meta) };
  if(!r) return fresh();
  modal(`<h2>Lección a medias</h2><p>Dejaste <b>${esc(meta.title||'esta lección')}</b> al ${runPct(r)} %. ¿Sigues donde lo dejaste?</p><div class="acts"><button class="btn btn-green wide" id="c-ok">Continuar</button><button class="btn btn-white wide" id="c-no">Empezar de nuevo</button></div>`,(m,close)=>{
    $('#c-ok',m).onclick=()=>{ SFX.tap(); close(); resumeLesson(r) }; $('#c-no',m).onclick=()=>{ SFX.tap(); close(); fresh() }; });
}
function flushNow(){ clearTimeout(saveT); flush() }

const INT=[0,1,3,7,16,35];
function srsSeen(w){ const k=norm(w.eu); if(!S.srs[k]) S.srs[k]={b:0,due:today()} }
function srsGrade(w,ok,strong){ // devuelve true si la palabra acaba de llegar a la última caja (v1.24)
  const k=norm(w.eu); const c=S.srs[k]||{b:0,due:today()}; const was=c.b;
  if(ok){ c.b = strong ? Math.min(c.b+1,5) : Math.max(c.b,1); c.due=addDays(today(),INT[c.b]); }
  else { c.b=0; c.due=today(); }
  S.srs[k]=c;
  return !!ok && was<5 && c.b===5;
}
function dueWords(){ const t=today(); return Object.entries(S.srs).filter(([k,c])=>c.due<=t && WORDS[k]).map(([k])=>WORDS[k]) }

function addXP(n){ S.xp+=n; const t=today(); S.days[t]=(S.days[t]||0)+n }
function streak(){ let n=0,d=today(); if(!S.days[d]) d=addDays(d,-1); while(S.days[d]){n++;d=addDays(d,-1)} return n }

let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(AC.state==='suspended')AC.resume(); return AC }
function tone(f,t0,dur,type='sine',vol=.18){
  const c=ac(); if(!c||!S.settings.sound) return;
  const o=c.createOscillator(), g=c.createGain(); const t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

  const dist=[]; const seen=new Set([norm(dir==='eu'?w.es:w.eu)]);

/* «Traduce la frase» (v1.12.3): la coma, el punto, ? y ! que separan dos partes

   opcional: vale ponerlo al final o no ponerlo; en otro sitio es fallo. ¿ ¡ no salen. */
const PUNCT=/^[,.?!]$/;

    const m=w.match(/[?!.,]/g); // signo que cierra esta parte

function buildEx(sent,lang,unit,extra=0){

/* Hitzak (v1.25, a partir de la revisión del 2026-11-22): reparto por palabra.

   primero los que no han salido nunca, luego los fallados la última vez y luego los que menos han salido, al azar

/* =========================================================
   MODO RETO · Erronka (v1.30, fase 4 de la revisión de lecciones)
   Al repetir una lección de unidad ya hecha se puede elegir «Erronka» (o repetirla normal):
   · Hitzak: sin tarjetas de palabra nueva; cada palabra se produce (Escribe ~40 %, o «¿cómo se dice?»)
     y la mitad se reconoce después; opciones falsas muy parecidas en euskera (simPool); palabras de
     unidades anteriores; una sola «unir parejas».
   · Gramatika: sin tarjetas de gramática; más huecos generados; frases hacia el euskera con más fichas trampa.
   · Praktika: frases casi todas hacia el euskera y con más trampas, más huecos, más «Escribe»,
     palabras de unidades anteriores, sin «unir parejas».
   · Huecos: si el enunciado es la frase en castellano («…»), no se enseña: va detrás de «Pista».
     En el reto, usar la pista hace que el hueco no cuente como acierto a la primera (no se repite).
   · Los ejercicios de palabras del reto cuentan como «fuertes» para el repaso (como en Errepasatu).
   · +5 XP por reto. S.done[id].rt = retos hechos, .rb = mejor % en reto.
   ========================================================= */
const RETO_KINDS=['vocab','grammar','practice'];
const ES_Q=/^«[^»]+»(\s*\([^)]*\))?$/;   // enunciado que es la frase en castellano
const bareN=t=>norm(artBare(String(t).split('/')[0]));
/* opciones falsas parecidas: palabras cuyo euskera se parece (distancia de edición, misma terminación, misma unidad) */
function simPool(w,known){
  const k=norm(w.eu), kes=norm(w.es), b=bareN(w.eu);
  // fuera las que podrían valer también: mismo castellano o uno que empieza por el otro («yo» / «yo (con verbos de ukan)»)
  const clash=x=>{ const e=norm(x.es); return e===kes || e.startsWith(kes) || kes.startsWith(e) || synRel(w,x) };
  const sc=Object.values(WORDS).filter(x=>norm(x.eu)!==k && !clash(x) && bareN(x.eu)!==b).map(x=>{
    const c=bareN(x.eu), L=Math.max(b.length,c.length)||1;
    let r=lev(b,c)/L;
    if(x.src===w.src) r-=.12;
    if(b.slice(-2)===c.slice(-2)) r-=.08;
    if(b.slice(0,2)===c.slice(0,2)) r-=.06;
    if(isKnown(x,known)) r-=.06;
    return {x,r} }).sort((a,b2)=>a.r-b2.r);
  return [...shuffle(sc.slice(0,7).map(o=>o.x)),...poolFor(w,known)];
}
function mcHard(w,dir,known){
  const dist=[]; const right=dir==='eu'?w.es:w.eu; const seen=new Set([norm(right)]);
  const kes=norm(w.es);
  for(const x of simPool(w,known)){ const e=norm(x.es); if(e.startsWith(kes)||kes.startsWith(e)) continue; const t=dir==='eu'?x.es:x.eu; if(!seen.has(norm(t))){seen.add(norm(t));dist.push(t)} if(dist.length===3)break }
  const opts=shuffle([right,...dist]);
  return {t:'mc',dir,w,opts,a:opts.indexOf(right),reto:true};
}
/* palabras de unidades anteriores (primero las que ya están en el repaso) */
function oldWords(u,n,avoid){
  const ui=UNITS.indexOf(u); if(ui<=0||n<=0) return [];
  const bad=new Set(), badEs=new Set(); (avoid||[]).forEach(w=>{ bad.add(norm(w.eu)); badEs.add(norm(w.es)) });
  const all=UNITS.slice(0,ui).flatMap(x=>x.words).filter(w=>!bad.has(norm(w.eu))&&!badEs.has(norm(w.es))&&WORDS[norm(w.eu)]===w);
  const a=all.filter(w=>S.srs[norm(w.eu)]), b=all.filter(w=>!S.srs[norm(w.eu)]);
  return [...shuffle(a),...shuffle(b)].slice(0,n);
}
/* pone cada ejercicio de reconocimiento después del de producción de la misma palabra */
function afterProd(q,rec){
  rec.forEach(r=>{ const k=norm(r.w.eu); const at=q.findIndex(e=>e.w&&norm(e.w.eu)===k);
    const lo=Math.min(q.length,at<0?0:at+3); q.splice(lo+Math.floor(Math.random()*(q.length-lo+1)),0,r) });
  return q;
}
function uniqPairs(ws,n){ const o=[], e=new Set(), s=new Set(); for(const w of shuffle(ws)){ const a=norm(w.eu), b=norm(w.es); if(e.has(a)||s.has(b)||o.some(x=>synRel(w,x))) continue; e.add(a); s.add(b); o.push(w); if(o.length===n) break } return o }
function retoVocab(words,u){
  const known=new Set(words.map(w=>norm(w.eu))), sh=shuffle(words), nType=Math.ceil(words.length*.4);
  const old=oldWords(u,Math.min(5,Math.max(3,Math.round(words.length/4))),words);
  const prod=[...sh.map((w,i)=>i<nType?Object.assign(typeEx(w),{reto:true}):mcHard(w,'es',known)),
              ...old.map(w=>Math.random()<.5?Object.assign(typeEx(w),{reto:true}):mcHard(w,'es',known))];
  const rec=shuffle(words).slice(0,Math.ceil(words.length/2)).map(w=>mcHard(w,'eu',known));
  const q=afterProd(shuffle(prod),rec);
  if(words.length>=3) q.push({t:'match',pairs:uniqPairs([...words,...old],5)});
  return q;
}
function retoLesson(L){
  const u=L.unit;

  if(L.kind==='grammar') return shuffle([...rankPick(u.drills,dKey,G_MAX), ...genDrills(u,6,true)]).map(D)
    .concat(rankPick(u.sentences,sKey,3).map(s=>{ const e=buildEx(s,'eu',u,2); e.sk=sKey(s); return e }));
  const ws=pick(u.words,7), old=oldWords(u,3,u.words);

    ...rankPick(u.sentences,sKey,pSent(u)).map(s=>{ const e=buildEx(s,Math.random()<.2?'es':'eu',u,2); e.sk=sKey(s); return e }),
    ...[...rankPick(u.drills,dKey,4), ...genDrills(u,4,false)].map(D),
    ...ws.slice(0,5).map(w=>Object.assign(typeEx(w),{reto:true})), ...ws.slice(5).map(w=>mcHard(w,'es',known)),
    ...old.map(w=>Math.random()<.5?Object.assign(typeEx(w),{reto:true}):mcHard(w,'es',known)) ]);

/* n huecos nuevos para la unidad u. home: solo los generadores de la propia unidad (Gramatika);
   si no, todos los ya vistos en el camino, con más peso los de la unidad (Praktika). */
function genDrills(u,n,home){
  const ui=UNITS.indexOf(u); if(ui<0) return [];
  const gs=GENS.filter(g=>gOk(g.home,ui) && (!home || g.home===u.id)); if(!gs.length) return [];
  const w=gs.flatMap(g=>g.home===u.id?[g,g,g]:[g]), out=[], seen=new Set();
  for(let k=0;k<n*8 && out.length<n;k++){ const d=gOne(w).f(ui); if(d && !seen.has(d.s)){ seen.add(d.s); out.push(d) } }
  return out;
}

/* formas: bare = sin artículo; own = la -a es de la palabra; stem = tema para -ek / -en / -etan (eskol-, senarr-) */
const gdBare=w=>hasArt(w)?artBare(w):w;
const gdOwn=w=>!hasArt(w)&&/a$/.test(w);
const gdV=s=>/[aeiou]$/.test(s);

const gdArt=w=>gdOwn(w)?w:/r$/.test(gdBare(w))?gdBare(w)+'ra':gdBare(w)+'a';   // irakaslea, ama, senarra, laguna
const gdErgSg=w=>gdArt(w)+'k', gdErgPl=w=>gdStem(w)+'ek';
const gdGenSg=w=>gdArt(w)+'ren', gdGenPl=w=>gdStem(w)+'en';
const gdNonSg=w=>{ const b=gdBare(w); return gdOwn(w)?w+'n':/r$/.test(b)?b+'rean':gdV(b)?b+'an':b+'ean' };
const gdNonPl=w=>gdStem(w)+'etan';
const gdNonMg=w=>{ const b=gdBare(w); return gdV(b)?b+'tan':gdStem(w)+'etan' };
/* nombres propios */
const gdPErg=n=>gdV(n)?n+'k':/r$/.test(n)?n+'rek':n+'ek';
const gdPGen=n=>gdV(n)?n+'ren':/r$/.test(n)?n+'ren':n+'en';                    // Aitor → Aitorren (r doble)
/* topónimos */
const gdTBase=t=>t[2]==='art'?t[0].slice(0,-1):t[0];                             // Iruñea → Iruñe
const gdTNon=t=>t[2]==='c'?t[0]+'en':gdTBase(t)+(t[2]==='art'?'an':'n');
const gdTNongo=t=>t[2]==='c'?t[0]+(/[nl]$/.test(t[0])?'goa':'koa'):gdTBase(t)+'koa';
const gdAlt=t=>t[2]==='c'?[t[0]+'ekoa',t[0]+'ekoak']:[];                         // también valen; nunca como trampa
/* castellano */
const gdDe=es=>es.replace(/^el /,'del ').replace(/^(?!del )/,'de ');
const gdMi=es=>es.replace(/^(el|la) /,'mi ').replace(/^(los|las) /,'mis ');
const gdNoArt=es=>es.replace(/^(el|la|los|las) /,'');

/* hueco: opciones con la buena, sin repetir ni la buena ni las que también valen */
function gdDrill(q,s,right,traps,x,alts=[]){
  const c=[...new Set(traps)].filter(t=>t&&t!==right&&!alts.includes(t)); if(c.length<3) return null;
  return gDrill(q,s,right,shuffle(c).slice(0,3),x);
}

/* =========================================================
   PALABRAS QUE SE PUEDEN TOCAR (v1.28)
   En los huecos y en la frase en euskera de «Traduce la frase», cada palabra que la app reconoce se puede tocar:
   · formas verbales (naiz, dauzkazu, badakit…) → qué son, sin tocar el repaso;
   · palabras del vocabulario (también declinadas: etxean → etxe(a), Bilbon → Bilbo) → significado,

   · palabras del glosario (GLOSA) que no están en el vocabulario → «Hitz berria!»: se guardan en la ficha

   Las que no reconoce (nombres propios…) no se pueden tocar.
   ========================================================= */
const VFORMS=(()=>{ const m={}, P=['(yo)','(tú)','(él/ella)','(nosotros)','(vosotros)','(ellos)'];
  const add=(forms,es,verb,extra='')=>forms.split(' ').forEach((f,i)=>m[f]={es:P[i]+' '+es[i]+extra,verb});
  add('naiz zara da gara zarete dira',['soy','eres','es','somos','sois','son'],'izan');

/* --- descripción de una cara: solo los rasgos que la distinguen de las otras --- */
function describeFace(f,others){
  const N=f.name, out=[]; // [verbo, euskera sin sujeto, castellano sin sujeto]
  const diff=g=>others.some(o=>g(o)!==g(f));
  if(diff(o=>o.old)) out.push(['izan',f.old?'zaharra da':'gaztea da',f.old?'es mayor':'es joven']);
  const colK=o=>o.hair==='soila'?'soila':o.col;
  if(diff(colK)){
    if(f.hair==='soila') out.push(['izan','burusoila da',`es ${gx(f,'calvo','calva')}`]);
    else if(f.col==='horia') out.push(['izan','ilehoria da',`es ${gx(f,'rubio','rubia')}`]);
    else if(f.col==='gorria') out.push(['izan','ilegorria da',`es ${gx(f,'pelirrojo','pelirroja')}`]);
    else out.push(['eduki',`ile ${f.col} dauka`,{beltza:'tiene el pelo negro',marroia:'tiene el pelo castaño',urdina:'tiene canas'}[f.col]]);
  }
  if(f.hair!=='soila'){
    const a=hairA(f);
    if(diff(o=>hairA(o)?hairA(o)[0]:-1)) out.push(['eduki',a[0]?'ile luzea dauka':'ile laburra dauka',a[0]?'tiene el pelo largo':'tiene el pelo corto']);
    if(diff(o=>hairA(o)?hairA(o)[1]:-1)) out.push(['eduki',a[1]?'ile kizkurra dauka':'ile lisoa dauka',a[1]?'tiene el pelo rizado':'tiene el pelo liso']);
  }
  if(diff(o=>o.gl)) out.push(['eduki',f.gl?'betaurrekoak dauzka':'ez dauka betaurrekorik',f.gl?'lleva gafas':'no lleva gafas']);
  if(f.sex==='m'){
    if(f.fh==='bizarra'&&diff(o=>o.fh)) out.push(['eduki','bizarra dauka','tiene barba']);
    if(f.fh==='bibotea'){ if(others.some(o=>!o.fh)) out.push(['eduki','bibotea dauka','tiene bigote']); if(others.some(o=>o.fh==='bizarra')) out.push(['eduki','ez dauka bizarrik','no tiene barba']) }
    if(!f.fh){ if(others.some(o=>o.fh==='bizarra')) out.push(['eduki','ez dauka bizarrik','no tiene barba']); if(others.some(o=>o.fh==='bibotea')) out.push(['eduki','ez dauka biboterik','no tiene bigote']) }
  }
  const eu=out.map((s,i)=>i?cap(s[1])+'.':`${s[0]==='izan'?N:N+'k'} ${s[1]}.`).join(' ');
  const es=out.map((s,i)=>i?cap(s[2])+'.':`${N} ${s[2]}.`).join(' ');
  return {eu,es};
}

/* --- ejercicios --- */
// las otras caras se parecen a la buena (cambian 1 o 2 rasgos): así hay que leer bien
function mutate(f){
  const g={...f}, opts=['hair','col','gl']; if(f.sex==='m') opts.push('fh');
  const k=pick(opts,1)[0];
  if(k==='hair'){ g.hair=pick(HAIRS[f.sex].filter(h=>h!==f.hair),1)[0];
    if(g.hair==='soila'){ g.col=null; g.brow=f.old?'urdina':(f.col&&f.col!=='horia'&&f.col!=='gorria'&&f.col!=='urdina'?f.col:'marroia') }
    else if(!g.col){ g.col=f.old?'urdina':pick(['beltza','marroia','horia','gorria'],1)[0]; g.brow=g.col } }
  if(k==='col'){ if(g.hair==='soila') g.old=!g.old, g.brow=g.old?'urdina':'marroia'; else { g.col=pick(HCOL.filter(c=>c!==f.col),1)[0]; g.old=g.col==='urdina'; g.brow=g.col } }
  if(k==='gl') g.gl=!f.gl;
  if(k==='fh') g.fh=pick([null,'bizarra','bibotea'].filter(x=>x!==f.fh),1)[0];
  return g;
}
/* --- explicación de «Deskribatu» (v1.19): el porqué de la frase y, si se falla, qué ha fallado --- */
function spyX(kind,eu,N){
  const w=eu.split(' ');
  if(kind==='izan') return `Dice <b>cómo es</b> → verbo <b>izan</b>: <b>${esc(N)} … da</b>. Con <b>da</b> el sujeto va <b>sin -k</b>.`;
  if(kind==='ilea') return `Dice <b>qué tiene</b> → verbo <b>eduki</b>. Quien tiene lleva <b>-k</b> (<b>${esc(N)}k</b>). <b>Ile ${esc(w[2])}</b> es una sola cosa → <b>dauka</b>, al final.`;
  if(kind==='plural') return `<b>Betaurrekoak</b> es siempre plural (como «las gafas») → <b>dauzka</b>. Y quien tiene lleva <b>-k</b>: <b>${esc(N)}k</b>.`;
  if(kind==='rik'){ const o=w[3], base=o==='betaurrekorik'?'betaurrekoak':'bizarra';
    return `«No tener» va con <b>-rik</b> (<b>${base}</b> → <b>${o}</b>) y con <b>-rik</b> el verbo va en singular: <b>ez dauka</b>${base==='betaurrekoak'?', aunque las gafas sean plural':''}. <b>Ez + verbo</b> van delante.`; }
  if(kind==='aurpegia') return `<b>${esc(cap(w[1]))}</b> es una sola cosa → <b>dauka</b> (no <i>dauzka</i>). Quien tiene lleva <b>-k</b>: <b>${esc(N)}k</b>.`;
  return '';
}
function spyDiag(it,ak){
  const N=norm(it.face.name), want=it.toks, has=t=>ak.includes(t), out=[];
  if(it.kind==='izan'){
    if(has(N+'k')) out.push(`Has puesto <b>${esc(it.face.name)}k</b>: con <b>da</b> no hay -k.`);
    if(has('dauka')) out.push(`Has puesto <b>dauka</b>: esto dice cómo es, no algo que tiene → <b>da</b>.`);
  } else {
    if(has(N)&&!has(N+'k')) out.push(`Falta la <b>-k</b>: con dauka / dauzka, quien tiene es <b>${esc(it.face.name)}k</b>.`);
    if(has('da')) out.push(`Has puesto <b>da</b>: esto es algo que tiene → eduki (<b>dauka</b>).`);
    if(it.kind==='rik'){
      if(has('dauzka')) out.push(`Has puesto <b>dauzka</b>: ${want[3]==='betaurrekorik'?'aunque <b>betaurrekoak</b> sea plural, ':''}con <b>-rik</b> el verbo va siempre en singular → <b>dauka</b>.`);
      if(has('betaurrekoak')||has('bizarra')) out.push(`En negativa, lo que no se tiene lleva <b>-rik</b>: <b>${esc(want[3])}</b>.`);
    } else if(it.kind==='plural'){
      if(has('dauka')) out.push(`Has puesto <b>dauka</b>: <b>betaurrekoak</b> es plural → <b>dauzka</b>.`);
    } else if(has('dauzka')) out.push(`Has puesto <b>dauzka</b>: es una sola cosa → <b>dauka</b>. Dauzka es para varias (betaurrekoak dauzka).`);
  }
  if(!out.length){ const same=ak.length===want.length&&[...ak].sort().join()===[...want].sort().join();
    if(same) out.push(it.kind==='rik'?`Las palabras están bien, falla el orden: en negativa <b>ez + verbo</b> va antes de lo que no se tiene.`:`Las palabras están bien, falla el orden: sujeto, lo que es o tiene y el verbo al final.`);
    else if(ak.length<want.length) out.push(`Falta alguna palabra.`); }
  return out.join(' ');
}
function spyPickEx(){
  const sex=pick(['m','w'],1)[0];
  const t=randFace(sex), fs=[t], seen=new Set([fkey(t)]); let guard=0;
  while(fs.length<4 && guard++<200){ let g=mutate(t); if(Math.random()<.4) g=mutate(g); const k=fkey(g); if(!seen.has(k)){ seen.add(k); fs.push(g) } }
  while(fs.length<4){ const g=randFace(sex); if(!seen.has(fkey(g))){ seen.add(fkey(g)); fs.push(g) } }
  nameFaces(fs);
  const d=describeFace(t,fs.slice(1));
  const opts=shuffle(fs);
  return {t:'spypick',f:t,opts,a:opts.indexOf(t),eu:d.eu,es:d.es};
}
// frases para «Deskribatu»: [euskera, castellano, fichas de relleno]
function spyDescEx(kind){
  for(let g=0;g<60;g++){
    const f=nameFaces([randFace(pick(['m','w'],1)[0])])[0], N=f.name, a=hairA(f);
    let s=null;
    if(kind==='izan'){
      const c=[];
      c.push([`${N} ${f.old?'zaharra':'gaztea'} da`,`${N} es ${f.old?'mayor':'joven'}`]);
      if(f.col==='horia') c.push([`${N} ilehoria da`,`${N} es ${gx(f,'rubio','rubia')}`]);
      if(f.col==='gorria') c.push([`${N} ilegorria da`,`${N} es ${gx(f,'pelirrojo','pelirroja')}`]);
      if(f.hair==='soila') c.push([`${N} burusoila da`,`${N} es ${gx(f,'calvo','calva')}`]);
      const x=pick(c,1)[0]; s=[x[0],x[1],[N+'k','dauka']];
    } else if(kind==='ilea' && a){
      const c=[[a[0]?'luzea':'laburra',a[0]?'largo':'corto'],[a[1]?'kizkurra':'lisoa',a[1]?'rizado':'liso']];
      if(['beltza','marroia','urdina'].includes(f.col)) c.push([f.col,{beltza:'negro',marroia:'castaño',urdina:'canoso'}[f.col]]);
      const x=pick(c,1)[0]; s=[`${N}k ile ${x[0]} dauka`,`${N} tiene el pelo ${x[1]}`,[N,'da','dauzka']];
      if(x[0]==='urdina') s[1]=`${N} tiene canas`;
    } else if(kind==='plural' && f.gl){
      s=[`${N}k betaurrekoak dauzka`,`${N} lleva gafas`,[N,'dauka']];
    } else if(kind==='rik'){
      if(!f.gl) s=[`${N}k ez dauka betaurrekorik`,`${N} no lleva gafas`,['dauzka','betaurrekoak']];
      else if(f.sex==='m'&&!f.fh) s=[`${N}k ez dauka bizarrik`,`${N} no tiene barba`,['dauzka','bizarra']];
    } else if(kind==='aurpegia' && f.fh){
      s=f.fh==='bizarra'?[`${N}k bizarra dauka`,`${N} tiene barba`,[N,'dauzka']]:[`${N}k bibotea dauka`,`${N} tiene bigote`,[N,'dauzka']];
    }
    if(!s) continue;
    const display=s[0].split(' ');
    return {t:'build',lang:'eu',eu:s[0],es:s[1],toks:display.map(tileKey),opt:null,tiles:shuffle([...display,...s[2]]),face:f,kind,x:spyX(kind,s[0],N)};
  }
  return spyDescEx('izan');
}
function spyGame(){
  const nm=3+Math.floor(Math.random()*4); // 3-6 hombres
  const order=shuffle([...Array(9)].map((_,i)=>i<nm?'m':'w'));
  const faces=nameFaces(distinctFaces(9,i=>order[i]));
  return {faces,spy:Math.floor(Math.random()*faces.length),x:new Set(),asked:new Set(),log:[],errs:0,qs:0,cur:null,tried:new Set(),over:false};
}

<div class="warn"><b>Ile urdina</b> son las canas (literalmente, «pelo azul»). En el juego, las canas van con <b>zaharra</b>.</div>`};
function spyLesson(){
  const kinds=pick(['izan','ilea','plural','rik','aurpegia'],3);
  const q=[{t:'tip',g:SPY_TIP}];
  for(let i=0;i<3;i++){ q.push(spyPickEx()); q.push(spyDescEx(kinds[i])) }
  q.push({t:'spygame'});
  return q;
}

function rSpyGame(it,body){
  if(!it.g||it.g.over) it.g=spyGame();
  const G=it.g;
  body.innerHTML=`<div class="q-kind">Galdetu · Espioiaren bila</div><h2 class="q-title">¿Quién es el espía?</h2><p class="g-help">Haz preguntas y <b>toca las caras</b> que no son para tacharlas. Cuando quede una, es tu espía.</p>
  <div class="gboard">${G.faces.map((f,i)=>`<button class="gface${G.x.has(i)?' x':''}" data-f="${i}" aria-label="${esc(f.name)}">${faceHTML(f)}<span class="nm">${esc(f.name)}</span></button>`).join('')}</div>
  <div class="gpanel" id="gpanel"></div><div class="glog" id="glog"></div>`;
  const panel=$('#gpanel'), logEl=$('#glog');
  const upd=()=>{ const left=G.faces.map((_,i)=>i).filter(i=>!G.x.has(i));
    if(left.length===1) setBtn('Hau da espioia!',true,()=>{
      const g=left[0], ok=g===G.spy, S2=G.faces[G.spy]; G.over=true;
      R.first+=G.errs; // cada pregunta mal formulada cuenta como fallo a la primera
      body.querySelectorAll('.gface').forEach((b,i)=>{ if(i===G.spy) b.classList.add('spy'); else if(i===g&&!ok) b.classList.add('bad') });
      const tail=`${G.qs} galdera${G.qs===1?'':'k'}`+(G.errs?` · ${G.errs} pregunta${G.errs>1?'s':''} mal formulada${G.errs>1?'s':''}`:'');
      grade(ok,null, ok?`<b>${esc(S2.name)}</b> da espioia! <small>${tail}</small>`
        :`Espioia <b>${esc(S2.name)}</b> da, ez ${esc(G.faces[g].name)}. <small>${esc(describeFace(S2,G.faces.filter((_,i)=>i!==G.spy)).es)}</small>`);
    });
    else setBtn(left.length?'Tacha hasta que quede una':'Has tachado a todos',false,null);
  };
  const logHTML=()=>G.log.map(l=>`<div class="gl-item"><div class="gl-q">${esc(l.q)}</div><div class="gl-a ${l.yes?'yes':'no'}">${esc(l.a[0])} <small>${esc(l.a[1])}</small></div></div>`).join('');
  const chips=()=>{
    G.cur=null;
    panel.innerHTML=`<div class="g-h">Pregunta por un rasgo</div><div class="gchips">${FEATS.filter(F=>!G.asked.has(F.k)).map(F=>`<button class="gchip" data-k="${F.k}">${esc(F.eu)}<small>${esc(F.es)}</small></button>`).join('')}</div>`;
    panel.querySelectorAll('.gchip').forEach(b=>b.onclick=()=>{ if(R.answered) return; SFX.tap(); ask(FEATS.find(F=>F.k===b.dataset.k)) });
  };
  const ask=F=>{
    const Q=featQs(F), opts=shuffle([[Q.ok,null],...Q.bad]);
    panel.innerHTML=`<div class="g-h">¿Cómo se pregunta? <button class="g-back" id="g-back">‹ otro rasgo</button></div><div class="opts">${opts.map((o,i)=>`<button class="opt gq" data-i="${i}"><span>${esc(o[0])}</span></button>`).join('')}</div><div class="gexp" id="gexp"></div>`;
    springIn(panel.querySelectorAll('.opt'),{y:14,dur:380,step:30,ease:'soft'});
    $('#g-back').onclick=()=>{ SFX.tap(); chips() };
    panel.querySelectorAll('.gq').forEach(b=>b.onclick=()=>{
      if(R.answered||b.disabled) return; const o=opts[+b.dataset.i];
      if(o[1]){ G.errs++; SFX.bad(); vibrate(80); b.classList.add('wrong','shake'); b.disabled=true; $('#gexp').innerHTML=`<b>${esc(o[0])}</b> ✗ ${o[1]}`; $('#gexp').classList.add('on'); return }
      SFX.ok(); G.qs++; G.asked.add(F.k);
      const ans=featAnswer(F,G.faces[G.spy]); G.log.unshift({q:o[0],yes:ans.yes,a:ans.a});
      logEl.innerHTML=logHTML(); const first=logEl.firstElementChild; if(first) springIn([first],{y:-12,dur:420,ease:'soft'});
      speak(ans.a[0]); chips();
    });
  };
  body.querySelectorAll('.gface').forEach(b=>b.onclick=()=>{ if(R.answered) return; SFX.tap(); const i=+b.dataset.f; G.x.has(i)?G.x.delete(i):G.x.add(i); b.classList.toggle('x',G.x.has(i)); upd() });
  logEl.innerHTML=logHTML(); chips(); upd();
}

/* Diccionario de dudas (v1.21; sin traductor desde v1.21.1): busca en la app y, si no está, lleva a Elhuyar */
function srcLabel(w){
  if(!w||!w.src) return '';
  const src=String(w.src);
  if(src.startsWith('deck:')){ const d=allDecks().find(x=>x.id===src.slice(5)); return d?(d.title||'Ficha'):'Ficha' }
  const u=UNITS.find(x=>x.id===src); return u?u.title:'';
}
function looksSpanish(t){
  const s=String(t).toLowerCase(); const nq=norm(t);
  if(/[ñ¿¡áéíóú]/.test(s)) return true;
  if(/tx|tz|ts|rr|k\b|\b(naiz|zara|da|dira|dago|daude|dut|du|ditut|dauka|eta|ez|bai|nire|zure|gure|zer|nola|non|nor|zein|kaixo|egun|bat)\b/.test(s)) return false;
  // si en la app solo aparece en euskera, es euskera
  const ws=Object.values(WORDS); const inEu=ws.some(w=>norm(w.eu).includes(nq)), inEs=ws.some(w=>norm(w.es).includes(nq));
  if(inEu&&!inEs) return false;
  return true;
}
function dictWordHits(raw){
  const nq=norm(raw); const out=[];
  Object.values(WORDS).forEach(w=>{
    const e=norm(w.eu), s=norm(w.es); let sc=0;
    if(e===nq||s===nq) sc=4;
    else if(s.split(/[ ,/]+/).includes(nq)||e.split(' ').includes(nq)) sc=3;
    else if(e.startsWith(nq)||s.startsWith(nq)) sc=2;
    else if(e.includes(nq)||s.includes(nq)) sc=1;
    if(sc) out.push([sc,w]);
  });
  out.sort((a,b)=>b[0]-a[0]||a[1].eu.length-b[1].eu.length);
  return out.slice(0,60).map(x=>x[1]);
}
function dictSentHits(raw){
  const nq=norm(raw); if(nq.length<3) return [];
  const out=[];
  UNITS.forEach(u=>(u.sentences||[]).forEach(t=>{ if(norm(t[0]).includes(nq)||norm(t[1]).includes(nq)) out.push({eu:t[0],es:t[1],u}) }));
  return out.slice(0,8);
}
function hitList(ws){
  return `<ul class="wlist hits">${ws.map(w=>{ const src=srcLabel(w);
    return `<li>${dots(w)}${picOf(w)?picImg(picOf(w),'wthumb'):''}<span class="eu">${esc(w.eu)}${src?`<small class="src">${esc(src)}</small>`:''}</span><span class="es">${esc(w.es)}</span></li>` }).join('')}</ul>`;
}

  return `<div class="card ext"><h3>¿No está, o quieres más?</h3>
    <p class="meta">Se abre el diccionario Elhuyar fuera de la app (hace falta conexión).${words>2?' Elhuyar es un diccionario: con frases largas, busca mejor la palabra que te falta.':''}</p>

}
function fillDictSearch(box){
  const raw=dictQuery;
  if(norm(raw).length<2){ box.innerHTML=`<div class="empty" style="color:#fff">Escribe al menos dos letras.</div>`; return; }
  const res=dictWordHits(raw); const sents=dictSentHits(raw);

  if(res.length) h+=`<div class="card"><h3>En la app</h3>${hitList(res)}</div>`;
  if(sents.length) h+=`<div class="card"><h3>Frases del curso</h3><ul class="wlist hits">${sents.map(t=>`<li><span class="eu">${esc(t.eu)}<small class="src">${esc(t.u.title)}</small></span><span class="es">${esc(t.es)}</span></li>`).join('')}</ul></div>`;
  if(!res.length&&!sents.length) h+=`<div class="empty" style="color:#fff">No está en la app.</div>`;
  h+=extHelp(raw);

/* ---------- torre: estado en S.tower = {floors:[id de unidad en el orden en que se terminaron], roof, cur} ---------- */
const TOWER_LV=['A0','A1'];
const TFLOOR={'a0-1':0,'a0-eus':1,'a0-2':2,'a1-1':3,'a1-2':4,'a1-3':5,'a1-lan':6,'a1-4':7,'a1-nol':8,'a1-gor':9,'a1-nork':10,'a1-fam':11,'a1-ego':12,'a1-non':13};
const TFLOOR_T={'Ordua eta egutegia':14,'Arropa':15,'Nora zoaz?':16,'Gustatzen zait':17};
function towerUnits(){ return UNITS.filter(u=>TOWER_LV.includes(u.level)) }
function unitComplete(u){ return lessonsOf(u).every(l=>S.done[l.id]) }
function unitDoneCount(u){ return lessonsOf(u).filter(l=>S.done[l.id]).length }
function towerInfo(u){ const lv=UNITS.filter(x=>x.level===u.level);
  return {id:u.id, code:u.level+'-'+(lv.indexOf(u)+1), title:u.title, fi:TFLOOR[u.id]??TFLOOR_T[u.title]??UNITS.indexOf(u)} }
function towerAllDone(){ return towerUnits().every(unitComplete) && !ROADMAP.some(r=>TOWER_LV.includes(r[0])) }
function towerSync(){ // pone en la torre, por orden de unidad y sin animación, las unidades terminadas que falten (progreso de antes de v1.23, otro dispositivo…)
  let ch=false, t=S.tower;
  if(!t||!Array.isArray(t.floors)){ t=S.tower={floors:[],roof:false,cur:null}; ch=true }
  t.floors=t.floors.filter(id=>UNITS.some(u=>u.id===id));
  towerUnits().forEach(u=>{ if(!t.floors.includes(u.id)&&unitComplete(u)){ t.floors.push(u.id); ch=true } });
  if(!t.roof&&towerAllDone()){ t.roof=true; ch=true }
  if(t.cur&&(t.floors.includes(t.cur)||!UNITS.some(u=>u.id===t.cur))){ t.cur=null; ch=true }
  return ch;
}
function towerState(){
  const t=S.tower, fl=t.floors.map(id=>UNITS.find(u=>u.id===id)).filter(Boolean), cu=t.cur?UNITS.find(u=>u.id===t.cur):null;
  return {floors:fl.map(towerInfo), roof:!!t.roof, plan:cu?{u:towerInfo(cu),d:unitDoneCount(cu),L:lessonsOf(cu).length}:null,
    total:towerUnits().length+ROADMAP.filter(r=>TOWER_LV.includes(r[0])).length,
    a0n:UNITS.filter(u=>u.level==='A0').length+ROADMAP.filter(r=>r[0]==='A0').length};
}
function towerEvent(u){ // se llama al terminar por primera vez una lección de unidad (S.done ya puesto)
  const t=S.tower, L=lessonsOf(u).length, info=towerInfo(u);
  if(t.floors.includes(u.id)||t.roof) return {k:'mat',u:info,extra:true};          // lección nueva de una unidad que ya tiene planta (unidad ampliada)
  if(unitComplete(u)){
    t.floors.push(u.id); t.cur=null;
    const a0=u.level==='A0'&&UNITS.filter(x=>x.level==='A0').every(unitComplete)&&!ROADMAP.some(r=>r[0]==='A0');
    const roof=towerAllDone(); if(roof) t.roof=true;
    return {k:'floor',u:info,L,a0,roof};
  }
  t.cur=u.id; return {k:'mat',u:info,d:unitDoneCount(u),L};
}
function towerLine(){
  const st=towerState(), n=st.floors.length;
  if(st.roof) return 'Torre terminada, con tejado y paloma';
  if(st.plan) return `En obra: ${st.plan.u.title} · ${st.plan.d} de ${st.plan.L} lecciones`;
  return n?'Cada unidad terminada sube una planta':'Cada lección trae material; cada unidad, una planta';
}

  add(false,'noa zoaz doa goaz zoazte doaz'); add(false,'nator zatoz dator gatoz zatozte datoz');
  add(true,'dut duzu du dugu duzue dute'); add(true,'ditut dituzu ditu ditugu dituzue dituzte');
  add(true,'daukat daukazu dauka daukagu daukazue daukate'); add(true,'dauzkat dauzkazu dauzka dauzkagu dauzkazue dauzkate');

/* v1.41 (aviso de una alumna): si las palabras están bien y solo falla la puntuación, sigue siendo fallo
   (los signos de en medio son obligatorios, v1.12.3), pero la corrección lo dice claro: qué signo falta,
   sobra o está en otro sitio, en lugar de la explicación general de la frase. */
function puncDiag(it,ak){
  const W=a=>a.filter(t=>!PUNCT.test(t)).join(' ');
  if(W(ak)!==W(it.toks)) return null;
  const words=splitTiles(it.lang==='eu'?it.eu:it.es).filter(t=>!PUNCT.test(t));
  const marks=a=>{ const m=[]; let n=-1; a.forEach((t,i)=>{ if(PUNCT.test(t)) m.push({n,t,i}); else n++ }); return m };
  const exp=marks(it.toks), got=marks(ak), K=m=>m.n+m.t;
  const miss=exp.filter(m=>!got.some(g=>K(g)===K(m))), extra=got.filter(g=>!exp.some(m=>K(m)===K(g)));
  if(!miss.length&&!extra.length) return null;
  const NAME={',':'la coma (,)','?':'el signo ?','!':'el signo !','.':'el punto (.)'};
  const where=n=>n<0?'al principio':`después de «${esc(words[n]||'')}»`;
  const parts=[];
  const ex=[...extra];
  miss.forEach(m=>{ const j=ex.findIndex(e=>e.t===m.t);
    if(j>=0){ parts.push(`${NAME[m.t]} va ${where(m.n)}, no ${where(ex[j].n)}`); ex.splice(j,1) }
    else parts.push(`falta ${NAME[m.t]} ${where(m.n)}`) });
  ex.forEach(e=>parts.push(`sobra ${NAME[e.t]} ${where(e.n)}`));
  const txt=parts.join('; '); 
  // fichas que arden: los signos que sobran o están mal y, si falta uno, la palabra después de la que va
  const wordPos=n=>{ let c=-1; for(let i=0;i<ak.length;i++){ if(!PUNCT.test(ak[i])&&++c===n) return i } return -1 };
  const bad=[...extra.map(e=>e.i), ...miss.filter(m=>!extra.some(e=>e.t===m.t)).map(m=>wordPos(m.n))].filter(i=>i>=0);
  return {html:`<b>Las palabras están bien</b>: solo falla la puntuación. ${txt.charAt(0).toUpperCase()+txt.slice(1)}. Los signos de en medio de la frase cuentan; el del final se puede poner o no.`, bad};
}

const DECO=[{x:160,y:-140,d:0},{x:-170,y:40,d:90},{x:140,y:220,d:170}];
function lessonIn(el){
  el._entering=true;
  if(quiet()||!el.animate) return;
  el.animate([{opacity:0},{opacity:1}],{duration:200,easing:'ease-out'});
  el.querySelectorAll('.l-deco i').forEach((c,i)=>{ const o=DECO[i];
    c.animate([{transform:`translate(${o.x}px,${o.y}px) scale(.35)`,opacity:0},{transform:'none',opacity:1}],{duration:1100,delay:60+o.d,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'}) });
  const x=$('.l-x',el); x.animate([{transform:'translateX(-80px) rotate(-90deg)',opacity:0},{transform:'none',opacity:1}],{duration:750,delay:180,easing:EASE.bounce,fill:'backwards'});
  springIn([$('.l-top .bar',el),$('.combo',el)],{y:-24,dur:650,delay:240,step:60});
  springIn([$('.l-foot',el)],{y:90,dur:750,delay:380});
}
// salida: el contenido baja, el botón sale por la izquierda, los círculos se van y el fondo se desvanece
function lessonOut(el,done){
  el.classList.add('leaving');
  if(quiet()||!el.animate){ done(); return }
  const out={duration:220,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'};
  [...$('.l-body',el).children,$('.l-foot',el)].forEach((c,i)=>c&&c.animate([{transform:'none',opacity:1},{transform:'translateY(60px)',opacity:0}],{...out,delay:i*25}));
  $('.l-x',el).animate([{transform:'none',opacity:1},{transform:'translateX(-80px) rotate(-90deg)',opacity:0}],out);
  $('.l-top .bar',el).animate([{transform:'none',opacity:1},{transform:'translateY(-30px)',opacity:0}],out);
  el.querySelectorAll('.l-deco i').forEach((c,i)=>{ const o=DECO[i]; c.animate([{transform:'none',opacity:1},{transform:`translate(${o.x}px,${o.y}px) scale(.4)`,opacity:0}],{duration:320,delay:i*40,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}) });
  let ok=false; const fin=()=>{ if(!ok){ ok=true; done() } };
  el.animate([{opacity:1},{opacity:0}],{duration:200,delay:200,easing:'ease-in',fill:'forwards'}).onfinish=fin; setTimeout(fin,700);
}
// entre ejercicios, los círculos del fondo se desplazan un poco
function decoDrift(el){ if(quiet()||!el) return; el.querySelectorAll('.l-deco i').forEach(c=>{ c.style.translate=`${Math.round(frnd(-40,40))}px ${Math.round(frnd(-50,50))}px` }) }
// cada ejercicio: título y opciones entran escalonados, rápido y con poco rebote
function itemIn(body){
  const L=$('#lesson'), first=L&&L._entering; if(L){ L._entering=false; if(!first) decoDrift(L) }
  const els=body.querySelectorAll('.q-kind,.q-title,.intro,.sentence,.tip,.typebox,.answer-line,.opt,.m,.exs,.qdesc,.desc-face,.g-help,.gface,.gpanel');
  // al entrar en la lección: subida larga con rebote claro; luego, cada ejercicio corto y suave
  if(first) springIn(els,{y:70,dur:750,step:55,delay:200,max:12,ease:'bounce'});
  else springIn(els,{y:16,dur:420,step:32,max:12,ease:'soft'});
  // fichas de «Traduce la frase»: saltan una a una, con retardo entre ellas
  const tiles=body.querySelectorAll('.bank .tile');
  if(tiles.length&&!quiet()) tiles.forEach((t,i)=>t.animate([{transform:'translateY(30px) scale(.6)',opacity:0},{transform:'none',opacity:1}],
    {duration:520,delay:(first?520:200)+i*70,easing:EASE.bounce,fill:'backwards'}));
}
const FXNS='http://www.w3.org/2000/svg';
const frnd=(a,b)=>a+Math.random()*(b-a);
const noMotion=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches }catch(e){ return false } };
function svgEl(tag,attrs,parent){ const e=document.createElementNS(FXNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e }
function fxLayer(root,cls,svg){ const x=svg?svgEl('svg',{}):document.createElement('div'); x.setAttribute('class',cls+' bk'); if(cls==='bk-back') root.insertBefore(x,root.firstChild); else root.appendChild(x); return x }
function clearFx(root,now){
  if(!root) return;
  root.querySelectorAll('.bk').forEach(x=>{
    if(!now&&x.classList.contains('bk-low')&&x.animate) x.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:260,easing:'ease-in',fill:'forwards'}).onfinish=()=>x.remove();
    else x.remove();

}
function bikainChance(n){ return n>=6?.8:n===5?.6:n===4?.3:.1 }

function bikain(root){

      const n=4+(i%2),Lw=W*frnd(.85,1.15),amp=frnd(30,50),pts=[];
      for(let j=0;j<=n;j++) pts.push([-Lw/2+j*Lw/n,(j%2?1:-1)*amp*frnd(.7,1.15)]);

      });

    });

    [bi,bm].forEach(r=>r.animate([{transform:`translateY(${ch}px)`},{transform:'none'}],{duration:300,delay:40,easing:'ease-out',fill:'both'}));
    const puffs=[]; let x=-6; while(x<W+40){ const r=frnd(34,58); puffs.push({x,r,cy:frnd(6,42)+r}); x+=r*1.12 }
    const mid=(puffs.length-1)/2;
    puffs.forEach((p,i)=>{

      svgEl('circle',{cx:p.x,cy:p.cy,r:p.r+4,fill:'#2d0a4e'},gi); svgEl('circle',{cx:p.x,cy:p.cy,r:p.r,fill:'#4ff5a8'},gm);
      if(i%2===0){ const rr=p.r*.68,a1=200*Math.PI/180,a2=250*Math.PI/180;
        svgEl('path',{d:`M${p.x+rr*Math.cos(a1)} ${p.cy+rr*Math.sin(a1)} A${rr} ${rr} 0 0 1 ${p.x+rr*Math.cos(a2)} ${p.cy+rr*Math.sin(a2)}`,fill:'none',stroke:'#d6ffeb','stroke-width':6,'stroke-linecap':'round'},gm) }
      [gi,gm].forEach(g=>{ g.style.transformBox='fill-box'; g.style.transformOrigin='50% 100%';
        g.animate([{transform:`translateY(${ch}px) scale(.5)`},{transform:'translateY(-12px) scale(1.08)',offset:.7},{transform:'none'}],{duration:480,delay:50+Math.abs(i-mid)*32,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'both'}) });
    });
    // rayitos alrededor de la palabra
    for(let i=0;i<8;i++){
      const th=(i*45+22)*Math.PI/180,rx=W*.38,ry=95;

      z.style.left=(cx-15)+'px'; z.style.top=(cy-28)+'px'; front.appendChild(z);
      const rot=th*180/Math.PI+90,dx=Math.cos(th),dy=Math.sin(th);
      z.animate([

        {transform:`translate(${dx*rx}px,${dy*ry}px) rotate(${rot}deg) scale(1.15)`,opacity:1,offset:.45},
        {transform:`translate(${dx*rx*1.12}px,${dy*ry*1.12}px) rotate(${rot}deg) scale(1)`,opacity:1,offset:.75},
        {transform:`translate(${dx*rx*1.25}px,${dy*ry*1.25}px) rotate(${rot}deg) scale(0)`,opacity:0}

    for(let i=0;i<16;i++){

      g.style.left=(cx-8)+'px'; g.style.top=(cy-8)+'px'; front.appendChild(g);
      const th=frnd(0,Math.PI*2),dist=frnd(110,200),dx=Math.cos(th)*dist,dy=Math.sin(th)*dist*.75,spin=frnd(-220,220);

        {transform:`translate(${dx}px,${dy+70}px) rotate(${45+spin}deg) scale(.5)`,opacity:0}],{duration:1050,delay:110,easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'});
    }
    const body=$('#l-body');
    if(body) body.animate([{transform:'none'},{transform:'translate(-6px,3px)'},{transform:'translate(6px,-3px)'},{transform:'translate(-4px,2px)'},{transform:'translate(2px,-1px)'},{transform:'none'}],{duration:320,delay:90});
  }
  // la palabra
  const wd=document.createElement('div'); wd.className='bk-word';
  wd.innerHTML=`<span class="in"><span class="b">${esc(eu.toUpperCase())}</span><span class="f">${esc(eu.toUpperCase())}</span></span><span class="es">${esc(es)}</span>`;
  front.appendChild(wd);
  const inn=wd.firstChild, maxW=W-24;
  if(inn.offsetWidth>maxW) inn.style.fontSize=Math.floor(70*maxW/inn.offsetWidth)+'px';
  const sk='skewX(-8deg)';
  inn.animate([{transform:`${sk} scale(0) rotate(-25deg)`},{transform:`${sk} scale(1.3) rotate(4deg)`,offset:.45},{transform:`${sk} scale(.92) rotate(-2deg)`,offset:.65},{transform:`${sk} scale(1.04)`,offset:.82},{transform:`${sk} scale(1)`}],{duration:620,easing:'ease-out',fill:'both'});
  wd.lastChild.animate([{opacity:0,transform:'translateY(-8px) scale(.6)'},{opacity:1,transform:'none'}],{duration:240,delay:380,easing:'cubic-bezier(.3,1.6,.5,1)',fill:'both'});
  const bw='translate(-50%,-50%) rotate(-7deg)';
  wd.animate([{opacity:1,transform:bw},{opacity:0,transform:bw+' translateY(-24px) scale(1.25)'}],{duration:260,delay:1600,easing:'ease-in',fill:'forwards'}).onfinish=()=>front.remove();
  return eu;
}
function flameD(w,h,lean){ return `M${-w} 0 C${-w*1.15} ${-h*.42} ${lean-w*.2} ${-h*.68} ${lean} ${-h} C${lean+w*.3} ${-h*.66} ${w*1.15} ${-h*.42} ${w} 0 A${w} ${w*.75} 0 0 1 ${-w} 0 Z` }
function flame(parent,x,y,w,h,delay){
  const g=svgEl('g',{transform:`translate(${x} ${y})`},parent); const lean=frnd(-w*.6,w*.6);
  [[1,'#ff4d3a',4],[.68,'#ffad3b',0],[.38,'#f7ee55',0]].forEach(([s,f,sw])=>{
    const p=svgEl('path',{d:flameD(w*s,h*s,lean*s),fill:f,stroke:sw?'#2d0a4e':'none','stroke-width':sw,'stroke-linejoin':'round'},g);
    p.style.transformBox='fill-box'; p.style.transformOrigin='50% 100%';
    p.animate([{transform:'scale(0)'},{transform:'scale(1.1)',offset:.7},{transform:'scale(1)'}],{duration:360,delay,easing:'ease-out',fill:'both'})
      .onfinish=()=>{ if(p.isConnected) p.animate([{transform:'scale(1,1) skewX(0deg)'},{transform:`scale(.94,1.12) skewX(${frnd(-6,6)}deg)`},{transform:'scale(1.04,.92) skewX(0deg)'}],{duration:frnd(260,420),iterations:Infinity,direction:'alternate',easing:'ease-in-out'}) };
  });
}
// fallo: arden las fichas mal colocadas; si todas están bien pero falta alguna, arde el hueco del final
function fuego(root,badTiles,lastTile){
  badTiles.forEach((t,i)=>setTimeout(()=>t.classList.add('burn'),80+i*60));
  if(!root||!root.animate||noMotion()) return;
  clearFx(root,true);
  const W=root.clientWidth,H=root.clientHeight,rr=root.getBoundingClientRect();
  const spots=badTiles.map(t=>t.getBoundingClientRect());
  if(!spots.length&&lastTile){ const b=lastTile.getBoundingClientRect(); spots.push({left:b.right+8,top:b.top,width:52,height:b.height}) }
  if(!spots.length) return;
  const front=fxLayer(root,'bk-front');
  const sv=fxLayer(root,'bk-front',true); sv.setAttribute('viewBox',`0 0 ${W} ${H}`);
  spots.forEach((b,i)=>{
    const bx=b.left-rr.left, by=b.top-rr.top+6, g=svgEl('g',{},sv), n=Math.max(2,Math.round(b.width/26));
    for(let k=0;k<n;k++) flame(g,bx+(k+.5)*b.width/n,by,frnd(9,13),frnd(28,44),100+i*60+k*40);
    g.animate([{opacity:1},{opacity:1,offset:.7},{opacity:0}],{duration:1500,delay:i*60,fill:'both'});
    for(let k=0;k<4;k++){ // chispas
      const d=document.createElement('div'); d.className='bk-dot'; const s=frnd(5,9);
      d.style.cssText+=`width:${s}px;height:${s}px;background:${k%2?'#ffad3b':'#f7ee55'};border:2px solid #2d0a4e;left:${bx+frnd(0,b.width)}px;top:${by}px`;
      front.appendChild(d);
      d.animate([{transform:'translate(0,0) scale(.4)',opacity:0},{transform:`translate(${frnd(-20,20)}px,-40px) scale(1)`,opacity:1,offset:.2},{transform:`translate(${frnd(-50,50)}px,${-frnd(120,220)}px) scale(.3)`,opacity:0}],{duration:frnd(1100,1600),delay:frnd(0,400),easing:'ease-out',fill:'both'});
    }
    for(let k=0;k<3;k++){ // humo
      const sm=document.createElement('div'); sm.className='bk-dot'; const sz=frnd(14,22);
      sm.style.cssText+=`width:${sz}px;height:${sz}px;background:rgba(80,70,100,.45);left:${bx+frnd(0,b.width)}px;top:${by-10}px`;
      front.appendChild(sm);
      sm.animate([{transform:'translateY(0) scale(.5)',opacity:0},{opacity:.9,offset:.3},{transform:`translate(${frnd(-15,15)}px,-70px) scale(1.6)`,opacity:0}],{duration:1200,delay:500+k*150+i*60,easing:'ease-out',fill:'both'});
    }
  });
  setTimeout(()=>{ sv.remove(); front.remove() },2100);
}

/* corrección común */
function grade(ok,info,msg,sayEu){
  R.answered=true;
  const it=cur(); const firstTry=!R.retried.has(it);
  R.fbCtx=fbCtx(it);
  if(firstTry){ R.first++; if(ok && !(it.hinted&&R.meta&&R.meta.reto)) R.firstOk++; noteSeen(it,ok) }
  let mastered=false;
  if(info&&info.word){ srsSeen(info.word); mastered=srsGrade(info.word,ok,info.strong) }
  if(ok){ R.done++; R.combo++; R.maxCombo=Math.max(R.maxCombo,R.combo); SFX.ok();
    const c=$('#l-combo'); if(R.combo>=3){ c.textContent='🔥 ×'+R.combo; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); if(R.combo%5===0) setTimeout(SFX.combo,250) } }
  else { R.combo=0; $('#l-combo').classList.remove('on'); SFX.bad(); vibrate(120); $('#l-body').classList.add('shake'); setTimeout(()=>$('#l-body')&&$('#l-body').classList.remove('shake'),400);
    R.retried.add(it); R.queue.push(it); }
  setProgress();
  const praise=['Bikain!','Oso ondo!','Zuzena!','Primeran!','Ederki!']; // en euskera no se usa «¡»
  $('#s-t').textContent= ok? praise[Math.floor(Math.random()*praise.length)] : 'Ez da zuzena';
  $('#s-ic').innerHTML= ok? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12c270" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d8445c" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  $('#s-b').innerHTML=(msg||'')+(sayEu&&canSpeak()?` ${spkBtn(sayEu)}`:'');
  if(info&&info.word&&synNote(info.word)) $('#s-b').insertAdjacentHTML('beforeend',`<span class="why">${synNote(info.word)}</span>`);
  if(mastered) $('#s-b').insertAdjacentHTML('beforeend',`<div class="lx-note"><img src="img/latxi-maiteminduta.webp" alt="Latxi enamorada" draggable="false"><span><b>${esc(info.word.eu)}</b>: palabra dominada. Ya está en la última caja del repaso.</span></div>`);
  $('#s-btn').className='btn wide '+(ok?'btn-green':'btn-red');
  $('#l-sheet').className='sheet show '+(ok?'ok':'bad');
  setTimeout(()=>act($('#s-ch'),ok?'jump':'sad'),120);
  $('#l-btn').style.visibility='hidden';
  if(sayEu&&ok&&canSpeak()) setTimeout(()=>speak(sayEu),150);
  saveRun(R.i+1);
}
function next(){ SFX.tap(); advance() }
function advance(){
  R.answered=false; R.i++;
  if(R.i>=R.queue.length) return finish();
  // mezcla: si el siguiente es un reintento, sepáralo un poco
  showItem();
}

   FINAL DE LECCIÓN · celebraciones (v1.9)
   Orden de prioridad (sale solo una):
   0. nivel terminado (A0, A1, A2…: todas sus unidades hechas y ninguna pendiente en ROADMAP) → Latxi dorada
   1. unidad terminada (la última lección que faltaba) → Latxi con toga
   2. la racha llega a 3, 7, 14, 30, 50, 100… días → cápsula de fuego
   3. repaso → cápsula del fantasma (palabras olvidadas)
   4. sin fallos: Gramatika / Praktika → Latxi indartsu; resto → Uxue y el aitona con el examen
   5. menos del 60 % a la primera → cápsula «Dena ondo dago…» (la casa en llamas)
   Si no, final normal (los tres personajes), también con los datos animados.
   ========================================================= */

function pickCel(c){
  if(c.levelDone) return 'maila';
  if(c.unitDone) return 'toga';

function lostStreak(){ const t=today(), days=S.days||{};
  if(days[t]) return null;
  const ds=Object.keys(days).filter(d=>days[d]>0&&d<t).sort(), last=ds[ds.length-1];
  if(!last||last>=addDays(t,-1)||S.lostAck===last) return null;

function showGuide(manual){
  if($('#guide')) return;
  const P=guidePages(), N=P.length, q=quiet();
  const el=document.createElement('div'); el.id='guide'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Cómo funciona Ikasi!');
  el.innerHTML=`<div class="gd-deco" style="width:340px;height:340px;left:-120px;top:-90px"></div><div class="gd-deco" style="width:220px;height:220px;right:-70px;top:34%"></div><div class="gd-deco" style="width:420px;height:420px;left:10%;bottom:-260px"></div>
    <div class="gd-top"><span class="gd-n" id="gd-n">1 / ${N}</span><button class="gd-skip" id="gd-skip">Saltatu <small>· saltar</small></button></div>
    <div class="gd-track" id="gd-track">${P.map((p,i)=>`<section class="gd-p" aria-label="${i+1} / ${N}"><div class="gd-in"><div class="gd-st"><div class="gd-sc">${p.st}</div></div><h2 class="gd-h gd-a" style="--d:1">${p.h}</h2><p class="gd-es gd-a" style="--d:2">${p.es}</p><div class="gd-card gd-a" style="--d:3">${p.li.join('')}</div></div></section>`).join('')}</div>
    <div class="gd-bot"><div class="gd-dots" id="gd-dots">${P.map((_,i)=>`<button aria-label="Página ${i+1}"></button>`).join('')}</div>
      <button class="btn btn-white gd-back" id="gd-back" aria-label="Atzera · anterior">${GI.back}</button><button class="btn btn-green gd-next" id="gd-next">Hurrengoa</button></div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  const tr=$('#gd-track',el), pages=[...el.querySelectorAll('.gd-p')], dots=[...el.querySelectorAll('#gd-dots button')], deco=[...el.querySelectorAll('.gd-deco')];
  const nx=$('#gd-next',el), bk=$('#gd-back',el); let cur=-1, closing=false;
  const setPage=i=>{ if(i===cur) return; cur=i;
    pages.forEach((p,k)=>p.classList.toggle('on',k===i)); dots.forEach((d,k)=>d.classList.toggle('on',k===i));
    $('#gd-n',el).textContent=`${i+1} / ${N}`; bk.style.visibility=i?'visible':'hidden';
    nx.textContent=i===N-1?'Hasi!':'Hurrengoa'; nx.classList.toggle('btn-yellow',i===N-1); nx.classList.toggle('btn-green',i<N-1);
    $('#gd-skip',el).style.visibility=i===N-1?'hidden':'visible';
    if(!q) deco.forEach((d,k)=>{ d.style.transform=`translate(${Math.sin(i*1.7+k*2)*40}px,${Math.cos(i*1.3+k)*30}px)` }) };
  const go=i=>{ i=Math.max(0,Math.min(N-1,i)); tr.scrollTo({left:i*tr.clientWidth,behavior:q?'auto':'smooth'}); setPage(i) };
  let st=null; tr.addEventListener('scroll',()=>{ clearTimeout(st); st=setTimeout(()=>{ const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)); if(i!==cur){ SFX.tap(); setPage(i) } },90) },{passive:true});
  const close=()=>{ if(closing) return; closing=true; guideMark(); if(!manual) newsMark(); document.removeEventListener('keydown',key);
    const fin=()=>{ el.remove(); document.body.style.overflow=''; toTop(); if(!manual) viewIn(); setTimeout(checkNews,300); setTimeout(checkLost,400) };
    if(q||!el.animate) return fin();
    el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(40px) scale(.97)'}],{duration:340,easing:'ease-in',fill:'forwards'}).onfinish=fin };
  const key=e=>{ if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') close() };
  document.addEventListener('keydown',key);
  nx.onclick=()=>{ SFX.tap(); if(cur===N-1){ SFX.ok&&SFX.ok(); close() } else go(cur+1) };
  bk.onclick=()=>{ SFX.tap(); go(cur-1) };
  $('#gd-skip',el).onclick=()=>{ SFX.tap(); close() };
  dots.forEach((d,k)=>d.onclick=()=>{ SFX.tap(); go(k) });
  if(!q&&el.animate) el.animate([{opacity:0},{opacity:1}],{duration:260,easing:'ease-out'});
  setPage(0);
}

const NEWS_KEY='ikasi-news';
let NEWS_DONE=false;
const verN=v=>String(v||'0').split('.').map(Number).reduce((a,n,i)=>a+n*Math.pow(1000,2-i),0);
function newsSeen(){ let ls=''; try{ ls=localStorage.getItem(NEWS_KEY)||'' }catch(e){} return verN(S.newsSeen)>=verN(ls)?(S.newsSeen||''):ls }
function newsMark(){ const v=NEWS[0].v; S.newsSeen=v; save(); try{ localStorage.setItem(NEWS_KEY,v) }catch(e){} }
function newsUnseen(){ const seen=newsSeen();
  if(!seen) return NEWS.slice(0,1); // quien ya usaba la app antes de que hubiera novedades: solo la última versión
  return NEWS.filter(n=>verN(n.v)>verN(seen)).slice(0,3) }
function checkNews(){ if(NEWS_DONE) return;
  if(!GUIDE_DONE&&!guideSeen()){ setTimeout(checkNews,600); return } // la guía va primero
  if(BOOT||R||document.querySelector('.modal-bg,#finish,#dorrea,#guide')){ setTimeout(checkNews,600); return }
  NEWS_DONE=true; const list=newsUnseen(); if(!list.length) return;
  showNews(list) }
function newsItems(list){ let k=0;
  return list.flatMap(n=>n.items).slice(0,5).map(([ic,c,t,x])=>`<div class="nw-it" style="--d:${k++}"><i style="--c:${c}">${NI[ic]||NI.star}</i><div><b>${esc(t)}</b><span>${esc(x)}</span></div></div>`).join('') }
function showNews(list,history){
  const v=list[0].v;
  modal(`<div class="nw${history?' hist':''}">
    ${history?'':`<div class="nw-hero"><span class="nw-tag">Berria!</span><img src="img/latxi-agurra.webp" alt="Latxi saluda" draggable="false"></div>`}
    <h2>Zer berri? <small>${history?'todas las novedades':'novedades · versión '+esc(v)}</small></h2>
    ${history?list.map(n=>`<div class="nw-v">Versión ${esc(n.v)}</div><div class="nw-list">${newsItems([n])}</div>`).join(''):`<div class="nw-list">${newsItems(list)}</div>`}
    <div class="acts"><button class="btn btn-green wide" id="nw-ok">${history?'Ados':'Ederki!'}</button>${history?'':'<button class="nw-all" id="nw-all">Ver novedades anteriores</button>'}</div></div>`,(m,close)=>{
    if(!history) newsMark();
    const done=()=>{ SFX.tap(); close(); if(!history) setTimeout(checkLost,400) };
    $('#nw-ok',m).onclick=done;
    const all=$('#nw-all',m); if(all) all.onclick=()=>{ SFX.tap(); close(); showNews(NEWS,true) };
    m.addEventListener('click',e=>{ if(e.target===m&&!history) setTimeout(checkLost,400) });
    if(!history&&!quiet()) SFX.pair();
  });
}

/* =========================================================
   AVISOS DE ERROR E IDEAS (v1.33)
   La app manda el aviso al servicio ikasi-feedback (Cloud Run, proyecto andrea-colas-bot,
   europe-southwest1), que lo reenvía por Telegram (@feedback_ikasi_bot) al propietario.
   El token del bot está solo en el servidor. Sin conexión, el aviso se guarda en el navegador
   (FBQ_KEY, como mucho 10) y se manda cuando vuelve la red. No es para dudas de euskera.
   ========================================================= */
const FB_URL='https://ikasi-feedback-kphk77lsva-no.a.run.app/feedback', FBQ_KEY='ikasi-fbq';
const FB_SRC=/jr-motion/.test(location.hostname)?'web-app':/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'prueba':'artefacto';
// El artefacto de Claude no deja conectar con otros servidores (CSP): ahí no se puede enviar.
const FB_CAN=FB_SRC!=='artefacto';
const FB_TYPES={mc:'opción múltiple',pic:'elige la imagen',match:'unir parejas',type:'escribir en euskera',drill:'hueco',spypick:'espía · elegir cara',spygame:'espía · quién es quién'};
function fbCtx(it){
  const m=(R&&R.meta)||{}, c={v:NEWS[0].v, lesson:[m.title,m.id].filter(Boolean).join(' · ')+(m.reto?' · reto':'')};
  if(!it) return c;
  try{
    c.type= it.t==='build'?(it.face?'deskribatu':'traduce la frase'+(it.lang==='eu'?' (al euskera)':' (al castellano)')) : it.t==='drill'&&it.d&&it.d.gen?'hueco generado' : (FB_TYPES[it.t]||it.t);
    if(it.t==='drill'){ const d=it.d; c.q=d.q; c.opts=d.o; c.answer=d.s.replace('___',d.o[d.a]); c.x=d.x }
    else if(it.t==='mc'){ c.q=it.dir==='eu'?'¿Qué significa '+it.w.eu+'?':'¿Cómo se dice «'+it.w.es+'»?'; c.opts=it.opts; c.answer=it.opts[it.a] }
    else if(it.t==='pic'){ c.q='¿Cuál es '+it.w.eu+'?'; c.answer=it.w.eu+' = '+it.w.es }
    else if(it.t==='type'){ c.q='«'+it.w.es+'»'; c.answer=it.w.eu }
    else if(it.t==='build'){ c.q=it.lang==='eu'?it.es:it.eu; c.answer=it.lang==='eu'?it.eu:it.es; c.x=it.x }
    else if(it.t==='match'){ c.q=it.pairs.map(w=>w.eu+' = '+w.es).join(' · ') }
    else if(it.t==='kont'){ c.q=it.rows.map(r=>r.s+' → '+r.a).join(' · ') }
    const b=$('#l-body'), sel=b&&b.querySelector('.opt.sel span:last-child'), tb=$('#tb'), ans=$('#ans');
    c.given= sel?sel.textContent : tb?tb.value : ans?[...ans.querySelectorAll('.tile')].map(t=>t.textContent).join(' ') : '';
  }catch(e){}
  return c;
}
function fbQueue(){ try{ const q=JSON.parse(localStorage.getItem(FBQ_KEY)||'[]'); return Array.isArray(q)?q:[] }catch(e){ return [] } }
function fbSaveQ(q){ try{ q.length?localStorage.setItem(FBQ_KEY,JSON.stringify(q.slice(-10))):localStorage.removeItem(FBQ_KEY) }catch(e){} }
async function fbPost(p){ // text/plain: petición simple, sin preflight de CORS
  const r=await fetch(FB_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(p)}); return r.status }
async function fbSend(p){
  if(navigator.onLine===false){ fbSaveQ([...fbQueue(),p]); return 'queued' }
  try{ const st=await fbPost(p);
    if(st===200){ setTimeout(fbFlush,800); return 'ok' }
    if(st===429) return 'rate';
    if(st>=500){ fbSaveQ([...fbQueue(),p]); return 'queued' }
    return 'fail' }
  catch(e){ fbSaveQ([...fbQueue(),p]); return 'queued' }
}
let FB_BUSY=false;
async function fbFlush(){
  if(!FB_CAN||FB_BUSY||navigator.onLine===false) return; let q=fbQueue(); if(!q.length) return; FB_BUSY=true;
  try{ while(q.length){ let st; try{ st=await fbPost(q[0]) }catch(e){ break }
    if(st===200||(st>=400&&st<500&&st!==429)){ q.shift(); fbSaveQ(q) } else break } }
  finally{ FB_BUSY=false }
}
addEventListener('online',()=>setTimeout(fbFlush,1500));
setTimeout(fbFlush,6000);
function showFeedback(kind,ctx){
  if(document.querySelector('.fb')) return; // ya abierta (p. ej. Enter sobre el botón)
  try{ document.activeElement&&document.activeElement.blur() }catch(e){}
  const err=kind==='akatsa';
  if(!FB_CAN){ modal(`<div class="fb"><h2>${err?'Akatsa?':'Ideiak eta iruzkinak'} <small>${err?'¿hay un error en este ejercicio?':'ideas y comentarios sobre la app'}</small></h2><p class="fb-note">Desde la versión de la app de Claude no se pueden enviar avisos: no deja conectar con otros servidores. <b>Ábrela como web-app</b> (la del enlace de Ikasi!) y envíalo desde allí.</p><div class="acts"><button class="btn btn-green wide" id="fb-no">Ados</button></div></div>`,(m,close)=>{ $('#fb-no',m).onclick=()=>{ SFX.tap(); close() } }); return }
  const opts=err?['La respuesta correcta está mal','Mi respuesta también debería valer','La explicación está mal o no se entiende','Otra cosa']:['Idea para la app','Comentario'];
  const nm=S.name&&S.name!=='Ikaslea'?S.name:'';
  modal(`<div class="fb">
    <h2>${err?'Akatsa? <small>¿hay un error en este ejercicio?</small>':'Ideiak eta iruzkinak <small>ideas y comentarios sobre la app</small>'}</h2>
    <p class="fb-note">${err?'Nos llega el ejercicio con tu respuesta para revisarlo.':'Propón algo que añadir o mejorar, o cuéntanos qué no te convence.'} <b>No es para dudas de euskera</b>: para eso está tu irakasle${err?', y el porqué de cada fallo ya sale en la corrección':''}.</p>
    <div class="fb-ch" id="fb-ch">${opts.map((o,i)=>`<button type="button" data-i="${i}"${i===0?' class="on"':''}>${esc(o)}</button>`).join('')}</div>
    <textarea id="fb-t" maxlength="1000" placeholder="${err?'Cuéntanos qué está mal (opcional)':'Escribe aquí tu idea o comentario'}"></textarea>
    <input type="text" id="fb-n" maxlength="40" autocomplete="off" placeholder="Tu nombre (opcional)" value="${esc(nm)}">
    <input type="text" id="fb-w" class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="acts"><button class="btn btn-green wide" id="fb-ok">Bidali · enviar</button><button class="btn btn-white wide" id="fb-no">Utzi · cancelar</button></div></div>`,(m,close)=>{
    let sel=0; const t=$('#fb-t',m), ok=$('#fb-ok',m);
    const need=()=>!err||sel===opts.length-1; // ideas y «Otra cosa»: con texto
    const upd=()=>{ ok.disabled=need()&&t.value.trim().length<3; t.placeholder= err&&sel===opts.length-1?'Cuéntanos qué pasa':(err?'Cuéntanos qué está mal (opcional)':'Escribe aquí tu idea o comentario') };
    m.querySelectorAll('#fb-ch button').forEach(b=>b.onclick=()=>{ SFX.tap(); sel=+b.dataset.i; m.querySelectorAll('#fb-ch button').forEach(x=>x.classList.toggle('on',x===b)); upd() });
    t.oninput=upd; upd();
    $('#fb-no',m).onclick=()=>{ SFX.tap(); close() };
    ok.onclick=async()=>{
      if(ok.disabled) return; ok.disabled=true; ok.textContent='Bidaltzen…';
      const txt=t.value.trim();
      const p={kind: err?'akatsa':(sel===0?'ideia':'iruzkina'), text: err?('['+opts[sel]+']'+(txt?' '+txt:'')):txt, ctx: err?(ctx||fbCtx(null)):{v:NEWS[0].v}, src:FB_SRC, name:$('#fb-n',m).value.trim().slice(0,40), web:$('#fb-w',m).value};
      const r=await fbSend(p);
      if(r==='ok'||r==='queued'){ close(); SFX.ok(); toast(r==='ok'?'Bidalita! Eskerrik asko':'Sin conexión: se enviará luego', r==='ok'?'latxi-maiteminduta':null) }
      else { ok.disabled=false; ok.textContent='Bidali · enviar'; toast(r==='rate'?'Demasiados avisos: espera unos minutos':'No se ha podido enviar') }
    };
  });
}

/* confeti */
let CONF_STOP=false;
function confetti(){
  const cv=$('#confetti'); cv.classList.remove('hidden'); const ctx=cv.getContext('2d');
  const W=cv.width=innerWidth, H=cv.height=innerHeight; const cols=['#4ff5a8','#b1fbfb','#f7ee55','#fb6ee8','#ffad3b','#ffffff','#2d0a4e'];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0; CONF_STOP=false; (function f(){ t++; if(CONF_STOP) t=999; ctx.clearRect(0,0,W,H); P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(t<150) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.classList.add('hidden') } })();
}

async function loadStaticDecks(){

    const list=await r.json();
    CLOUD_DECKS=(Array.isArray(list)?list:[]).map(d=>Object.assign({},d,{cloud:true})).filter(d=>d.id&&Array.isArray(d.words));
    rebuildIndex(); if(!R){ renderTop(); if(TAB==='dict') fillDict() }
  }catch(e){}
}
