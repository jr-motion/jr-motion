<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ikasi! · Euskera A0–A2</title>
<style>@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format('woff2')}</style>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ikasi!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#62d6ff">
<style>
:root{
  --ink:#2d0a4e; --ink2:#5b3f7a; --white:#fff;
  --mint:#4ff5a8; --mint-d:#12c270; --mint-l:#d6ffeb;
  --cyan:#b1fbfb; --cyan-d:#5ad3e6; --cyan-l:#effefe;
  --yellow:#f7ee55; --yellow-d:#c3b92b; --yellow-l:#fffbd2;
  --pink:#fb6ee8; --pink-d:#c43fbe; --pink-l:#ffe2fb;
  --coral:#ff7c8f; --coral-d:#d8445c; --coral-l:#ffe1e6;
  --orange:#ffad3b; --orange-d:#e07a12;
  --plum:#4b1446; --plum-d:#2a0b33;
  --sky1:#62d6ff; --sky2:#3f98ff; --sky3:#6a7dff;
  --panel:rgba(255,255,255,.28); --panel-deep:rgba(38,62,190,.30);
  --bw:4px; --r:24px;
  /* alias que usa el contenido de gramática */
  --green:var(--mint-d); --green-d:#0b8f52; --green-l:var(--mint-l);
  --red:var(--coral-d); --red-d:#b3324a; --red-l:var(--coral-l);
  --gold:var(--yellow); --gold-d:#a39a1c; --gold-l:var(--yellow-l);
  --blue:#3f98ff; --blue-d:#2b5fd6; --blue-l:var(--cyan-l);
  --purple:#7b2fd0; --purple-d:#5b1fa6;
  --line:#d9d2e6; --soft:#f3f0f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky3)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 48%,var(--sky3) 100%) fixed}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-weight:700;color:var(--ink)}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 14px 8px;background:linear-gradient(180deg,var(--sky1) 70%,rgba(98,214,255,0))}
.top .l{display:flex;justify-content:flex-end}.top .r{display:flex;gap:8px}
.chip{height:46px;min-width:80px;padding:0 14px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;font-size:17px;
  background:linear-gradient(180deg,#5a1a4e,var(--plum-d));border:3px solid #6e2d63;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.chip svg{width:22px;height:22px}
.chip.fire svg{color:#ffb020}.chip.gem svg{color:#ffe14a}
.chip.round{min-width:46px;width:46px;padding:0}
.chip:active{transform:translateY(2px)}
.avatar{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(180deg,#6e2d63,var(--plum-d));box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#5fc616}
.avatar:active{transform:scale(.94)}

/* ---------- botones con borde y labio ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px 18px;border-radius:22px;font-size:19px;font-weight:900;letter-spacing:-.2px;
  border:var(--bw) solid var(--ink);color:var(--ink);background:var(--cyan);box-shadow:inset 0 -7px 0 var(--cyan-d);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cyan-d)}
.btn-green{background:var(--mint);box-shadow:inset 0 -7px 0 var(--mint-d)}
.btn-green:active:not(:disabled){box-shadow:inset 0 -3px 0 var(--mint-d)!important}
.btn-red{background:var(--coral);box-shadow:inset 0 -7px 0 var(--coral-d)}
.btn-red:active:not(:disabled){box-shadow:inset 0 -3px 0 var(--coral-d)!important}
.btn-blue,.btn-ghost{background:var(--cyan);box-shadow:inset 0 -7px 0 var(--cyan-d)}
.btn-yellow{background:var(--yellow);box-shadow:inset 0 -7px 0 var(--yellow-d)}
.btn-pink{background:var(--pink);box-shadow:inset 0 -7px 0 var(--pink-d)}
.btn-white{background:#fff;box-shadow:inset 0 -7px 0 #cfc7de}
.btn:disabled{background:#c9d3f5;color:#7c74a8;border-color:#7c74a8;box-shadow:inset 0 -7px 0 #a8b3e0;cursor:default}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px 12px;font-size:15px;border-radius:18px;border-width:3px;box-shadow:inset 0 -5px 0 var(--cyan-d)}
.btn.sm.btn-green{box-shadow:inset 0 -5px 0 var(--mint-d)}
.btn .stk{position:absolute;left:-14px;top:50%;width:54px;height:54px;transform:translateY(-50%) rotate(-10deg);filter:drop-shadow(0 3px 0 var(--ink))}

/* ---------- títulos tipo pastilla ---------- */
.pillhead{display:inline-block;background:var(--ink);color:#fff;border-radius:30px;padding:10px 24px;font-size:20px;font-weight:900;letter-spacing:-.3px}
.wordmark{font-weight:900;color:#fff;letter-spacing:-1px;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}

/* ---------- panel de bienvenida ---------- */
.hero{margin:6px 14px 6px;padding:14px 16px 0;border-radius:var(--r);background:var(--panel);display:flex;align-items:flex-end;gap:10px;min-height:170px;position:relative;overflow:hidden}
.hero .h-txt{flex:1;padding-bottom:16px}
.hero .bub{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:22px;font-weight:900;position:relative;margin-bottom:10px}
.hero .bub::after{content:"";position:absolute;right:-10px;bottom:12px;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg)}
.hero .goal-line{display:flex;align-items:center;gap:10px;font-size:14px}
.hero .goal-line .ring{width:50px;height:50px;flex:none}
.hero .hc{height:156px;flex:none;align-self:flex-end;cursor:pointer}
.next-review{margin:10px 14px;padding:12px 14px;border-radius:20px;background:var(--yellow);border:var(--bw) solid var(--ink);box-shadow:inset 0 -6px 0 var(--yellow-d);display:flex;align-items:center;gap:12px;font-size:14px}
.next-review b{font-size:16px}
.next-review .btn{margin-left:auto}

/* ---------- camino ---------- */
.level-h{margin:28px 14px 6px;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 0 rgba(45,10,78,.35)}
.level-h::before,.level-h::after{content:"";flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.ublock{margin:34px 14px 8px;border-radius:var(--r);background:var(--panel-deep);padding:30px 0 10px;position:relative}
.unit{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:440px;background:var(--ink);color:#fff;border-radius:30px;padding:8px 10px 8px 20px;display:flex;align-items:center;gap:10px}
.unit .u-txt{flex:1;min-width:0}
.unit small{color:var(--uc,#b1fbfb);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:900}
.unit h2{margin:0;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit p{display:none}
.u-sub{text-align:center;color:#fff;font-size:13px;font-weight:700;margin:4px 20px 0;opacity:.95}
.unit .u-gram{width:42px;height:42px;border-radius:50%;background:var(--uc,var(--cyan));border:3px solid #fff;display:grid;place-items:center;color:var(--ink);flex:none}
.unit .u-gram:active{transform:scale(.92)}
.ublock.locked{background:rgba(255,255,255,.16);padding:30px 0 16px}
.ublock.locked .unit{background:#5c4f8a;color:#d9d3f0}
.ublock.locked .unit small{color:#d9d3f0}
.ublock.locked .unit>svg{width:24px;height:24px;margin-right:8px;opacity:.8}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:52px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2}
.node{width:76px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;transition:transform .1s;border:var(--bw) solid var(--ink);background:var(--nc);box-shadow:inset 0 -8px 0 var(--nd),0 5px 0 rgba(45,10,78,.35)}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 var(--nd),0 1px 0 rgba(45,10,78,.35)}
.node.done{--nc:var(--yellow);--nd:var(--yellow-d)}
.half-b{position:absolute;top:-10px;right:-14px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900;padding:1px 6px;line-height:1.3;box-shadow:0 3px 0 rgba(45,10,78,.35)}
.next-review.resume{background:#fff;box-shadow:inset 0 -6px 0 #e6e0f0}
.node.current{outline:5px solid #fff;outline-offset:3px;animation:bob 1.6s ease-in-out infinite}
.node-label{font-size:12px;color:#fff;margin-top:10px;font-weight:900;text-shadow:0 2px 0 rgba(45,10,78,.4)}
.start-tip{position:absolute;top:-44px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-size:14px;font-weight:900;color:var(--ink);white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:3}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pchar{position:absolute;top:130px;width:36%;height:190px;z-index:1;cursor:pointer;display:flex;align-items:flex-end}
.pchar.r{right:2%;justify-content:flex-end}.pchar.l{left:2%;justify-content:flex-start}
.pchar.talking{z-index:4}
.pchar img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;transform-origin:50% 100%}
.pchar .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;white-space:nowrap;font-size:15px;font-weight:900;transition:transform .2s cubic-bezier(.3,1.6,.5,1);text-align:center;margin-bottom:6px}
.pchar .say small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.pchar .say.on{transform:translateX(-50%) scale(1)}

/* ---------- navegación inferior ---------- */
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;background:var(--ink);border-radius:30px;display:flex;justify-content:space-around;padding:7px;z-index:30;box-shadow:0 6px 18px rgba(30,20,90,.35)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:24px;color:#bfb2db;font-size:11px;font-weight:800;position:relative}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--ink);background:var(--mint);box-shadow:inset 0 -4px 0 var(--mint-d)}
.nav .badge{position:absolute;top:2px;right:18%;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:10px;padding:0 5px;line-height:15px}

/* ---------- secciones ---------- */
.sec{padding:10px 14px}
.sec>.ttl{text-align:center;margin:8px 0 -26px;position:relative;z-index:2}
.sec .sub{color:var(--ink);margin:0 0 14px;font-size:14px;text-align:center;font-weight:700}
.panel{background:var(--panel-deep);border-radius:var(--r);padding:42px 14px 14px;margin-bottom:14px}
.card{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:12px;background:var(--cyan-l);box-shadow:inset 0 -5px 0 #c9eef3}
.card h3{margin:0 0 4px;font-size:17px;font-weight:900}
.card .meta{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.search{width:100%;padding:13px 16px;border:3px solid var(--ink);border-radius:18px;font-size:16px;background:#fff;outline:none;margin-bottom:14px}
.search:focus{box-shadow:0 0 0 4px #fff}
.wlist{margin:10px 0 0;padding:0;list-style:none}
.wlist li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:2px solid #cde7ee;font-size:15px}
.wlist .eu{font-weight:900;flex:1}
.wlist .es{color:var(--ink2);font-weight:600;flex:1;text-align:right}
.dots{display:flex;gap:2px}.dots i{width:7px;height:7px;border-radius:50%;background:#cde7ee}.dots i.on{background:var(--mint-d)}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:16px;padding:2px 0}
.acc-h .chev{margin-left:auto;transition:transform .2s;color:var(--ink);width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:none;margin-top:10px}.acc.open .acc-b{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.6px;font-weight:900}
.pill.cloud{background:var(--pink);color:var(--ink)}

/* ---------- contenido de gramática ---------- */
.tip h4{margin:14px 0 6px;font-size:16px;font-weight:900}
.tip p{margin:6px 0;font-weight:600;line-height:1.5;font-size:15px}
.tip table{border-collapse:separate;border-spacing:0;width:100%;margin:8px 0;font-size:15px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.tip td,.tip th{padding:7px 10px;border-bottom:2px solid #e6e0f0;text-align:left;font-weight:600}
.tip td b{font-weight:900}
.tip tr:last-child td{border-bottom:0}
.tip th{background:var(--ink);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.tip .ex{background:var(--mint-l);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:800}
.tip .ex b{color:#0b7a46}
.tip .ex span{display:block;color:var(--ink2);font-weight:600;font-size:14px}
.tip .warn{background:var(--yellow-l);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px;margin:8px 0}
.hl{color:var(--purple-d);font-weight:900}

/* ---------- pantalla de lección ---------- */
.lesson{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%)}
.l-top{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}
.l-x{width:44px;height:44px;flex:none;color:#fff;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#5a1a4e,var(--plum-d));border:3px solid #6e2d63}
.bar{flex:1;height:24px;background:rgba(255,255,255,.4);border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-d);border-radius:0 10px 10px 0;transition:width .45s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.55)}
.combo{font-size:14px;color:#fff;font-weight:900;min-width:52px;text-align:right;opacity:0;transition:opacity .2s;text-shadow:0 2px 0 var(--ink)}
.combo.on{opacity:1;animation:pop .35s}
.l-body{flex:1;overflow-y:auto;padding:8px 16px 20px}
.l-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));position:relative;z-index:3}
.lesson>.l-top,.lesson>.l-body{position:relative;z-index:1}
.q-kind .again{color:#ffd166}
.q-kind{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--ink);border-radius:20px;padding:4px 12px;margin:8px 0 8px;font-weight:900}
.q-title{font-size:23px;font-weight:900;margin:0 0 18px;line-height:1.25;color:var(--ink)}
.q-title .eu{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 8px}
.speak{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 -5px 0 var(--yellow-d);vertical-align:middle;margin-right:8px}
.speak:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--yellow-d)}
.speak svg{width:24px;height:24px}

.intro{display:flex;flex-direction:column-reverse;align-items:center;gap:14px;margin-top:6px}
.intro .ichar{max-height:230px;max-width:70%;width:auto;height:auto;flex:none;cursor:pointer}
.intro-card{width:100%;background:#fff;border:var(--bw) solid var(--ink);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:inset 0 -7px 0 #d9d2e6;position:relative;animation:pop .4s}
.intro-card::after{content:"";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);border:10px solid transparent;border-top:16px solid var(--ink)}
.intro-card::before{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:7px solid transparent;border-top:11px solid #fff;z-index:1}
.intro-card .new{display:inline-block;background:var(--pink);color:var(--ink);border:3px solid var(--ink);font-size:12px;padding:2px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;font-weight:900}
.intro-card .big{font-size:32px;font-weight:900;margin:12px 0 4px;color:var(--ink);word-break:break-word}
.intro-card .tr{font-size:18px;color:var(--ink2);font-weight:700}
.intro-card .arthint{margin-top:10px;font-size:15px;color:var(--ink);background:#eef6ff;border:2px dashed #9cc6f0;border-radius:12px;padding:6px 12px;font-weight:600}.intro-card .arthint span{display:block;font-size:12.5px;font-weight:600;opacity:.75;margin-top:2px}
.intro-card .note{margin-top:12px;font-size:14px;color:var(--ink);background:var(--yellow-l);border-radius:12px;padding:8px 12px;font-weight:600}
.intro-card .exs{margin-top:10px;background:var(--mint-l);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left}
.intro-card .exs span{display:block;color:var(--ink2);font-weight:600;font-size:14px}

.opts{display:grid;gap:12px}
.opt{width:100%;text-align:left;padding:13px 16px 17px;border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:inset 0 -7px 0 var(--cyan-d);font-size:18px;font-weight:800;background:var(--cyan);display:flex;align-items:center;gap:12px;transition:transform .08s}
.opt .k{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;background:#fff;font-weight:900}
.opt:active{transform:translateY(3px)}
.opt.sel{background:#fff;box-shadow:inset 0 -7px 0 #cfc7de,0 0 0 5px #fff}
.opt.right{background:var(--mint);box-shadow:inset 0 -7px 0 var(--mint-d)}
.opt.wrong{background:var(--coral);box-shadow:inset 0 -7px 0 var(--coral-d)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px}
.m{padding:13px 8px 16px;border:var(--bw) solid var(--ink);border-radius:18px;box-shadow:inset 0 -6px 0 var(--cyan-d);font-size:16px;background:var(--cyan);min-height:60px;transition:all .15s}
.m.sel{background:#fff;box-shadow:inset 0 -6px 0 #cfc7de,0 0 0 4px #fff}
.m.ok{background:var(--mint);box-shadow:inset 0 -6px 0 var(--mint-d);animation:pop .3s}
.m.gone{opacity:.3;pointer-events:none;box-shadow:none;transform:scale(.96)}

/* hoja de corrección */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 90px));transition:transform .3s cubic-bezier(.2,1.2,.4,1);z-index:2;border:var(--bw) solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0}

/* v1.11 · movimiento con muelle (rebote al llegar), inspirado en un vídeo del usuario */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.3,1.25,.5,1)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0, 0.035, 0.125, 0.249, 0.391, 0.535, 0.673, 0.796, 0.9, 0.983, 1.045, 1.088, 1.114, 1.125, 1.125, 1.117, 1.103, 1.086, 1.068, 1.05, 1.033, 1.019, 1.007, 0.998, 0.991, 0.987, 0.985, 0.984, 0.985, 0.986, 0.988, 0.99, 0.993, 0.995, 0.997, 0.998, 1);--spring-soft:linear(0, 0.019, 0.068, 0.138, 0.22, 0.308, 0.398, 0.486, 0.569, 0.645, 0.714, 0.776, 0.829, 0.874, 0.911, 0.942, 0.967, 0.987, 1.002, 1.012, 1.02, 1.025, 1.027, 1.028, 1.028, 1.027, 1.025, 1.023, 1.02, 1.018, 1.015, 1.013, 1.011, 1.009, 1.007, 1.005, 1)}}
.btn,.opt,.node,.tile,.m,.u-gram,.chip,.speak,.nav button{transition-property:transform,box-shadow,filter,background;transition-duration:.45s;transition-timing-function:var(--spring)}
.btn:active,.opt:active,.node:active,.tile:active,.m:active,.u-gram:active,.chip:active,.speak:active,.nav button:active{transition-duration:.06s;transition-timing-function:ease-out}
.nav button:active{transform:scale(.92)}
.modal{animation:up .55s var(--spring-soft)}
.sheet{transition:transform .5s var(--spring-soft)}
.l-deco{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.l-deco i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.15),rgba(255,255,255,.04) 70%);transition:translate 1.6s cubic-bezier(.22,1,.36,1)}
.l-deco i:nth-child(1){width:340px;height:340px;right:-120px;top:-90px}
.l-deco i:nth-child(2){width:220px;height:220px;left:-110px;top:34%}
.l-deco i:nth-child(3){width:420px;height:420px;right:-170px;bottom:-150px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.12),rgba(255,255,255,.03) 70%)}
.lesson.leaving{pointer-events:none}

/* Espioiaren bila (v1.13): caras por capas y quién es quién */
.face{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#efe8fb}
.face img{position:absolute;height:auto;max-width:none;max-height:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.opt.popt .face img{max-width:none;max-height:none;height:auto}
.opts.fgrid .opt.popt{padding:8px 8px 14px}
.opts.fgrid .face{width:100%;max-width:170px}
.qdesc{font-size:18px;font-weight:800;line-height:1.45;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px;margin:0 0 16px}

.g-help{margin:-8px 0 12px;font-weight:600;font-size:14px;color:var(--ink)}
.gboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.gface{position:relative;padding:0;border:3px solid var(--ink);border-radius:16px;background:#fff;overflow:hidden;box-shadow:inset 0 -5px 0 #d9d2e6;transition:transform .08s}
.gface:active{transform:translateY(2px)}
.gface .face{border-radius:0;transition:filter .2s,opacity .2s}
.gface .nm{display:block;font-weight:900;font-size:13px;padding:3px 0 7px;color:var(--ink)}
.gface.x .face{filter:grayscale(1);opacity:.35}
.gface.x::before,.gface.x::after{content:'';position:absolute;left:50%;top:42%;width:78%;height:7px;border-radius:4px;background:var(--coral-d);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 2px #fff}
.gface.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.gface.x .nm{text-decoration:line-through;opacity:.6}
.gface.spy{background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-d),0 0 0 4px var(--mint)}
.gface.bad{background:var(--coral)}
.gpanel{background:var(--yellow-l);border:3px solid var(--ink);border-radius:18px;padding:10px 12px 12px;margin-bottom:12px}
.g-h{font-weight:900;font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-back{border:0;background:none;font-weight:800;font-size:13px;color:var(--ink2);text-decoration:underline;padding:0}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:flex;flex-direction:column;align-items:flex-start;border:3px solid var(--ink);border-radius:14px;padding:5px 10px 7px;font-weight:900;font-size:14px;line-height:1.15;background:#fff;box-shadow:inset 0 -4px 0 #d9d2e6}
.gchip small{font-weight:600;font-size:11px;color:var(--ink2)}
.gchip:active{transform:translateY(2px)}
.opt.gq{font-size:16px;padding:10px 14px 14px}
.opt.gq:disabled{opacity:1}
.gexp{display:none;margin-top:10px;background:var(--coral-l);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;line-height:1.4}
.gexp.on{display:block}
.glog{display:grid;gap:6px}
.gl-item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px 8px}

.gl-a.yes{color:#0b7a46}.gl-a.no{color:#b4282d}

.lvb{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:900}

.lvb .mb{flex:1;height:16px;border-radius:9px;border:3px solid var(--ink);background:#fff;overflow:hidden}

.pn .pn-link span{float:right}

/* ---------- guía de bienvenida (v1.31) ---------- */
#guide{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%)}
#guide .gd-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none;transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
#guide .gd-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 4px;max-width:560px;width:100%;margin:0 auto}
#guide .gd-n{color:#fff;font-size:14px;font-weight:900;text-shadow:0 2px 0 rgba(45,10,78,.35)}
#guide .gd-skip{color:#fff;font-size:15px;font-weight:900;padding:8px 4px;text-shadow:0 2px 0 rgba(45,10,78,.35)}
#guide .gd-skip small{font-weight:700;opacity:.85}
#guide .gd-track{position:relative;z-index:1;flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#guide .gd-track::-webkit-scrollbar{display:none}
#guide .gd-p{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;display:flex;justify-content:center;padding:4px 16px 8px}
#guide .gd-in{width:100%;max-width:520px;display:flex;flex-direction:column}
#guide .gd-st{position:relative;height:clamp(176px,33vh,270px);flex:none;border-radius:26px;background:rgba(255,255,255,.26);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
#guide .gd-sc{position:absolute;inset:0;display:grid;place-items:center;transform-origin:50% 50%}
#guide .gd-h{margin:0;font-size:30px;font-weight:900;color:#fff;letter-spacing:-.5px;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);line-height:1.15}
#guide .gd-es{margin:4px 0 10px;color:#fff;font-size:15px;font-weight:800;text-shadow:0 2px 0 rgba(45,10,78,.35)}
#guide .gd-card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 14px;box-shadow:0 4px 0 rgba(45,10,78,.3)}
#guide .gd-li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;font-size:15px;font-weight:700;line-height:1.38}
#guide .gd-li+.gd-li{border-top:2px dashed #e6e0f0}
#guide .gd-li>i{flex:none;width:30px;height:30px;border-radius:10px;border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:900;background:var(--c,var(--cyan))}
#guide .gd-li>i svg{width:17px;height:17px}
#guide .gd-li b{font-weight:900}
#guide .gd-bot{position:relative;z-index:2;max-width:560px;width:100%;margin:0 auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
#guide .gd-dots{flex:1;min-width:0;display:flex;gap:5px;flex-wrap:nowrap}
#guide .gd-dots button{flex:none;width:8px;height:8px;border-radius:5px;background:rgba(255,255,255,.5);padding:0;transition:width .3s,background .3s}
#guide .gd-dots button.on{width:20px;background:#fff}
#guide .gd-back{width:52px;height:56px;padding:0;flex:none}
#guide .gd-back svg{width:24px;height:24px}
#guide .gd-next{min-width:150px}
/* piezas de las maquetas */
#guide .gd-big{max-height:88%;max-width:70%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(45,10,78,.25))}
#guide .gd-bub{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-size:20px;font-weight:900;white-space:nowrap}
#guide .gd-bub small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
#guide .gd-node{width:58px;height:54px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ink);background:var(--nc,var(--mint));box-shadow:inset 0 -6px 0 var(--nd,var(--mint-d)),0 4px 0 rgba(45,10,78,.35);position:relative}
#guide .gd-node svg{width:24px;height:24px}
#guide .gd-node.done{--nc:var(--yellow);--nd:var(--yellow-d)}
#guide .gd-node.cur{outline:4px solid #fff;outline-offset:3px}
#guide .gd-nl{font-size:11px;color:#fff;font-weight:900;margin-top:6px;text-align:center;text-shadow:0 2px 0 rgba(45,10,78,.4)}
#guide .gd-tip{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:12px;font-weight:900;white-space:nowrap}
#guide .gd-uh{display:flex;align-items:center;gap:8px;background:var(--mint);border:3px solid var(--ink);border-radius:16px;padding:6px 8px 6px 12px;box-shadow:inset 0 -5px 0 var(--mint-d);font-weight:900;font-size:15px}
#guide .gd-uh small{display:block;font-size:10px;font-weight:800;color:var(--ink2)}
#guide .gd-uh .gb{width:34px;height:34px;border-radius:12px;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
#guide .gd-uh .gb svg{width:18px;height:18px}
#guide .gd-opt{border:3px solid var(--ink);border-radius:14px;padding:7px 12px 10px;font-size:15px;font-weight:800;background:var(--cyan);box-shadow:inset 0 -5px 0 var(--cyan-d);display:flex;align-items:center;gap:8px}
#guide .gd-opt.ok{background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-d)}
#guide .gd-opt.no{background:var(--coral);box-shadow:inset 0 -5px 0 var(--coral-d)}
#guide .gd-tile{display:inline-block;border:3px solid var(--ink);border-radius:11px;padding:4px 9px 6px;font-size:14px;font-weight:800;background:#fff;box-shadow:inset 0 -4px 0 #cfc7de}
#guide .gd-pane{background:var(--cyan-l);border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 rgba(45,10,78,.3)}
#guide .gd-tw{border-bottom:2.5px dotted rgba(45,10,78,.55)}
#guide .gd-hint{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;border:3px solid var(--ink);background:var(--yellow);box-shadow:inset 0 -3px 0 var(--yellow-d);font-size:13px;font-weight:900}
#guide .gd-gap{display:inline-block;min-width:54px;border-bottom:3px solid var(--ink);margin:0 3px}
#guide .gd-chip{height:38px;min-width:62px;padding:0 10px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-weight:900;font-size:15px;background:linear-gradient(180deg,#5a1a4e,var(--plum-d));border:3px solid #6e2d63;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#guide .gd-chip svg{width:18px;height:18px}
#guide .gd-av{width:54px;height:54px;border-radius:50%;padding:3px;background:linear-gradient(180deg,#6e2d63,var(--plum-d))}
#guide .gd-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#5fc616}
#guide .gd-lbl{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900;white-space:nowrap}
#guide .gd-box{width:30px;border:2.5px solid var(--ink);border-radius:8px 8px 4px 4px;background:var(--cyan);box-shadow:inset 0 -4px 0 var(--cyan-d)}
#guide .gd-box.gold{background:var(--yellow);box-shadow:inset 0 -4px 0 var(--yellow-d)}
#guide .gd-badge{position:absolute;top:-8px;right:-10px;background:var(--coral-d);color:#fff;border:2.5px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900;padding:0 6px}
#guide .gd-row{display:flex;align-items:center;gap:10px}
/* entrada de las piezas al llegar a cada página */
#guide .gd-p .gd-a{opacity:0}
#guide .gd-p.on .gd-a{animation:gdIn .62s var(--spring) both;animation-delay:calc(var(--d,0) * 90ms + 60ms)}
#guide .gd-p.on .gd-a.pop{animation-name:gdPop}
#guide .gd-p.on .gd-a.side{animation-name:gdSide}
@keyframes gdIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes gdPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes gdSide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
#guide .gd-p.on .gd-float{animation:gdFloat 2.6s ease-in-out .8s infinite}
@keyframes gdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (max-height:700px){#guide .gd-st{height:158px;margin-bottom:8px}#guide .gd-sc{inset:-19.5%;transform:scale(.72)}#guide .gd-h{font-size:24px}#guide .gd-es{margin:2px 0 7px;font-size:14px}#guide .gd-li{font-size:13.5px;padding:6px 0;line-height:1.32}#guide .gd-li>i{width:26px;height:26px}#guide .gd-next{min-width:130px}#guide .gd-bot{padding-top:6px}}
@media (prefers-reduced-motion:reduce){#guide .gd-p .gd-a,#guide .gd-p.on .gd-a,#guide .gd-p.on .gd-float{opacity:1;animation:none}#guide .gd-deco{transition:none}}

/* ---------- novedades «Zer berri?» (v1.32) ---------- */
.nw h2{margin:0 0 12px;font-size:28px;font-weight:900;letter-spacing:-.4px}
.nw h2 small{display:block;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:0;margin-top:2px}
.nw-hero{position:relative;height:118px;margin:-6px 0 6px;display:flex;justify-content:center}
.nw-hero img{height:100%;filter:drop-shadow(0 4px 0 rgba(45,10,78,.2));animation:nwPop .6s var(--spring) both,gdFloat 2.6s ease-in-out .8s infinite}
.nw-tag{position:absolute;left:50%;top:6px;transform:translateX(-120px) rotate(-8deg);background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 11px;font-size:15px;font-weight:900;box-shadow:0 3px 0 var(--ink);animation:nwTag .55s var(--spring) .25s both;z-index:1}
.nw-list{display:flex;flex-direction:column;gap:9px}
.nw-it{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 rgba(45,10,78,.25);animation:nwIn .5s var(--spring) both;animation-delay:calc(var(--d) * 90ms + 250ms)}
.nw-it>i{flex:none;width:42px;height:42px;border-radius:14px;border:2.5px solid var(--ink);background:var(--c);display:grid;place-items:center;color:var(--ink)}
.nw-it>i svg{width:22px;height:22px}
.nw-it b{display:block;font-size:16px;font-weight:900;line-height:1.2}
.nw-it span{display:block;font-size:14px;font-weight:700;color:var(--ink2);line-height:1.35;margin-top:2px}
.nw .acts{margin-top:16px}
.nw-all{display:block;width:100%;margin-top:6px;padding:10px;font-size:14px;font-weight:800;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
/* v1.33 · avisos de error e ideas (feedback por Telegram) */
.sheet .fb-row{margin:-6px 0 10px;padding-right:32%}
.fb-flag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:14px;border:2px solid currentColor;background:rgba(255,255,255,.55);font:inherit;font-size:13px;font-weight:900;color:var(--ink);cursor:pointer;opacity:.8}
.fb-flag small{font-weight:700;opacity:.75}
.fb-flag svg{width:15px;height:15px;flex:none}
.fb-flag:active{transform:scale(.94)}
.fb h2 small{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin-top:2px}
.fb .fb-note{font-size:14px;background:#fff;border:2px dashed var(--ink2);border-radius:14px;padding:10px 12px}
.fb-ch{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fb-ch button{font:inherit;font-size:14px;font-weight:800;padding:8px 12px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:inset 0 -3px 0 #d9d2e6}
.fb-ch button.on{background:var(--mint);box-shadow:inset 0 -3px 0 var(--mint-d,#12c270)}
.modal .fb textarea{min-height:110px}
@media (max-height:700px){.modal .fb textarea{min-height:64px}.fb .fb-note{font-size:13px;padding:8px 10px}.fb-ch button{padding:6px 10px;font-size:13px}}
.fb-hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0}
.nw-v{margin:16px 0 8px;font-size:13px;font-weight:900;color:var(--ink2);text-transform:none}
.nw.hist .nw-v:first-of-type{margin-top:4px}
.nw.hist .nw-it{animation:none}
@keyframes nwIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes nwPop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes nwTag{from{opacity:0;transform:translateX(-120px) rotate(-30deg) scale(.3)}to{opacity:1;transform:translateX(-120px) rotate(-8deg)}}
@media (max-height:700px){.nw-hero{height:78px;margin-top:-10px}.nw h2{font-size:24px;margin-bottom:8px}.nw-it{padding:7px 10px}.nw-it span{font-size:13px}}
@media (prefers-reduced-motion:reduce){.nw-it,.nw-hero img,.nw-tag{animation:none!important}}
</style>

  sentences:[
    ['Kaixo, zer moduz?','Hola, ¿qué tal?','<b>Zer moduz?</b> es una fórmula fija: «¿qué tal?». Detrás del saludo va coma: <b>Kaixo, zer moduz?</b>'],['Oso ondo, eta zu?','Muy bien, ¿y tú?','Para devolver la pregunta: <b>eta zu?</b> («¿y tú?»). <b>Oso</b> («muy») va delante: oso ondo.'],
    ['Egun on, Miren!','¡Buenos días, Miren!','<b>Egun on</b> = buenos días (por la mañana). El nombre de la persona va detrás, con coma.'],['Eskerrik asko, agur!','¡Muchas gracias, adiós!','<b>Eskerrik asko</b> = muchas gracias. <b>Agur</b> sirve para despedirse en cualquier momento.'],
    ['Gero arte, Jon!','¡Hasta luego, Jon!','<b>Gero arte</b> = hasta luego. «… arte» es «hasta…»: bihar arte (hasta mañana), laster arte (hasta pronto).'],['Nahiko ondo, eskerrik asko','Bastante bien, muchas gracias','<b>Nahiko</b> = bastante, delante como oso: nahiko ondo, oso ondo.'],
    ['Egun on, zer moduz?','Buenos días, ¿qué tal?','<b>Egun on</b> (solo por la mañana) y, con coma, <b>zer moduz?</b> («¿qué tal?»).'],
    ['Arratsalde on, Miren!','¡Buenas tardes, Miren!','<b>Arratsalde on</b> = buenas tardes. El nombre va detrás, con coma.'],
    ['Gabon, Jon!','¡Buenas noches, Jon!','<b>Gabon</b> sirve de noche para saludar y para despedirse. El nombre, detrás y con coma.'],
    ['Bihar arte, Miren!','¡Hasta mañana, Miren!','<b>Bihar arte</b> = hasta mañana: bihar (mañana) + arte (hasta), como gero arte.'],

    ['Bai, mesedez','Sí, por favor','<b>Bai</b> = sí; <b>mesedez</b> = por favor. Van separados por coma.'],
    ['Barkatu, Jon','Perdón, Jon','<b>Barkatu</b> sirve para pedir perdón y para llamar la atención («disculpa»).'],
    ['Aspaldiko! Zer moduz?','¡Cuánto tiempo! ¿Qué tal?','<b>Aspaldiko!</b> = ¡cuánto tiempo! (al ver a alguien después de mucho). Son dos frases: el <b>!</b> las separa.'],
    ['Ongi etorri, Miren!','¡Bienvenida, Miren!','<b>Ongi etorri</b> = bienvenido/a. No cambia: vale igual para un chico, una chica o un grupo.'],
    ['Eskerrik asko! Ez horregatik','¡Muchas gracias! De nada','A <b>eskerrik asko</b> se responde <b>ez horregatik</b> («de nada»). El <b>!</b> separa lo que dice cada uno.']

{ id:'a0-eus', level:'A0', title:'Euskaltegian', sub:'Frases y verbos de clase · pedir ayuda',
  vocab:[
    ['ez dut ulertzen','no (lo) entiendo','Se pronuncia «eztut ulertzen»'],['ez dakit','no (lo) sé','Se pronuncia «eztakit»'],
    ['badakit','lo sé / sí sé','Bai, badakit = sí, lo sé'],['ez dut gogoratzen','no me acuerdo','Se pronuncia «eztut gogoratzen»'],
    ['errepikatu, mesedez','repítelo, por favor'],['astiroago, mesedez','más despacio, por favor','astiro (despacio) + -ago (más)'],
    ['idatzi, mesedez','escríbelo, por favor'],['zer esan nahi du?','¿qué significa? / ¿qué quiere decir?','Para una palabra en euskera que no entiendes'],
    ['nola esaten da?','¿cómo se dice?','Nola esaten da «libro» euskaraz?'],['euskaraz','en euskera'],['berriro','otra vez / de nuevo'],
    ['hitz(a)','la palabra'],['galdera','la pregunta','Termina en -a, así que ya lleva el artículo. Galdera bat = una pregunta'],['erantzun(a)','la respuesta'],
    ['irakurri','leer'],['idatzi','escribir'],['entzun','escuchar'],['galdetu','preguntar'],['erantzun','responder'],
    ['ikasi','estudiar / aprender'],['hasi','empezar'],['amaitu','terminar'],
    ['ariketa','el ejercicio','Termina en -a, como galdera'],['liburu(a)','el libro'],['arkatz(a)','el lápiz'],['mahai(a)','la mesa'],
    ['erraz(a)','fácil','Ariketa erraza da = el ejercicio es fácil'],['zail(a)','difícil']
  ],
  grammar:[
    { t:'Pedir ayuda en clase', h:`
      <p>Con cuatro frases te apañas en cualquier clase. Las tres primeras llevan <b>mesedez</b> (por favor) detrás:</p>
      <table><tr><th>Si…</th><th>dices</th></tr>
      <tr><td>hablan demasiado rápido</td><td><b>Astiroago, mesedez</b></td></tr>
      <tr><td>no lo has oído bien</td><td><b>Errepikatu, mesedez</b></td></tr>
      <tr><td>quieres verlo escrito</td><td><b>Idatzi, mesedez</b></td></tr>
      <tr><td>sigues sin entenderlo</td><td><b>Berriro azaldu ahal duzu?</b></td></tr></table>
      <div class="ex"><b>Errepikatu berriro, mesedez</b><span>Repítelo otra vez, por favor</span></div>
      <p><b>Astiroago</b> = astiro (despacio) + <span class="hl">-ago</span> (más). Ese -ago sirve para comparar y volverá en A2.</p>` },
    { t:'Zer esan nahi du? ≠ Nola esaten da?', h:`
      <p>Las dos preguntan por palabras, pero en sentido contrario:</p>
      <table><tr><th>Pregunta</th><th>Tienes…</th><th>Quieres…</th></tr>
      <tr><td><b>Zer esan nahi du …?</b></td><td>la palabra en euskera</td><td>saber qué significa</td></tr>
      <tr><td><b>Nola esaten da … euskaraz?</b></td><td>la palabra en castellano</td><td>saber cómo se dice</td></tr></table>
      <div class="ex"><b>Zer esan nahi du «zaila»? — Difícil.</b><span>¿Qué significa «zaila»?</span></div>
      <div class="ex"><b>Nola esaten da «árbol» euskaraz? — Zuhaitza.</b><span>¿Cómo se dice «árbol» en euskera?</span></div>
      <p>Truco: si la pregunta lleva <b>euskaraz</b> (en euskera), la palabra de dentro está en castellano.</p>
      <p>Al pie de la letra, <i>zer esan nahi du</i> es «qué decir quiere»: zer (qué) + esan (decir) + nahi du (quiere).</p>` },
    { t:'No sé · no entiendo · no me acuerdo', h:`
      <p>En la negación, <b>ez</b> se une al verbo auxiliar y los dos van <span class="hl">delante</span>, como en <i>Ez naiz irakaslea</i>:</p>
      <table><tr><th>Sí</th><th>No</th></tr>
      <tr><td>Badakit · lo sé</td><td><b>Ez dakit</b> · no lo sé</td></tr>
      <tr><td>Ulertzen dut · lo entiendo</td><td><b>Ez dut ulertzen</b> · no lo entiendo</td></tr>
      <tr><td>Gogoratzen dut · me acuerdo</td><td><b>Ez dut gogoratzen</b> · no me acuerdo</td></tr></table>
      <p>Fíjate en <b>badakit</b>: para afirmar, <i>dakit</i> lleva <span class="hl">ba-</span> delante. <i>Bai, badakit</i> = sí, lo sé.</p>
      <div class="warn"><b>Pronunciación:</b> ez + d suena «zt»: <i>ez dakit</i> → «eztakit», <i>ez dut ulertzen</i> → «eztut ulertzen». Se escribe separado.</div>
      <div class="warn">Como estos verbos llevan <b>dut</b>, el sujeto va con <b>-k</b>: <b>Nik</b> ulertzen dut, no «Ni ulertzen dut». Normalmente se omite: <i>Ulertzen dut</i>. Lo verás a fondo en <i>NORK eta UKAN</i>.</div>` },
    { t:'Verbos de clase', h:`
      <p>Los verbos aparecen en su forma de diccionario. En clase se usan solos como orden:</p>
      <div class="ex"><b>Irakurri eta entzun!</b><span>¡Lee y escucha!</span></div>
      <div class="ex"><b>Idatzi, mesedez</b><span>Escríbelo, por favor</span></div>
      <table><tr><td><b>hasi</b> · empezar</td><td>↔</td><td><b>amaitu</b> · terminar</td></tr>
      <tr><td><b>galdetu</b> · preguntar</td><td>↔</td><td><b>erantzun</b> · responder</td></tr>
      <tr><td><b>irakurri</b> · leer</td><td>·</td><td><b>idatzi</b> · escribir</td></tr></table>
      <p>De <i>galdetu</i> sale <b>galdera</b> (pregunta), y de <i>erantzun</i>, <b>erantzuna</b> (respuesta).</p>
      <div class="warn"><b>Txarto</b> (mal) es muy de Bizkaia y lo oirás en clase. La forma general de batua es <b>gaizki</b>.</div>` }
  ],
  drills:[
    { q:'La profe habla muy rápido:', s:'___, mesedez!', o:['Astiroago','Errepikatu','Idatzi'], a:0, x:'<b>Astiroago</b> = más despacio. Errepikatu es «repite».' },
    { q:'No lo has oído bien:', s:'___, mesedez', o:['Errepikatu','Astiroago','Badakit'], a:0, x:'Para que lo repitan: <b>errepikatu</b>.' },

    { q:'Te preguntan algo y no sabes la respuesta:', s:'___', o:['Ez dakit','Ez horregatik','Badakit'], a:0, x:'<b>Ez dakit</b> = no lo sé. Ez horregatik es «de nada».' },
    { q:'«No entiendo»', s:'___', o:['Ez dut ulertzen','Ulertzen ez dut','Ez ulertzen dut'], a:0, x:'En negativa, <b>ez + auxiliar</b> delante: <b>ez dut</b> ulertzen.' },
    { q:'«Sí, lo sé»', s:'Bai, ___', o:['badakit','ez dakit','dakit ez'], a:0, x:'Afirmativa con el verbo solo: <b>ba-</b> + dakit.' },
    { q:'¿Cómo suena «ez dakit»?', s:'«___»', o:['eztakit','esdakit','edakit'], a:0, x:'Ez + d suena <b>zt</b>: ez dakit → «eztakit».' },
    { q:'Lo contrario de hasi (empezar):', s:'hasi ≠ ___', o:['amaitu','entzun','ikasi'], a:0, x:'hasi (empezar) ≠ <b>amaitu</b> (terminar).' },
    { q:'Lo contrario de galdetu (preguntar):', s:'galdetu ≠ ___', o:['erantzun','irakurri','idatzi'], a:0, x:'galdetu (preguntar) ≠ <b>erantzun</b> (responder).' },
    { q:'«Lo entiendo», con el sujeto:', s:'___ ulertzen dut', o:['Nik','Ni','Zu'], a:0, x:'Ulertu va con dut (NORK): el sujeto lleva -k, <b>nik</b>.' }
  ],
  sentences:[
    ['Ez dut ulertzen','No lo entiendo','En negativa, <b>ez + auxiliar</b> van delante y el verbo detrás: <b>ez dut</b> ulertzen.'],['Errepikatu berriro, mesedez','Repítelo otra vez, por favor','Para pedir algo en clase basta el verbo: <b>errepikatu</b> (repite). <b>Berriro</b> = otra vez.'],
    ['Astiroago, mesedez','Más despacio, por favor','<b>Astiro</b> = despacio; con <b>-ago</b>, «más»: astiroago = más despacio.'],['Zer esan nahi du zaila?','¿Qué quiere decir zaila?','<b>Zer esan nahi du …?</b> = ¿qué quiere decir…? La palabra por la que preguntas va al final.'],
    ['Nola esaten da libro euskaraz?','¿Cómo se dice libro en euskera?','<b>Nola esaten da … euskaraz?</b> = ¿cómo se dice… en euskera? Euskara + <b>z</b> = en euskera.'],['Ez dakit, ez dut gogoratzen','No lo sé, no me acuerdo','<b>Ez dakit</b> = no lo sé (jakin). <b>Ez dut gogoratzen</b> = no me acuerdo: ez + dut delante.'],
    ['Bai, badakit','Sí, lo sé','En afirmativa, cuando el verbo va solo, lleva <b>ba-</b>: <b>badakit</b> (sí, lo sé).'],['Berriro azaldu ahal duzu?','¿Puedes explicarlo otra vez?','<b>Ahal</b> = poder: verbo + ahal + duzu. Berriro azaldu <b>ahal duzu</b>? = ¿puedes explicarlo otra vez?'],
    ['Ariketa hau erraza da','Este ejercicio es fácil','<b>Hau</b> (este) va detrás del nombre y ocupa el sitio del artículo: ariketa <b>hau</b>. Erraz + <b>a</b> da.'],['Irakurri eta idatzi, mesedez','Lee y escribe, por favor','Las órdenes de clase van con el verbo tal cual: <b>irakurri</b> (lee), <b>idatzi</b> (escribe).'],
    ['Galdera hau zaila da','Esta pregunta es difícil','<b>Hau</b> va detrás del nombre, en lugar del artículo: galdera <b>hau</b>. Zail + <b>a</b> da.'],
    ['Ez dut hitz hau ulertzen','No entiendo esta palabra','Negativa: <b>ez dut</b> delante y el verbo al final: ez dut hitz hau <b>ulertzen</b>.'],
    ['Erantzuna erraza da','La respuesta es fácil','Erantzun + <b>a</b>; cómo es, con izan: erraz + <b>a</b> da.']

      <div class="ex"><b>Non egiten duzu lan? — Ospitalean.</b><span>¿Dónde trabajas? — En el hospital.</span></div>
      <div class="ex"><b>Irakaslea naiz. Eskolan egiten dut lan.</b><span>Soy profesor. Trabajo en la escuela.</span></div>
      <p><b>Lan egin</b> = trabajar. Va con <b>dut / duzu / du</b>: <i>lan egiten dut</i> (trabajo), <i>lan egiten duzu</i> (trabajas), <i>lan egiten du</i> (trabaja).</p>
      <p>Lugares útiles: <i>ospitalean</i> (en el hospital), <i>eskolan</i> (en la escuela), <i>bulegoan</i> (en la oficina), <i>dendan</i> (en la tienda), <i>tabernan</i> (en el bar), <i>etxean</i> (en casa).</p>
      <p>Si no trabajas: <i>Langabetua naiz</i> (estoy en paro) o <i>Ikaslea naiz</i>.</p>
      <div class="warn">Aquí <b>-an / -n</b> significa «en» con nombres comunes. De momento apréndelos como bloque; la regla completa está en <i>Non dago?</i></div>` },
    { t:'Qué hace cada uno', h:`
      <p>Para describir un oficio: <b>quién</b> + <b>qué</b> + verbo en <span class="hl">-tzen / -ten</span> + <b>du</b>, o <b>ditu</b> si lo que hace son varias cosas:</p>
      <div class="ex"><b>Okinak ogia egiten du.</b><span>El panadero hace pan.</span></div>
      <div class="ex"><b>Postariak gutunak banatzen ditu.</b><span>El cartero reparte cartas.</span></div>
      <div class="ex"><b>Ile-apaintzaileak ileak mozten ditu.</b><span>El peluquero corta el pelo.</span></div>
      <p><b>du</b> → una cosa (ogia, janaria) · <b>ditu</b> → varias (gutunak, ileak, gaixoak).</p>
      <div class="warn">Quien hace la acción lleva <b>-k</b>: <b>Okinak</b> ogia egiten du, <b>Irakasleak</b> eskolan lan egiten du. Sin -k («Okina ogia egiten du») es incorrecto. Lo verás a fondo en <i>NORK eta UKAN</i>; de momento, apréndelo como bloque.</div>
      <p><i>Irakasleak ikasleei irakasten die</i>: «el profesor enseña a los alumnos». <b>Die</b> es otro auxiliar que se estudia más adelante; por ahora basta con reconocerlo.</p>` },
    { t:'Cómo se forman los nombres de oficio', h:`
      <table><tr><th>Sufijo</th><th>Idea</th><th>Ejemplos</th></tr>
      <tr><td>-tzaile / -le</td><td>el que hace la acción</td><td>saldu → <b>saltzailea</b>, garbitu → <b>garbitzailea</b>, eraiki → <b>eraikitzailea</b>, idatzi → <b>idazlea</b></td></tr>
      <tr><td>-lari</td><td>el que se dedica a algo</td><td>argazki → <b>argazkilaria</b>, abestu → <b>abeslaria</b></td></tr>
      <tr><td>-ari</td><td>oficio (muy frecuente)</td><td><b>mekanikaria</b>, <b>informatikaria</b>, <b>musikaria</b>, <b>kazetaria</b>, <b>gidaria</b></td></tr>
      <tr><td>-zain</td><td>el que cuida o vigila</td><td>lora → <b>lorazaina</b>, eri → <b>erizaina</b></td></tr></table>
      <p>Así puedes adivinar palabras nuevas: <i>arrain-saltzailea</i> = pescadero (vendedor de pescado).</p>` }
  ],
  drills:[
    { q:'«Soy enfermera»', s:'___ naiz', o:['Erizaina','Erizain','Erizainak'], a:0, x:'La profesión lleva artículo: <b>erizaina</b> naiz.' },

    { q:'«El cartero reparte las cartas»', h:'Mira el objeto: ¿una cosa o varias?', s:'Postariak gutunak banatzen ___', o:['ditu','du','da'], a:0, x:'<i>Gutunak</i> (las cartas) lleva -ak: son varias → <b>ditu</b>. Con una sola carta (<i>gutuna</i>), du.' },

    { q:'«Trabajo en la escuela»', s:'Eskolan ___', o:['lan egiten dut','lan egiten naiz','lan naiz'], a:0, x:'Lan egin va con ukan: lan egiten <b>dut</b>.' },

    { q:'saldu (vender) → el vendedor:', s:'___', o:['saltzailea','saldaria','saldzaina'], a:0, x:'<b>-tzaile</b> = el que hace: saldu → sal<b>tzaile</b>a.' },
    { q:'-zain = el que cuida. «El jardinero»:', s:'___', o:['lorazaina','loralaria','loragilea'], a:0, x:'<b>-zain</b> = el que cuida: lora + zain + a.' }

  sentences:[
    ['Zer zara? Erizaina naiz','¿Qué eres? Soy enfermera','<b>Zer zara?</b> pregunta por la profesión. La profesión va con artículo: erizain + <b>a</b> naiz.'],['Non egiten duzu lan?','¿Dónde trabajas?','Trabajar = <b>lan egin</b>: lan + egiten + duzu. <b>Non</b> va pegado al verbo.'],
    ['Ospitalean egiten dut lan','Trabajo en el hospital','Ospitale + <b>an</b> (en el hospital). Ni → lan egiten <b>dut</b>.'],['Irakaslea naiz eta eskolan egiten dut lan','Soy profesor y trabajo en la escuela','Profesión con izan (<b>naiz</b>); trabajar con ukan (<b>dut</b>). Eskola + n: la -a ya es de la palabra.'],
    ['Nire aita okina da','Mi padre es panadero','<b>Nire</b> va delante y la profesión con artículo: okina da.'],['Okinak ogia egiten du','El panadero hace pan','Egin va con du: quien lo hace lleva <b>-k</b>, okina<b>k</b>. Ogia es una cosa → <b>du</b>.'],
    ['Postariak gutunak banatzen ditu','El cartero reparte cartas','Postaria<b>k</b> con -k (lo hace él). Gutunak son varias → <b>ditu</b>.'],['Gu ez gara poliziak','Nosotros no somos policías','Negativa: <b>ez gara</b> delante. Varios: polizia<b>k</b>.'],
    ['Jon Bilbokoa da eta kazetaria da','Jon es de Bilbao y es periodista','Dos frases unidas con <b>eta</b>, cada una con su <b>da</b>.'],

    ['Ni ez naiz polizia, suhiltzailea naiz','Yo no soy policía, soy bombero','<b>Polizia</b> ya acaba en -a: no se le añade otra. Suhiltzaile + <b>a</b> naiz.'],
    ['Haiek iturginak dira','Ellos son fontaneros','Varios, en plural: iturgin + <b>ak</b>. Haiek → <b>dira</b>.'],
    ['Nire ama erizaina da','Mi madre es enfermera','<b>Nire</b> va delante; la profesión con artículo: erizain + <b>a</b> da.']

{ id:'a1-4', ch:'txomin', level:'A1', title:'Zenbat urte dituzu?', sub:'Números hasta 100 · la edad · familia básica',
  vocab:[
    ['hogeita bat','veintiuno'],['hogeita hamar','treinta'],['hogeita hamabost','treinta y cinco'],['berrogei','cuarenta'],
    ['berrogeita hamar','cincuenta'],['hirurogei','sesenta'],['hirurogeita hamar','setenta'],['laurogei','ochenta'],
    ['laurogeita hamar','noventa'],['ehun','cien'],['urte','año'],['ditut','(yo) tengo — objeto plural'],
    ['dituzu','(tú) tienes — objeto plural'],['ditu','(él/ella) tiene — objeto plural'],['aita','el padre'],['ama','la madre'],
    ['gazte(a)','joven'],['zahar(ra)','viejo/a, mayor']
  ],
  grammar:[
    { t:'Se cuenta de 20 en 20', h:`
      <p>El euskera es <b>vigesimal</b>: <i>hogei</i> (20), <i>berr-ogei</i> (2×20 = 40), <i>hirur-ogei</i> (3×20 = 60), <i>laur-ogei</i> (4×20 = 80).</p>
      <p>Para sumar se añade <span class="hl">-ta</span> al múltiplo de 20:</p>
      <table><tr><td>21</td><td>hogei<b>ta</b> bat</td></tr><tr><td>30</td><td>hogei<b>ta</b> hamar (20+10)</td></tr>
      <tr><td>35</td><td>hogei<b>ta</b> hamabost (20+15)</td></tr><tr><td>50</td><td>berrogei<b>ta</b> hamar (40+10)</td></tr>
      <tr><td>99</td><td>laurogei<b>ta</b> hemeretzi (80+19)</td></tr></table>` },
    { t:'Decir la edad', h:`
      <p>En euskera la edad se <b>tiene</b> (verbo <i>ukan</i>). Como los años son plural, se usa <b>ditut / dituzu / ditu</b>:</p>
      <div class="ex"><b>Zenbat urte dituzu? — Hogeita hamar urte ditut.</b><span>¿Cuántos años tienes? — Tengo treinta años.</span></div>
      <p><b>Urte</b> va sin artículo detrás del número.</p>
      <p>En clase oirás también <b>urte dauzkat / dauzkazu / dauzka</b> (verbo <i>eduki</i>). Es igual de correcto y muy habitual en Bizkaia.</p>
      <div class="warn">Adelanto: con <i>ukan</i> el sujeto lleva <b>-k</b> (nik, zuk, aitak). Lo verás a fondo en <i>NORK eta UKAN</i></div>` }
  ],
  drills:[
    { q:'¿Cómo se dice 35?', s:'35 = ___', o:['hogeita hamabost','hogeita bost','hirurogeita bost'], a:0, x:'35 = 20 + 15: <b>hogeita hamabost</b>.' },
    { q:'¿Cómo se dice 50?', s:'50 = ___', o:['berrogeita hamar','bostogei','hamabost hamar'], a:0, x:'50 = 40 + 10: <b>berrogeita hamar</b>.' },
    { q:'¿Cómo se dice 60?', s:'60 = ___', o:['hirurogei','seiogei','berrogeita hogei'], a:0, x:'60 = 3 × 20: <b>hirurogei</b>.' },
    { q:'«Tengo 21 años»', s:'___', o:['Hogeita bat urte ditut','Hogeita bat urteak ditut','Hogeita bat urte naiz'], a:0, x:'Tras el número, <b>urte</b> sin -ak; la edad con <b>ditut</b>.' },
    { q:'Completa:', s:'Zenbat urte ___ zuk?', o:['dituzu','ditut','zara'], a:0, x:'Zuk → <b>dituzu</b>.' },
    { q:'Completa:', s:'Nik hogei urte ___', o:['ditut','dituzu','naiz'], a:0, x:'Nik → <b>ditut</b>.' },
    { q:'Completa:', s:'Nire aitak hirurogei urte ___', o:['ditu','ditut','da'], a:0, x:'Aitak (él) → <b>ditu</b>.' }
  ],
  sentences:[
    ['Zenbat urte dituzu?','¿Cuántos años tienes?','La edad va con «tener» (ukan): urte <b>dituzu</b>, en plural porque son varios años.'],['Hogeita hamar urte ditut','Tengo treinta años','30 = hogeita hamar (20 + 10). Tras el número, <b>urte</b> sin artículo. Ni → <b>ditut</b>.'],
    ['Nire aitak hirurogei urte ditu','Mi padre tiene sesenta años','Aita<b>k</b>: lleva -k porque «tiene». 60 = hirurogei (3 × 20). Él → <b>ditu</b>.'],['Nire ama gaztea da','Mi madre es joven','«Joven» es cómo es: <b>izan</b> y adjetivo con artículo, gaztea da.'],
    ['Zuk berrogei urte dituzu?','¿Tú tienes cuarenta años?','Zuk (con -k) → <b>dituzu</b>. 40 = berrogei (2 × 20).'],
    ['Nik hogeita bat urte ditut','Yo tengo veintiún años','<b>Nik</b> (con -k) → <b>ditut</b>. 21 = hogeita bat (20 + 1).'],
    ['Nire amak laurogei urte ditu','Mi madre tiene ochenta años','Ama<b>k</b>: lleva -k porque «tiene». 80 = laurogei (4 × 20). Ella → <b>ditu</b>.'],
    ['Nire aita zaharra da','Mi padre es mayor','Cómo es: <b>izan</b>, y el adjetivo con artículo: zahar + <b>ra</b> (la r se dobla).'],
    ['Ehun urte? Ez, laurogeita hamar','¿Cien años? No, noventa','<b>Ehun</b> = 100. 90 = laurogeita hamar (80 + 10).'],
    ['Zuk hogeita hamabost urte dituzu','Tú tienes treinta y cinco años','<b>Zuk</b> (con -k) → <b>dituzu</b>. 35 = hogeita hamabost (20 + 15).'],
    ['Nire aitak berrogeita hamar urte ditu','Mi padre tiene cincuenta años','Aita<b>k</b>, con -k. 50 = berrogeita hamar (40 + 10). Él → <b>ditu</b>.'],
    ['Nik ez ditut hirurogei urte','Yo no tengo sesenta años','En negativa, <b>ez ditut</b> va delante y la edad detrás: nik <b>ez ditut</b> hirurogei urte.'],
    ['Zure ama gaztea da?','¿Tu madre es joven?','Cómo es: <b>izan</b> (da), y el adjetivo con artículo: gazte + <b>a</b>.']
  ]
},
{ id:'a1-nol', ch:'aitor', level:'A1', title:'Nolakoa da?', sub:'Cómo es · aspecto y carácter · colores · oso, nahiko, batere',
  split:[15,14,14],
  vocab:[
    ['handi(a)','grande','Hartza handia da: el oso es grande'],
    ['txiki(a)','pequeño/a','Sagua txikia da: el ratón es pequeño'],
    ['altu(a)','alto/a'],
    ['baxu(a)','bajo/a'],
    ['lodi(a)','gordo/a','También se dice gizena'],

    ['lotsagabe(a)','sinvergüenza, descarado/a','lotsa (vergüenza) + gabe (sin)'],
    ['azkar(ra)','listo/a; rápido/a','azkar + -a → azkarra'],

    ['nahiko','bastante','nahiko altua: bastante alto'],
    ['batere','nada (con negación)','Siempre con ez: ez da batere altua']
  ],
  grammar:[
    { t:'Nolakoa da? — Indartsua da', h:`
      <p>Para preguntar cómo es alguien o algo: <span class="hl">Nolakoa da?</span> Se responde con el adjetivo + artículo <b>-a</b> + <b>izan</b>:</p>
      <div class="ex"><b>Nolakoa da Aitor? — Indartsua da.</b><span>¿Cómo es Aitor? — Es fuerte.</span></div>
      <div class="ex"><b>Hartza handia da eta sagua txikia da.</b><span>El oso es grande y el ratón es pequeño.</span></div>
      <table><tr><th>El adjetivo termina en…</th><th>Forma</th><th>Ejemplo</th></tr>
      <tr><td>vocal</td><td>+ <b>-a</b></td><td>handi → handi<b>a</b>, gazte → gazte<b>a</b></td></tr>
      <tr><td>-a</td><td>no añade nada</td><td>laranj<b>a</b>, arros<b>a</b></td></tr>
      <tr><td>-r</td><td><b>-rra</b></td><td>zahar → zaha<b>rra</b>, azkar → azka<b>rra</b>, jator → jato<b>rra</b></td></tr>
      <tr><td>otra consonante</td><td>+ <b>-a</b></td><td>argal → argal<b>a</b>, beltz → beltz<b>a</b>, urdin → urdin<b>a</b></td></tr></table>
      <p>En plural, <b>Nolakoak dira?</b> y el adjetivo lleva <b>-ak</b>:</p>
      <div class="ex"><b>Nolakoak dira Txomin eta Karmele? — Zaharrak eta jatorrak dira.</b><span>¿Cómo son Txomin y Karmele? — Son mayores y majos.</span></div>
      <div class="ex"><b>Zuek oso alaiak zarete.</b><span>Vosotros sois muy alegres.</span></div>
      <p>No cambia por género: <i>altua</i> es alto y alta.</p>` },
    { t:'El adjetivo va detrás del nombre', h:`
      <p>Al revés que en castellano «un gran perro»: en euskera el adjetivo va <b>siempre detrás</b>, y el artículo se pone <b>una sola vez, al final</b> del grupo:</p>
      <table><tr><th>Euskera</th><th>Castellano</th></tr>
      <tr><td>txakur handi<b>a</b></td><td>el perro grande</td></tr>
      <tr><td>txakur handi<b>ak</b></td><td>los perros grandes</td></tr>
      <tr><td>txapela gorri<b>a</b></td><td>la txapela roja</td></tr>
      <tr><td>katu beltz <b>bat</b></td><td>un gato negro</td></tr></table>
      <div class="warn">«Txakur<b>ra</b> handi<b>a</b>» es incorrecto: el nombre se queda sin artículo. Y con <b>bat</b> no hay artículo: <i>katu beltz bat</i>, no «katu beltza bat».</div>` },
    { t:'oso, nahiko, batere', h:`
      <p>Para graduar, se pone la palabra <b>delante</b> del adjetivo. De más a menos:</p>
      <table><tr><th>Euskera</th><th>Castellano</th></tr>
      <tr><td>Layla <b>oso</b> gaztea da</td><td>muy joven</td></tr>
      <tr><td>Sonia <b>nahiko</b> gaztea da</td><td>bastante joven</td></tr>
      <tr><td>Alberto gaztea da</td><td>joven</td></tr>
      <tr><td>Kepa <b>ez da oso</b> gaztea</td><td>no muy joven</td></tr>
      <tr><td>Asier <b>ez da</b> gaztea</td><td>no es joven</td></tr>
      <tr><td>Jesus <b>ez da batere</b> gaztea</td><td>nada joven</td></tr></table>
      <p>Otra forma de decir «muy»: repetir el adjetivo con guion. <i>Layla <b>gazte-gaztea</b> da</i> (jovencísima).</p>
      <div class="warn"><b>Batere</b> solo va con negación: <i>ez da batere polita</i>. «Batere polita da» es incorrecto.</div>` },
    { t:'La negación: ez da…', h:`
      <p>Para negar, <b>ez</b> va delante del verbo y el adjetivo detrás: <span class="hl">ez + da + adjetivo</span>.</p>
      <div class="ex"><b>Amaia ez da urduria.</b><span>Amaia no es nerviosa.</span></div>
      <div class="ex"><b>Gu ez gara argalak.</b><span>Nosotros no somos delgados.</span></div>
      <div class="ex"><b>Altua da Unai? — Ez, ez da altua; baxua da.</b><span>¿Unai es alto? — No, no es alto; es bajo.</span></div>
      <p>Con <b>baina</b> (pero) se combinan: <i>Ez da altua, baina oso indartsua da.</i></p>
      <p>Parejas de contrarios: handia ↔ txikia · altua ↔ baxua · lodia ↔ argala · gaztea ↔ zaharra · polita ↔ itsusia · berritsua ↔ isila · lasaia ↔ urduria · alaia ↔ tristea · azkarra ↔ leloa · zintzoa ↔ bihurria · lotsatia ↔ lotsagabea.</p>` },
    { t:'Koloreak', h:`
      <div class="ex"><b>Zer koloretakoa da txapela? — Beltza da.</b><span>¿De qué color es la txapela? — Es negra.</span></div>
      <p>En la calle oirás también <i>Zer kolore da?</i></p>
      <p>Los colores son adjetivos: van detrás y llevan el artículo al final: <i>txapela gorria</i>, <i>begi urdinak</i> (ojos azules).</p>
      <p>Claro y oscuro: <b>argia</b> e <b>iluna</b>, también detrás: <i>urdin argia</i> (azul claro), <i>berde iluna</i> (verde oscuro).</p>

    { t:'Nolakoa da? ≠ Nola dago?', h:`
      <p><b>Nolakoa da?</b> (izan) pregunta cómo <b>es</b> alguien: carácter y aspecto. El adjetivo lleva artículo.</p>
      <p><b>Nola dago?</b> (egon) pregunta cómo <b>está</b> ahora. El adjetivo va <b>sin</b> artículo.</p>

      <div class="warn">Esto se ve a fondo en la unidad <i>Nola dago?</i> De momento: <b>da → con -a</b>, <b>dago → sin -a</b>.</div>` }
  ],

  grammar:[
    { t:'EDUKI: tener', h:`
      <p><b>Eduki</b> significa «tener». Hay dos columnas: una para cuando lo que se tiene es <b>una cosa</b> y otra para <b>varias</b>. La de plural lleva una <span class="hl">-z-</span>: dau<b>z</b>kat.</p>
      <table><tr><th>Quién</th><th>una cosa</th><th>varias cosas</th></tr>
      <tr><td>nik</td><td>daukat</td><td>dau<b>z</b>kat</td></tr>
      <tr><td>zuk</td><td>daukazu</td><td>dau<b>z</b>kazu</td></tr>
      <tr><td>hark</td><td>dauka</td><td>dau<b>z</b>ka</td></tr>
      <tr><td>guk</td><td>daukagu</td><td>dau<b>z</b>kagu</td></tr>
      <tr><td>zuek</td><td>daukazue</td><td>dau<b>z</b>kazue</td></tr>
      <tr><td>haiek</td><td>daukate</td><td>dau<b>z</b>kate</td></tr></table>
      <div class="ex"><b>Ideia bat daukat!</b><span>¡Tengo una idea!</span></div>
      <div class="ex"><b>Bi seme-alaba dauzkat.</b><span>Tengo dos hijos.</span></div>
      <p>Lo que decide es <b>lo que se tiene</b>, no quién lo tiene: <i>Nik txakur bat <b>daukat</b></i>, <i>Nik bi txakur <b>dauzkat</b></i>.</p>
      <div class="warn">Con hi (tú de confianza): <i>hik daukak</i> (a un chico) / <i>daukan</i> (a una chica). En clase se usa zuk.</div>` },
    { t:'Quien tiene lleva -k', h:`
      <p>Con <i>eduki</i> el sujeto lleva <span class="hl">-k</span>, como con <i>ukan</i> (<i>nik, zuk, hark, guk…</i>):</p>
      <table><tr><th>El nombre termina en…</th><th>Forma</th><th>Ejemplo</th></tr>
      <tr><td>vocal</td><td>+ <b>-k</b></td><td>Karmele<b>k</b>, Ane<b>k</b></td></tr>
      <tr><td>consonante</td><td>+ <b>-ek</b></td><td>Mikel<b>ek</b>, Txomin<b>ek</b></td></tr>
      <tr><td>-r</td><td><b>-rrek</b></td><td>Aito<b>rrek</b></td></tr>
      <tr><td>con artículo</td><td><b>-ak</b></td><td>nire am<b>ak</b>, irakasle<b>ak</b></td></tr></table>
      <div class="ex"><b>Mikelek bizarra dauka.</b><span>Mikel tiene barba.</span></div>
      <div class="ex"><b>Nire amak begi urdinak dauzka.</b><span>Mi madre tiene los ojos azules.</span></div>
      <div class="warn">«Mikel bizarra dauka» es incorrecto: falta la -k. Esto se ve a fondo en <i>NORK eta UKAN</i>.</div>` },
    { t:'Describir: ile luzea dauka', h:`
      <p>Para describir el aspecto: <b>parte del cuerpo + adjetivo + artículo</b> y <i>eduki</i>. El artículo va <b>una vez, al final</b>:</p>
      <table><tr><th>Euskera</th><th>Castellano</th></tr>
      <tr><td>Ile luze<b>a</b> dauka</td><td>Tiene el pelo largo</td></tr>
      <tr><td>Ile labur kizkur<b>ra</b> dauka</td><td>Tiene el pelo corto y rizado</td></tr>
      <tr><td>Begi handi<b>ak</b> dau<b>z</b>ka</td><td>Tiene los ojos grandes</td></tr>
      <tr><td>Betaurreko<b>ak</b> dau<b>z</b>ka</td><td>Lleva gafas</td></tr></table>
      <p><b>Ilea</b> es singular (<i>dauka</i>); <b>begiak</b>, <b>belarriak</b> y <b>betaurrekoak</b>, plural (<i>dauzka</i>).</p>
      <p>Con <b>izan</b> se dice cómo <b>es</b>; con <b>eduki</b>, qué <b>tiene</b>:</p>
      <div class="ex"><b>Peio ilehoria da. / Peiok ile horia dauka.</b><span>Peio es rubio. / Peio tiene el pelo rubio.</span></div>
      <div class="warn">Con <i>da</i> el sujeto va sin -k (<i>Peio</i>); con <i>dauka</i>, con -k (<i>Peiok</i>).</div>` },
    { t:'Badaukazu…-rik? (preguntas)', h:`
      <p>Para preguntar si alguien tiene algo: <span class="hl">ba-</span> delante del verbo y <span class="hl">-rik / -ik</span> detrás de la cosa, sin artículo:</p>
      <table><tr><th>La palabra termina en…</th><th>Forma</th><th>Ejemplo</th></tr>
      <tr><td>vocal</td><td><b>-rik</b></td><td>betaurreko<b>rik</b>, seme-alaba<b>rik</b></td></tr>
      <tr><td>consonante</td><td><b>-ik</b></td><td>txakurr<b>ik</b>, lan<b>ik</b>, bizarr<b>ik</b></td></tr></table>
      <div class="ex"><b>Badaukazu txakurrik? — Bai, badaukat. / Ez, ez daukat.</b><span>¿Tienes perro? — Sí, tengo. / No, no tengo.</span></div>
      <div class="ex"><b>Sabak badauka betaurrekorik?</b><span>¿Saba tiene gafas?</span></div>
      <p>Con <b>-rik</b> el verbo va en singular aunque sean varias cosas: <i>Badauka betaurrekorik?</i></p>
      <p>Si se habla de una cosa <b>concreta</b>, se usa el artículo: <i>Badaukazu liburu<b>a</b>?</i> (¿Tienes <b>el</b> libro?).</p>` },
    { t:'Ez dauka…-rik (negación)', h:`
      <p>En negativa: <span class="hl">ez + dauka</span> y la cosa con <b>-rik / -ik</b>:</p>
      <div class="ex"><b>Txominek ez dauka ilerik.</b><span>Txomin no tiene pelo.</span></div>
      <div class="ex"><b>Ez daukat betaurrekorik.</b><span>No tengo gafas.</span></div>
      <div class="ex"><b>Gaur ez daukagu etxeko lanik.</b><span>Hoy no tenemos deberes.</span></div>
      <p>Con una cosa concreta se mantiene el artículo: <i>Ez dauzka zure etxeko lanak</i> (no tiene <b>tus</b> deberes).</p>
      <div class="warn">«Ez dauka bizarra» solo vale para una barba concreta. Para decir que no tiene barba: <b>ez dauka bizarrik</b>.</div>` },
    { t:'Eduki y ukan', h:`
      <p>Los dos significan «tener». <b>Ukan</b> (<i>dut, duzu, du</i>) se usa mucho también como auxiliar; <b>eduki</b> se usa solo para «tener» y es muy habitual en Bizkaia.</p>
      <div class="ex"><b>Hogeita hamar urte ditut. / Hogeita hamar urte dauzkat.</b><span>Tengo treinta años (las dos valen).</span></div>
      <p>Frase hecha útil: <b>Buruko mina daukat</b> (me duele la cabeza; literalmente, «tengo dolor de cabeza»).</p>` }
  ],

  grammar:[
    { t:'NOR o NORK: ¿quién lleva -k?', h:`
      <p>En euskera el sujeto cambia según el verbo. Si el verbo <b>tiene objeto</b> (se puede preguntar <i>zer?</i>: ¿qué has comido?, ¿qué has comprado?), el sujeto lleva <span class="hl">-k</span> y el auxiliar es <b>ukan</b>. Si no tiene objeto, el sujeto va sin -k y el auxiliar es <b>izan</b>.</p>
      <table><tr><th>Sin objeto · NOR + izan</th><th>Con objeto · NORK + ukan</th></tr>
      <tr><td><b>Ni</b> etorri naiz</td><td><b>Nik</b> ogia jan dut</td></tr>
      <tr><td><b>Kepa</b> joan da</td><td><b>Kepak</b> afaria prestatu du</td></tr>
      <tr><td><b>Gu</b> etxean geratu gara</td><td><b>Guk</b> atea ireki dugu</td></tr></table>
      <p>Pronombres: ni → <b>nik</b>, zu → <b>zuk</b>, hura → <b>hark</b>, gu → <b>guk</b>. <i>Zuek</i> y <i>haiek</i> se quedan igual.</p>
      <div class="ex"><b>Nor etorri da? — Ane. / Nork ekarri du? — Anek.</b><span>¿Quién ha venido? — Ane. / ¿Quién lo ha traído? — Ane.</span></div>` },
    { t:'Cómo se pone la -k', h:`
      <table><tr><th>La palabra…</th><th>Forma</th><th>Ejemplo</th></tr>
      <tr><td>nombre acabado en vocal</td><td>+ <b>-k</b></td><td>Ane<b>k</b>, Kepa<b>k</b>, Josune<b>k</b></td></tr>
      <tr><td>nombre acabado en consonante</td><td>+ <b>-ek</b></td><td>Jon<b>ek</b>, Miren<b>ek</b></td></tr>
      <tr><td>acabado en -r</td><td><b>-rrek</b></td><td>Aito<b>rrek</b></td></tr>
      <tr><td>con artículo, uno</td><td><b>-ak</b></td><td>irakasle<b>ak</b>, nire am<b>ak</b></td></tr>
      <tr><td>con artículo, varios</td><td><b>-ek</b></td><td>irakasle<b>ek</b>, ume<b>ek</b></td></tr></table>
      <div class="ex"><b>Irakasleak liburua irakurri du. / Ikasleek liburua irakurri dute.</b><span>La profesora ha leído el libro. / Los alumnos han leído el libro.</span></div>
      <div class="warn"><i>Ikasleak</i> puede ser «el alumno» con -k o «los alumnos» sin -k. Lo aclara el verbo: <i>ikasleak etorri dira</i> (los alumnos han venido) / <i>ikasleak ogia jan du</i> (el alumno ha comido pan).</div>` },
    { t:'UKAN en presente', h:`
      <p>Hay dos columnas, como en eduki. Lo que decide es <b>lo que se ha hecho, comido, comprado…</b>: una cosa o varias. La columna de varias lleva <span class="hl">-it-</span>.</p>
      <table><tr><th>Quién</th><th>una cosa</th><th>varias cosas</th></tr>
      <tr><td>nik</td><td>dut</td><td>d<b>it</b>ut</td></tr>
      <tr><td>zuk</td><td>duzu</td><td>d<b>it</b>uzu</td></tr>
      <tr><td>hark</td><td>du</td><td>d<b>it</b>u</td></tr>
      <tr><td>guk</td><td>dugu</td><td>d<b>it</b>ugu</td></tr>
      <tr><td>zuek</td><td>duzue</td><td>d<b>it</b>uzue</td></tr>
      <tr><td>haiek</td><td>dute</td><td>d<b>it</b>uz<b>t</b>e</td></tr></table>
      <div class="ex"><b>Nik giltza galdu dut. / Nik giltzak galdu ditut.</b><span>He perdido la llave. / He perdido las llaves.</span></div>
      <div class="ex"><b>Umeek gozoki asko jan dituzte.</b><span>Los niños han comido muchos dulces.</span></div>
      <p><b>Verbo + dut</b> = «he hecho» algo hoy o hace poco: <i>gaur ikusi dut</i>. Para «ayer» (<i>atzo</i>) hay otro pasado, que llega en A2.</p>
      <div class="warn">En Bizkaia oirás <i>dot, dozu, dau, dogu, dozue, dabe</i>. En batua se dice y se escribe <i>dut, duzu, du…</i></div>` },
    { t:'¿Izan o ukan?', h:`
      <p>Truco: si puedes preguntar <b>zer?</b> (¿qué?), va con <b>ukan</b>. Si no, con <b>izan</b>.</p>
      <table><tr><th>Con izan (naiz, da…)</th><th>Con ukan (dut, du…)</th></tr>
      <tr><td>joan, etorri, iritsi</td><td>jan, edan, ikusi</td></tr>
      <tr><td>sartu, atera, itzuli</td><td>erosi, saldu, ekarri, eraman</td></tr>
      <tr><td>igo, jaitsi, erori</td><td>hartu, egin, esan</td></tr>
      <tr><td>jaiki, esnatu, geratu</td><td>ireki, itxi, garbitu, prestatu, galdu</td></tr></table>
      <div class="ex"><b>Ni etxera itzuli naiz eta afaria prestatu dut.</b><span>He vuelto a casa y he preparado la cena.</span></div>
      <p>Algunos verbos valen para los dos, según tengan objeto o no: <i>etxean sartu <b>naiz</b></i> (he entrado en casa) / <i>hanka sartu <b>dut</b></i> (he metido la pata).</p>` },
    { t:'Afirmativa, negativa y pregunta', h:`
      <p>En la negativa, <b>ez + auxiliar</b> se van delante y el verbo queda detrás:</p>
      <table><tr><th></th><th>Euskera</th><th>Castellano</th></tr>
      <tr><td>Sí</td><td>Ogia <b>erosi dut</b></td><td>He comprado pan</td></tr>
      <tr><td>No</td><td><b>Ez dut</b> ogia <b>erosi</b></td><td>No he comprado pan</td></tr>
      <tr><td>¿?</td><td>Ogia <b>erosi duzu</b>?</td><td>¿Has comprado pan?</td></tr></table>
      <div class="ex"><b>Autoa ekarri duzu? — Bai, ekarri dut. / Ez, ez dut ekarri.</b><span>¿Has traído el coche? — Sí, lo he traído. / No, no lo he traído.</span></div>
      <p>Pronunciación: <i>ez dut</i> suena «eztut»; <i>ez du</i>, «eztu»; <i>ez dugu</i>, «eztugu».</p>
      <div class="warn">«Ez erosi dut» está mal: el <i>ez</i> va pegado al auxiliar.</div>` },
    { t:'Nork? Zer? Ezer', h:`
      <p>La palabra de la pregunta va <b>justo delante del verbo</b>:</p>
      <div class="ex"><b>Nork ekarri du pastela? — Josunek.</b><span>¿Quién ha traído la tarta? — Josune.</span></div>
      <div class="ex"><b>Zer erosi duzue? — Ogia eta esnea.</b><span>¿Qué habéis comprado? — Pan y leche.</span></div>
      <p>La respuesta a <i>nork?</i> también lleva -k (<i>Josunek</i>). A <i>nor?</i> se responde sin -k: <i>Nor etorri da? — Josune</i>.</p>
      <p><b>Ezer</b>: con <i>ez</i> significa «nada»; en una pregunta, «algo»:</p>
      <div class="ex"><b>Ez dut ezer jan. / Ezer erosi duzu?</b><span>No he comido nada. / ¿Has comprado algo?</span></div>` }
  ],

    { t:'Anaia, arreba, neba, ahizpa', h:`
      <p>Para «hermano» y «hermana» el euskera mira quién habla: un chico o una chica.</p>

      <p>Fíjate: delante del guion, <i>anaia</i> y <i>aitona</i> pierden la a (<b>anai-</b>, <b>aiton-</b>).</p>` },
    { t:'¿La a es artículo o es de la palabra?', h:`
      <p>En la app, la <b>(a)</b> entre paréntesis es el <b>artículo</b>: no es parte de la palabra y desaparece cuando la palabra se usa sin él.</p>
      <table><tr><th></th><th>seme(a)</th><th>alaba</th></tr>
      <tr><td>la palabra sola</td><td>seme</td><td>alaba</td></tr>
      <tr><td>«el / la»</td><td>seme<b>a</b></td><td>alaba</td></tr>

      <tr><td>con… (-ekin)</td><td>seme<b>arekin</b></td><td>alaba<b>rekin</b></td></tr></table>
      <p>Si la palabra ya acaba en -a (<i>alaba, ama, osaba, izeba, arreba, ahizpa</i>), el artículo no se ve: no se dice «alabaa».</p>
      <p>Con -r, el artículo dobla la r: <b>senar(ra)</b> → senar bat, senar<b>ra</b>, senar<b>rarekin</b>. Y en plural, <b>begi(ak)</b> → begi bat, begi<b>ak</b>.</p>

    { t:'Nire, zure, bere…', h:`
      <p>El posesivo va delante y el nombre <b>conserva su artículo</b>:</p>
      <table><tr><th>Persona</th><th>Posesivo</th><th>Ejemplo</th></tr>
      <tr><td>ni</td><td><b>nire</b></td><td>nire semea — mi hijo</td></tr>
      <tr><td>zu</td><td><b>zure</b></td><td>zure alaba — tu hija</td></tr>
      <tr><td>hura</td><td><b>bere</b></td><td>bere emaztea — su mujer</td></tr>

      <tr><td>zuek</td><td><b>zuen</b></td><td>zuen etxea — vuestra casa</td></tr>
      <tr><td>haiek</td><td><b>haien</b></td><td>haien seme-alabak — sus hijos</td></tr></table>
      <div class="warn">«Nire seme da» no: <b>nire seme<u>a</u> da</b>. Pero con número va sin artículo: <i>nire bi semeak</i> (mis dos hijos) ≠ <i>bi seme</i> (dos hijos).</div>
      <p>El posesivo no cambia en plural: <i>nire anaia → nire anaiak</i>.</p>` },
    { t:'Noren? — de quién (-ren)', h:`
      <p>El «dueño» va <b>delante</b> con <b>-ren</b>, al revés que en castellano:</p>

      <table><tr><th>Acaba en…</th><th>Se añade</th><th>Ejemplos</th></tr>

      <tr><td>consonante (nombre propio)</td><td><b>-en</b></td><td>Antton<b>en</b> anaia, Luis<b>en</b> emaztea</td></tr>
      <tr><td>nombre común, «el / la»</td><td><b>-aren</b></td><td>seme<b>aren</b> laguna, ama<b>ren</b> etxea</td></tr>
      <tr><td>nombre común, plural</td><td><b>-en</b></td><td>guraso<b>en</b> etxea (la casa de los padres)</td></tr></table>
      <div class="ex"><b>Noren semea da Eneko? — Anttonen semea da.</b><span>¿De quién es hijo Eneko? — Es hijo de Antton.</span></div>
      <div class="warn">Ojo: <i>Luisen</i> (de Luis) ≠ <i>Luisaren</i> (de Luisa).</div>` },
    { t:'Norekin bizi zara?', h:`
      <p><b>-ekin</b> es «con». Aquí solo para entender la pregunta <b>Norekin bizi zara?</b> (¿con quién vives?); se practica a fondo en A2.</p>
      <table><tr><th>Acaba en…</th><th>Se añade</th><th>Ejemplos</th></tr>
      <tr><td>vocal (nombre propio)</td><td><b>-rekin</b></td><td>Luisa<b>rekin</b></td></tr>
      <tr><td>consonante (nombre propio)</td><td><b>-ekin</b></td><td>Marlen<b>ekin</b></td></tr>
      <tr><td>nombre común, «el / la»</td><td><b>-arekin</b></td><td>nire ama<b>rekin</b>, nire seme<b>arekin</b></td></tr>
      <tr><td>nombre común, plural</td><td><b>-ekin</b></td><td>guraso<b>ekin</b>, seme-alab<b>ekin</b></td></tr></table>
      <p>Es la misma regla que -ren, cambiando <b>-ren</b> por <b>-rekin</b>. Y con pronombres: <b>nirekin</b>, <b>zurekin</b>, <b>gurekin</b>.</p>

      <p>En plural, <i>seme-alabak</i> pierde la -ak: seme-alab<b>ekin</b>, no «seme-alabakekin».</p>` },
    { t:'Hau da nire familia', h:`
      <p>Para presentar a la familia:</p>
      <div class="ex"><b>Hau nire ama da. Hauek nire gurasoak dira.</b><span>Esta es mi madre. Estos son mis padres.</span></div>
      <p>Para contar hermanos e hijos se usa <b>ukan</b> (ditut, dituzu…), y el número va sin artículo:</p>
      <div class="ex"><b>Zenbat anai-arreba dituzu? — Bi anaia ditut.</b><span>¿Cuántos hermanos tienes? — Tengo dos hermanos.</span></div>

  ],
