<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ikasi! · Euskera A0–A2</title>
<style>@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format('woff2')}</style>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ikasi!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#62d6ff">
<style>
:root{
  --ink:#2d0a4e; --ink2:#5b3f7a; --white:#fff;
  --mint:#4ff5a8; --mint-d:#12c270; --mint-l:#d6ffeb;
  --cyan:#b1fbfb; --cyan-d:#5ad3e6; --cyan-l:#effefe;
  --yellow:#f7ee55; --yellow-d:#c3b92b; --yellow-l:#fffbd2;
  --pink:#fb6ee8; --pink-d:#c43fbe; --pink-l:#ffe2fb;
  --coral:#ff7c8f; --coral-d:#d8445c; --coral-l:#ffe1e6;
  --orange:#ffad3b; --orange-d:#e07a12;
  --plum:#4b1446; --plum-d:#2a0b33;
  --sky1:#62d6ff; --sky2:#3f98ff; --sky3:#6a7dff;
  --panel:rgba(255,255,255,.28); --panel-deep:rgba(38,62,190,.30);
  --bw:4px; --r:24px;
  /* alias que usa el contenido de gramática */
  --green:var(--mint-d); --green-d:#0b8f52; --green-l:var(--mint-l);
  --red:var(--coral-d); --red-d:#b3324a; --red-l:var(--coral-l);
  --gold:var(--yellow); --gold-d:#a39a1c; --gold-l:var(--yellow-l);
  --blue:#3f98ff; --blue-d:#2b5fd6; --blue-l:var(--cyan-l);
  --purple:#7b2fd0; --purple-d:#5b1fa6;
  --line:#d9d2e6; --soft:#f3f0f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky3)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 48%,var(--sky3) 100%) fixed}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-weight:700;color:var(--ink)}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 14px 8px;background:linear-gradient(180deg,var(--sky1) 70%,rgba(98,214,255,0))}
.top .l{display:flex;justify-content:flex-end}.top .r{display:flex;gap:8px}
.chip{height:46px;min-width:80px;padding:0 14px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;font-size:17px;
  background:linear-gradient(180deg,#5a1a4e,var(--plum-d));border:3px solid #6e2d63;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.chip svg{width:22px;height:22px}
.chip.fire svg{color:#ffb020}.chip.gem svg{color:#ffe14a}
.chip.round{min-width:46px;width:46px;padding:0}
.chip:active{transform:translateY(2px)}
.avatar{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(180deg,#6e2d63,var(--plum-d));box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#5fc616}
.avatar:active{transform:scale(.94)}

/* ---------- botones con borde y labio ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px 18px;border-radius:22px;font-size:19px;font-weight:900;letter-spacing:-.2px;
  border:var(--bw) solid var(--ink);color:var(--ink);background:var(--cyan);box-shadow:inset 0 -7px 0 var(--cyan-d);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cyan-d)}
.btn-green{background:var(--mint);box-shadow:inset 0 -7px 0 var(--mint-d)}
.btn-green:active:not(:disabled){box-shadow:inset 0 -3px 0 var(--mint-d)!important}
.btn-red{background:var(--coral);box-shadow:inset 0 -7px 0 var(--coral-d)}
.btn-red:active:not(:disabled){box-shadow:inset 0 -3px 0 var(--coral-d)!important}
.btn-blue,.btn-ghost{background:var(--cyan);box-shadow:inset 0 -7px 0 var(--cyan-d)}
.btn-yellow{background:var(--yellow);box-shadow:inset 0 -7px 0 var(--yellow-d)}
.btn-pink{background:var(--pink);box-shadow:inset 0 -7px 0 var(--pink-d)}
.btn-white{background:#fff;box-shadow:inset 0 -7px 0 #cfc7de}
.btn:disabled{background:#c9d3f5;color:#7c74a8;border-color:#7c74a8;box-shadow:inset 0 -7px 0 #a8b3e0;cursor:default}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px 12px;font-size:15px;border-radius:18px;border-width:3px;box-shadow:inset 0 -5px 0 var(--cyan-d)}
.btn.sm.btn-green{box-shadow:inset 0 -5px 0 var(--mint-d)}
.btn .stk{position:absolute;left:-14px;top:50%;width:54px;height:54px;transform:translateY(-50%) rotate(-10deg);filter:drop-shadow(0 3px 0 var(--ink))}

/* ---------- títulos tipo pastilla ---------- */
.pillhead{display:inline-block;background:var(--ink);color:#fff;border-radius:30px;padding:10px 24px;font-size:20px;font-weight:900;letter-spacing:-.3px}
.wordmark{font-weight:900;color:#fff;letter-spacing:-1px;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}

/* ---------- panel de bienvenida ---------- */
.hero{margin:6px 14px 6px;padding:14px 16px 0;border-radius:var(--r);background:var(--panel);display:flex;align-items:flex-end;gap:10px;min-height:170px;position:relative;overflow:hidden}
.hero .h-txt{flex:1;padding-bottom:16px}
.hero .bub{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:22px;font-weight:900;position:relative;margin-bottom:10px}
.hero .bub::after{content:"";position:absolute;right:-10px;bottom:12px;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg)}
.hero .goal-line{display:flex;align-items:center;gap:10px;font-size:14px}
.hero .goal-line .ring{width:50px;height:50px;flex:none}
.hero .hc{height:156px;flex:none;align-self:flex-end;cursor:pointer}
.next-review{margin:10px 14px;padding:12px 14px;border-radius:20px;background:var(--yellow);border:var(--bw) solid var(--ink);box-shadow:inset 0 -6px 0 var(--yellow-d);display:flex;align-items:center;gap:12px;font-size:14px}
.next-review b{font-size:16px}
.next-review .btn{margin-left:auto}

/* ---------- camino ---------- */
.level-h{margin:28px 14px 6px;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 0 rgba(45,10,78,.35)}
.level-h::before,.level-h::after{content:"";flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.ublock{margin:34px 14px 8px;border-radius:var(--r);background:var(--panel-deep);padding:30px 0 10px;position:relative}
.unit{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:440px;background:var(--ink);color:#fff;border-radius:30px;padding:8px 10px 8px 20px;display:flex;align-items:center;gap:10px}
.unit .u-txt{flex:1;min-width:0}
.unit small{color:var(--uc,#b1fbfb);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:900}
.unit h2{margin:0;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit p{display:none}
.u-sub{text-align:center;color:#fff;font-size:13px;font-weight:700;margin:4px 20px 0;opacity:.95}
.unit .u-gram{width:42px;height:42px;border-radius:50%;background:var(--uc,var(--cyan));border:3px solid #fff;display:grid;place-items:center;color:var(--ink);flex:none}
.unit .u-gram:active{transform:scale(.92)}
.ublock.locked{background:rgba(255,255,255,.16);padding:30px 0 16px}
.ublock.locked .unit{background:#5c4f8a;color:#d9d3f0}
.ublock.locked .unit small{color:#d9d3f0}
.ublock.locked .unit>svg{width:24px;height:24px;margin-right:8px;opacity:.8}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:52px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2}
.node{width:76px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;transition:transform .1s;border:var(--bw) solid var(--ink);background:var(--nc);box-shadow:inset 0 -8px 0 var(--nd),0 5px 0 rgba(45,10,78,.35)}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 var(--nd),0 1px 0 rgba(45,10,78,.35)}
.node.done{--nc:var(--yellow);--nd:var(--yellow-d)}
.node.current{outline:5px solid #fff;outline-offset:3px;animation:bob 1.6s ease-in-out infinite}
.node-label{font-size:12px;color:#fff;margin-top:10px;font-weight:900;text-shadow:0 2px 0 rgba(45,10,78,.4)}
.start-tip{position:absolute;top:-44px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-size:14px;font-weight:900;color:var(--ink);white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:3}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pchar{position:absolute;top:130px;width:36%;height:190px;z-index:1;cursor:pointer;display:flex;align-items:flex-end}
.pchar.r{right:2%;justify-content:flex-end}.pchar.l{left:2%;justify-content:flex-start}
.pchar.talking{z-index:4}
.pchar img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;transform-origin:50% 100%}
.pchar .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;white-space:nowrap;font-size:15px;font-weight:900;transition:transform .2s cubic-bezier(.3,1.6,.5,1);text-align:center;margin-bottom:6px}
.pchar .say small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.pchar .say.on{transform:translateX(-50%) scale(1)}

/* ---------- navegación inferior ---------- */
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;background:var(--ink);border-radius:30px;display:flex;justify-content:space-around;padding:7px;z-index:30;box-shadow:0 6px 18px rgba(30,20,90,.35)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:24px;color:#bfb2db;font-size:11px;font-weight:800;position:relative}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--ink);background:var(--mint);box-shadow:inset 0 -4px 0 var(--mint-d)}
.nav .badge{position:absolute;top:2px;right:18%;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:10px;padding:0 5px;line-height:15px}

/* ---------- secciones ---------- */
.sec{padding:10px 14px}
.sec>.ttl{text-align:center;margin:8px 0 -26px;position:relative;z-index:2}
.sec .sub{color:var(--ink);margin:0 0 14px;font-size:14px;text-align:center;font-weight:700}
.panel{background:var(--panel-deep);border-radius:var(--r);padding:42px 14px 14px;margin-bottom:14px}
.card{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:12px;background:var(--cyan-l);box-shadow:inset 0 -5px 0 #c9eef3}
.card h3{margin:0 0 4px;font-size:17px;font-weight:900}
.card .meta{color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.search{width:100%;padding:13px 16px;border:3px solid var(--ink);border-radius:18px;font-size:16px;background:#fff;outline:none;margin-bottom:14px}
.search:focus{box-shadow:0 0 0 4px #fff}
.wlist{margin:10px 0 0;padding:0;list-style:none}
.wlist li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:2px solid #cde7ee;font-size:15px}
.wlist .eu{font-weight:900;flex:1}
.wlist .es{color:var(--ink2);font-weight:600;flex:1;text-align:right}
.dots{display:flex;gap:2px}.dots i{width:7px;height:7px;border-radius:50%;background:#cde7ee}.dots i.on{background:var(--mint-d)}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:16px;padding:2px 0}
.acc-h .chev{margin-left:auto;transition:transform .2s;color:var(--ink);width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:none;margin-top:10px}.acc.open .acc-b{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.6px;font-weight:900}
.pill.cloud{background:var(--pink);color:var(--ink)}

/* ---------- contenido de gramática ---------- */
.tip h4{margin:14px 0 6px;font-size:16px;font-weight:900}
.tip p{margin:6px 0;font-weight:600;line-height:1.5;font-size:15px}
.tip table{border-collapse:separate;border-spacing:0;width:100%;margin:8px 0;font-size:15px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.tip td,.tip th{padding:7px 10px;border-bottom:2px solid #e6e0f0;text-align:left;font-weight:600}
.tip td b{font-weight:900}
.tip tr:last-child td{border-bottom:0}
.tip th{background:var(--ink);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.tip .ex{background:var(--mint-l);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:800}
.tip .ex b{color:#0b7a46}
.tip .ex span{display:block;color:var(--ink2);font-weight:600;font-size:14px}
.tip .warn{background:var(--yellow-l);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px;margin:8px 0}
.hl{color:var(--purple-d);font-weight:900}

/* ---------- pantalla de lección ---------- */
.lesson{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%)}
.l-top{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}
.l-x{width:44px;height:44px;flex:none;color:#fff;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#5a1a4e,var(--plum-d));border:3px solid #6e2d63}
.bar{flex:1;height:24px;background:rgba(255,255,255,.4);border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--mint);box-shadow:inset 0 -5px 0 var(--mint-d);border-radius:0 10px 10px 0;transition:width .45s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.55)}
.combo{font-size:14px;color:#fff;font-weight:900;min-width:52px;text-align:right;opacity:0;transition:opacity .2s;text-shadow:0 2px 0 var(--ink)}
.combo.on{opacity:1;animation:pop .35s}
.l-body{flex:1;overflow-y:auto;padding:8px 16px 20px}
.l-foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));position:relative}
.q-kind{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--ink);border-radius:20px;padding:4px 12px;margin:8px 0 8px;font-weight:900}
.q-title{font-size:23px;font-weight:900;margin:0 0 18px;line-height:1.25;color:var(--ink)}
.q-title .eu{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 8px}
.speak{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 -5px 0 var(--yellow-d);vertical-align:middle;margin-right:8px}
.speak:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 var(--yellow-d)}
.speak svg{width:24px;height:24px}

.intro{display:flex;flex-direction:column-reverse;align-items:center;gap:14px;margin-top:6px}
.intro .ichar{max-height:230px;max-width:70%;width:auto;height:auto;flex:none;cursor:pointer}
.intro-card{width:100%;background:#fff;border:var(--bw) solid var(--ink);border-radius:24px;padding:20px 16px;text-align:center;box-shadow:inset 0 -7px 0 #d9d2e6;position:relative;animation:pop .4s}
.intro-card::after{content:"";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);border:10px solid transparent;border-top:16px solid var(--ink)}
.intro-card::before{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:7px solid transparent;border-top:11px solid #fff;z-index:1}
.intro-card .new{display:inline-block;background:var(--pink);color:var(--ink);border:3px solid var(--ink);font-size:12px;padding:2px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase;font-weight:900}
.intro-card .big{font-size:32px;font-weight:900;margin:12px 0 4px;color:var(--ink);word-break:break-word}
.intro-card .tr{font-size:18px;color:var(--ink2);font-weight:700}
.intro-card .note{margin-top:12px;font-size:14px;color:var(--ink);background:var(--yellow-l);border-radius:12px;padding:8px 12px;font-weight:600}
.intro-card .exs{margin-top:10px;background:var(--mint-l);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left}
.intro-card .exs span{display:block;color:var(--ink2);font-weight:600;font-size:14px}

.opts{display:grid;gap:12px}
.opt{width:100%;text-align:left;padding:13px 16px 17px;border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:inset 0 -7px 0 var(--cyan-d);font-size:18px;font-weight:800;background:var(--cyan);display:flex;align-items:center;gap:12px;transition:transform .08s}
.opt .k{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;background:#fff;font-weight:900}
.opt:active{transform:translateY(3px)}
.opt.sel{background:#fff;box-shadow:inset 0 -7px 0 #cfc7de,0 0 0 5px #fff}
.opt.right{background:var(--mint);box-shadow:inset 0 -7px 0 var(--mint-d)}
.opt.wrong{background:var(--coral);box-shadow:inset 0 -7px 0 var(--coral-d)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px}
.m{padding:13px 8px 16px;border:var(--bw) solid var(--ink);border-radius:18px;box-shadow:inset 0 -6px 0 var(--cyan-d);font-size:16px;background:var(--cyan);min-height:60px;transition:all .15s}
.m.sel{background:#fff;box-shadow:inset 0 -6px 0 #cfc7de,0 0 0 4px #fff}
.m.ok{background:var(--mint);box-shadow:inset 0 -6px 0 var(--mint-d);animation:pop .3s}
.m.gone{opacity:.3;pointer-events:none;box-shadow:none;transform:scale(.96)}
.m.bad{background:var(--coral);box-shadow:inset 0 -6px 0 var(--coral-d);animation:shake .35s}

.sentence{font-size:22px;font-weight:900;line-height:1.6;margin:4px 0 22px;background:#fff;border:var(--bw) solid var(--ink);border-radius:20px;padding:12px 16px}
.blank{display:inline-block;min-width:64px;border-bottom:4px solid var(--ink);text-align:center;color:#7b2fd0;padding:0 2px}
.blank.filled{animation:pop .25s}

.answer-line{min-height:122px;border-radius:20px;background:rgba(255,255,255,.35);border:3px dashed rgba(45,10,78,.45);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px 12px;border:3px solid var(--ink);border-radius:14px;box-shadow:inset 0 -5px 0 #cfc7de;font-size:17px;background:#fff;animation:pop .2s}
.tile:active{transform:translateY(2px)}
.tile.used{color:transparent;background:rgba(45,10,78,.18);border-color:transparent;box-shadow:none;pointer-events:none;animation:none}

.typebox{width:100%;min-height:110px;border:var(--bw) solid var(--ink);border-radius:20px;background:#fff;padding:14px;font-size:19px;resize:none;outline:none}
.typebox:focus{box-shadow:0 0 0 4px var(--yellow)}

/* hoja de corrección */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 90px));transition:transform .3s cubic-bezier(.2,1.2,.4,1);z-index:2;border:var(--bw) solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0}
.sheet.show{transform:none}
.sheet.ok{background:var(--mint-l)}
.sheet.bad{background:var(--coral-l)}
.sheet .s-h{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;margin-bottom:6px;padding-right:34%}
.sheet .s-h .ic{width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.sheet .s-b{font-size:16px;font-weight:700;margin-bottom:14px;line-height:1.4;padding-right:32%;min-height:22px}
.sheet .s-b small{display:block;font-weight:600;opacity:.85;margin-top:4px}
.sheet .schar{position:absolute;right:8px;bottom:calc(100% - 96px);max-height:150px;max-width:31%;width:auto;height:auto;pointer-events:none}

/* final */
.finish{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%)}
.finish h1{font-size:38px;margin:10px 0 6px;animation:pop .5s;transform:rotate(-3deg)}
.finish p{color:var(--ink);margin:0 0 18px;font-weight:800}
.troupe{display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:440px;min-height:200px}
.troupe img{max-height:170px;max-width:34%;width:auto;height:auto;margin:0 -6px}
.troupe img:nth-child(2){max-height:200px;max-width:40%;position:relative;z-index:1}
.f-stats{display:flex;gap:10px;margin-bottom:24px}
.f-stat{border:var(--bw) solid var(--ink);border-radius:18px;overflow:hidden;min-width:96px;animation:rise .5s both;background:#fff}
.f-stat:nth-child(2){animation-delay:.12s}.f-stat:nth-child(3){animation-delay:.24s}
.f-stat .h{color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:5px;font-weight:900;border-bottom:3px solid var(--ink)}
.f-stat .v{font-size:24px;font-weight:900;padding:10px 6px}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .35s}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* repaso */
.rev-hero{display:flex;align-items:flex-end;gap:8px;text-align:left}
.rev-hero img{height:150px;flex:none}
.memrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.memrow span{width:96px;font-size:13px;color:var(--ink2)}
.memrow .bar{height:18px;border-width:3px}
.memrow b{width:34px;text-align:right}

/* inicio (splash) */
.splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%);animation:fadein .3s}
.splash .logo{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.splash .logo img{width:132px;animation:logoin .7s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 6px 0 rgba(45,10,78,.35))}
.splash .wm-wrap{transform:rotate(-4deg);margin-top:-6px}
.splash .logo .wordmark{display:inline-block;font-size:64px;animation:logoin .7s .15s cubic-bezier(.3,1.6,.5,1) both}
.splash .scene{width:100%;max-width:480px;border:var(--bw) solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(45,10,78,.35);animation:rise .6s .25s both}
.splash .scene img{display:block;width:100%}
.splash .tag{margin:16px 0 18px;font-weight:800;text-align:center}
.splash .btn{max-width:480px;font-size:24px;padding:16px 22px 22px}
@keyframes logoin{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,10,60,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.modal{background:var(--cyan-l);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;width:100%;max-width:560px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal h2{margin:0 0 10px;font-size:22px;font-weight:900}
.modal p{color:var(--ink2);margin:0 0 14px;font-weight:600;line-height:1.45}
.modal textarea,.modal input[type=text]{width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px;font-size:15px;background:#fff;outline:none;margin-bottom:12px}
.modal textarea{min-height:160px}
.modal .acts{display:grid;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid #cde7ee;font-size:16px}
.sw{width:56px;height:32px;border-radius:30px;background:#c9d3f5;border:3px solid var(--ink);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.sw.on{background:var(--mint)}.sw.on::after{left:26px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;z-index:99;animation:fadein .2s;white-space:nowrap}
.empty{text-align:center;color:var(--ink);padding:22px 10px;font-weight:600}
.hidden{display:none!important}

/* ---------- personajes: animaciones ---------- */
.ch{transform-origin:50% 100%;will-change:transform;user-select:none;-webkit-user-drag:none}
.idle-latxi{animation:hop 1.5s ease-in-out infinite}
.idle-joxe{animation:sway 3s ease-in-out infinite}
.idle-miren{animation:breathe 2.6s ease-in-out infinite}
.idle-harri{animation:lift 1.9s ease-in-out infinite}
.idle-ane{animation:dance 1s ease-in-out infinite}
.idle-peio{animation:march .7s ease-in-out infinite}
.idle-uxue{animation:lean 3.4s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0) scale(1,1)}65%{transform:translateY(0) scale(1.06,.93)}78%{transform:translateY(-14px) scale(.97,1.04)}90%{transform:translateY(0) scale(1.04,.96)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes lift{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-6px) rotate(-1.5deg)}60%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes dance{0%,100%{transform:rotate(-4deg) translateY(0)}25%{transform:rotate(0) translateY(-6px)}50%{transform:rotate(4deg) translateY(0)}75%{transform:rotate(0) translateY(-6px)}}
@keyframes march{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateX(-3px)}}
.act-pop{animation:chpop .55s cubic-bezier(.3,1.6,.5,1) both!important}
.act-jump{animation:chjump .8s cubic-bezier(.3,1.4,.5,1) both!important}
.act-sad{animation:chsad .7s ease-in-out both!important}
.act-talk{animation:chtalk .45s ease-in-out both!important}
.act-party{animation:chjump .9s ease-in-out infinite!important}
.act-party.d1{animation-delay:.15s!important}.act-party.d2{animation-delay:.3s!important}
@keyframes chpop{0%{transform:translateY(30px) scale(.4);opacity:0}70%{transform:translateY(-6px) scale(1.06);opacity:1}100%{transform:none}}
@keyframes chjump{0%{transform:none}25%{transform:translateY(4px) scale(1.08,.9)}55%{transform:translateY(-34px) scale(.95,1.06) rotate(-6deg)}80%{transform:translateY(0) scale(1.05,.95) rotate(3deg)}100%{transform:none}}
@keyframes chsad{0%,100%{transform:none}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg) translateY(4px)}80%{transform:translateY(4px) scale(1,.97)}}
@keyframes chtalk{0%,100%{transform:none}30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.03) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

{ id:'a0-1', level:'A0', title:'Kaixo!', sub:'Sonidos, saludos y cortesía',

    ['gero arte','hasta luego'],['bihar arte','hasta mañana'],['ikusi arte','hasta la vista'],['laster arte','hasta pronto'],['aspaldiko!','¡cuánto tiempo!'],['baita zuri ere','igualmente'],['hepa','hola (informal)'],['eskerrik asko','muchas gracias'],

      <p>El euskera se lee casi como se escribe. Lo nuevo para un hispanohablante:</p>

{ id:'a0-eus', level:'A0', title:'Euskaltegian', sub:'Frases y verbos de clase · pedir ayuda',
  vocab:[
    ['ez dut ulertzen','no (lo) entiendo','Se pronuncia «eztut ulertzen»'],['ez dakit','no (lo) sé','Se pronuncia «eztakit»'],
    ['badakit','lo sé / sí sé','Bai, badakit = sí, lo sé'],['ez dut gogoratzen','no me acuerdo','Se pronuncia «eztut gogoratzen»'],
    ['errepikatu, mesedez','repítelo, por favor'],['astiroago, mesedez','más despacio, por favor','astiro (despacio) + -ago (más)'],
    ['idatzi, mesedez','escríbelo, por favor'],['zer esan nahi du?','¿qué significa? / ¿qué quiere decir?','Para una palabra en euskera que no entiendes'],
    ['nola esaten da?','¿cómo se dice?','Nola esaten da «libro» euskaraz?'],['euskaraz','en euskera'],['berriro','otra vez / de nuevo'],
    ['hitza','la palabra'],['galdera','la pregunta','Termina en -a, así que ya lleva el artículo. Galdera bat = una pregunta'],['erantzuna','la respuesta'],
    ['irakurri','leer'],['idatzi','escribir'],['entzun','escuchar'],['galdetu','preguntar'],['erantzun','responder'],
    ['ikasi','estudiar / aprender'],['hasi','empezar'],['amaitu','terminar'],
    ['ariketa','el ejercicio','Termina en -a, como galdera'],['liburua','el libro'],['arkatza','el lápiz'],['mahaia','la mesa'],
    ['erraza','fácil','Ariketa erraza da = el ejercicio es fácil'],['zaila','difícil']
  ],
  grammar:[
    { t:'Pedir ayuda en clase', h:`
      <p>Con cuatro frases te apañas en cualquier clase. Las tres primeras llevan <b>mesedez</b> (por favor) detrás:</p>
      <table><tr><th>Si…</th><th>dices</th></tr>
      <tr><td>hablan demasiado rápido</td><td><b>Astiroago, mesedez</b></td></tr>
      <tr><td>no lo has oído bien</td><td><b>Errepikatu, mesedez</b></td></tr>
      <tr><td>quieres verlo escrito</td><td><b>Idatzi, mesedez</b></td></tr>
      <tr><td>sigues sin entenderlo</td><td><b>Berriro azaldu ahal duzu?</b></td></tr></table>
      <div class="ex"><b>Errepikatu berriro, mesedez</b><span>Repítelo otra vez, por favor</span></div>
      <p><b>Astiroago</b> = astiro (despacio) + <span class="hl">-ago</span> (más). Ese -ago sirve para comparar y volverá en A2.</p>` },
    { t:'Zer esan nahi du? ≠ Nola esaten da?', h:`
      <p>Las dos preguntan por palabras, pero en sentido contrario:</p>
      <table><tr><th>Pregunta</th><th>Tienes…</th><th>Quieres…</th></tr>
      <tr><td><b>Zer esan nahi du …?</b></td><td>la palabra en euskera</td><td>saber qué significa</td></tr>
      <tr><td><b>Nola esaten da … euskaraz?</b></td><td>la palabra en castellano</td><td>saber cómo se dice</td></tr></table>
      <div class="ex"><b>Zer esan nahi du «zaila»? — Difícil.</b><span>¿Qué significa «zaila»?</span></div>

      <p>Truco: si la pregunta lleva <b>euskaraz</b> (en euskera), la palabra de dentro está en castellano.</p>
      <p>Al pie de la letra, <i>zer esan nahi du</i> es «qué decir quiere»: zer (qué) + esan (decir) + nahi du (quiere).</p>` },
    { t:'No sé · no entiendo · no me acuerdo', h:`
      <p>En la negación, <b>ez</b> se une al verbo auxiliar y los dos van <span class="hl">delante</span>, como en <i>Ez naiz irakaslea</i>:</p>
      <table><tr><th>Sí</th><th>No</th></tr>
      <tr><td>Badakit · lo sé</td><td><b>Ez dakit</b> · no lo sé</td></tr>
      <tr><td>Ulertzen dut · lo entiendo</td><td><b>Ez dut ulertzen</b> · no lo entiendo</td></tr>
      <tr><td>Gogoratzen dut · me acuerdo</td><td><b>Ez dut gogoratzen</b> · no me acuerdo</td></tr></table>
      <p>Fíjate en <b>badakit</b>: para afirmar, <i>dakit</i> lleva <span class="hl">ba-</span> delante. <i>Bai, badakit</i> = sí, lo sé.</p>
      <div class="warn"><b>Pronunciación:</b> ez + d suena «zt»: <i>ez dakit</i> → «eztakit», <i>ez dut ulertzen</i> → «eztut ulertzen». Se escribe separado.</div>
      <div class="warn">Como estos verbos llevan <b>dut</b>, el sujeto va con <b>-k</b>: <b>Nik</b> ulertzen dut, no «Ni ulertzen dut». Normalmente se omite: <i>Ulertzen dut</i>. Lo verás a fondo en <i>NORK eta UKAN</i>.</div>` },
    { t:'Verbos de clase', h:`

const norm = s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!.,;:«»"'()\-—]/g,' ').replace(/\s+/g,' ').trim();
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const addDays = (d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(b[i-1]===a[j-1]?0:1));return m[b.length][a.length]}

let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(AC.state==='suspended')AC.resume(); return AC }
function tone(f,t0,dur,type='sine',vol=.18){
  const c=ac(); if(!c||!S.settings.sound) return;
  const o=c.createOscillator(), g=c.createGain(); const t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

   GENERACIÓN DE LECCIONES
   ========================================================= */
function lessonsOf(u){
  const h=Math.ceil(u.words.length/2);
  return [
    {id:u.id+'-h1',kind:'vocab',title:'Hitzak 1',words:u.words.slice(0,h),unit:u,icon:'star'},
    {id:u.id+'-h2',kind:'vocab',title:'Hitzak 2',words:u.words.slice(h),unit:u,icon:'star'},
    {id:u.id+'-g',kind:'grammar',title:'Gramatika',unit:u,icon:'book'},
    {id:u.id+'-p',kind:'practice',title:'Praktika',unit:u,icon:'dumbbell'}
  ];
}
function poolFor(w){ // distractores
  const same=Object.values(WORDS).filter(x=>x.src===w.src && norm(x.eu)!==norm(w.eu));
  return same.length>=3?same:Object.values(WORDS).filter(x=>norm(x.eu)!==norm(w.eu));
}
function mcEx(w,dir){
  const dist=[]; const seen=new Set([norm(dir==='eu'?w.es:w.eu)]);
  for(const x of shuffle(poolFor(w))){ const t=dir==='eu'?x.es:x.eu; if(!seen.has(norm(t))){seen.add(norm(t));dist.push(t)} if(dist.length===3)break }
  const right=dir==='eu'?w.es:w.eu;
  const opts=shuffle([right,...dist]);
  return {t:'mc',dir,w,opts,a:opts.indexOf(right)};
}
function matchEx(words){ return {t:'match',pairs:pick(words,Math.min(5,words.length))} }
function typeEx(w){ return {t:'type',w} }
function buildEx(sent,lang,unit){
  const [eu,es]=sent; const target=lang==='eu'?eu:es;
  const toks=norm(target).split(' ');
  const disp=s=>s.replace(/[¿?¡!.,]/g,'').split(/\s+/).filter(Boolean);
  const seen=new Set(toks); const others=[];
  (unit?unit.sentences:[]).filter(s=>s!==sent).flatMap(s=>disp(lang==='eu'?s[0]:s[1])).forEach(t=>{ const k=norm(t); if(!seen.has(k)){seen.add(k);others.push(t)} });
  const dist=pick(others,Math.min(3,Math.max(2,Math.round(toks.length/2))));
  const display=disp(target);
  return {t:'build',lang,eu,es,toks,tiles:shuffle([...display,...dist])};
}
function vocabLesson(words,unit){
  const q=[]; const chunks=[];
  for(let i=0;i<words.length;i+=3) chunks.push(words.slice(i,i+3));
  chunks.forEach(c=>{
    c.forEach(w=>q.push({t:'intro',w}));
    q.push(mcEx(pick(c,1)[0],'eu'));
    if(c.length>1) q.push(mcEx(pick(c,1)[0],'es'));
  });
  const end=[matchEx(words), ...pick(words,2).map(typeEx), ...pick(words,2).map(w=>mcEx(w,'es'))];
  if(words.length>6) end.push(matchEx(words));
  return [...q,...shuffle(end)];
}
function buildLesson(L){
  const u=L.unit;
  if(L.kind==='vocab') return vocabLesson(L.words,u);
  if(L.kind==='grammar'){
    return [...u.grammar.map(g=>({t:'tip',g})), ...shuffle(u.drills).map(d=>({t:'drill',d})), ...pick(u.sentences,2).map(s=>buildEx(s,'eu',u))];
  }
  // práctica
  const ex=[ ...u.sentences.map((s,i)=>buildEx(s,i%3===2?'es':'eu',u)), ...pick(u.drills,3).map(d=>({t:'drill',d})),
    matchEx(u.words), ...pick(u.words,3).map(typeEx), mcEx(pick(u.words,1)[0],'es') ];
  return shuffle(ex);
}
function deckLesson(d){
  const ws=deckWords(d); if(!ws.length) return [];
  const fresh=ws.filter(w=>!S.srs[norm(w.eu)]);
  const sel=(fresh.length>=4?fresh:ws).slice(0,9);
  return vocabLesson(sel,null);
}
function reviewLesson(){
  const due=shuffle(dueWords()).slice(0,12);
  return due.map((w,i)=>{ const r=i%3; return r===0?mcEx(w,'eu'):r===1?mcEx(w,'es'):typeEx(w) }).map(e=>(e.review=true,e));

function showConfirm(title,text,okLabel,onOk){
  modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="acts"><button class="btn btn-red wide" id="c-ok">${esc(okLabel)}</button><button class="btn btn-white wide" id="c-no">Cancelar</button></div>`,(m,close)=>{

function showGrammarModal(u){
  modal(`<h2>${esc(u.title)}</h2><div class="tip">${u.grammar.map(g=>`<h4>${esc(g.t)}</h4>${g.h}`).join('')}</div><div class="acts" style="margin-top:16px"><button class="btn btn-green wide" id="g-ok">Entendido</button></div>`,(m,close)=>{$('#g-ok',m).onclick=()=>{SFX.tap();close()}});
}
function parseLines(txt){
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.split(/\s*(?:=|;|\t|\s—\s|\s-\s|:)\s*/); if(m.length<2) return null;
    return {eu:m[0].trim(),es:m.slice(1).join(' / ').trim()};
  }).filter(w=>w&&w.eu&&w.es);
}
function showImportModal(){
  modal(`<h2>Añadir ficha</h2><p>Una palabra por línea: <b>euskera = castellano</b>. También vale «;», «:» o tabulador.</p>

  <div class="meta" id="im-n" style="margin:-4px 0 12px;color:var(--ink2)">0 palabras detectadas</div>

    $('#im-no',m).onclick=close;

let R=null; // run actual
function startLesson(queue,meta){
  R={ch:meta.ch||'latxi',queue:queue.slice(),i:0,total:queue.length,done:0,meta,first:0,firstOk:0,combo:0,maxCombo:0,start:Date.now(),retried:new Set(),answered:null,sel:null};
  const el=document.createElement('div'); el.className='lesson'; el.id='lesson';
  el.innerHTML=`<div class="l-top"><button class="l-x" id="l-x" aria-label="Salir"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="bar"><i id="l-bar"></i></div><div class="combo" id="l-combo"></div></div>
  <div class="l-body" id="l-body"></div>
  <div class="l-foot"><button class="btn btn-green wide" id="l-btn" disabled>Comprobar</button>
  <div class="sheet" id="l-sheet">${chImg(R.ch,'schar','id="s-ch"')}<div class="s-h"><span class="ic" id="s-ic"></span><span id="s-t"></span></div><div class="s-b" id="s-b"></div><button class="btn wide" id="s-btn">Continuar</button></div></div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  $('#l-x').onclick=()=>{ SFX.tap(); showConfirm('¿Salir de la lección?','Perderás el progreso de esta lección.','Salir',endLesson) };
  $('#s-btn').onclick=next;
  $('#l-btn').onclick=()=>{ if(R.ready) R.ready() };
  showItem();
}
function endLesson(){ const l=$('#lesson'); if(l) l.remove(); document.body.style.overflow=''; R=null; render() }
function setProgress(){ $('#l-bar').style.width=(R.done/R.total*100)+'%' }
function setBtn(label,enabled,fn,cls='btn-green'){ const b=$('#l-btn'); b.textContent=label; b.disabled=!enabled; b.className='btn wide '+cls; R.ready=fn }
function cur(){ return R.queue[R.i] }

function showItem(){
  setProgress();
  const it=cur(); const body=$('#l-body'); body.scrollTop=0; R.sel=null;
  $('#l-sheet').className='sheet'; $('#l-btn').style.visibility='visible';
  if(it.t==='intro') return rIntro(it,body);
  if(it.t==='tip') return rTip(it,body);
  if(it.t==='mc') return rMC(it,body);
  if(it.t==='match') return rMatch(it,body);
  if(it.t==='type') return rType(it,body);
  if(it.t==='build') return rBuild(it,body);
  if(it.t==='drill') return rDrill(it,body);
}
function rIntro(it,body){
  const w=it.w; srsSeen(w);
  body.innerHTML=`<div class="q-kind">Palabra nueva</div><div class="intro">${chImg(R.ch,'ichar act-pop','id="i-ch"')}<div class="intro-card"><span class="new">Berria</span><div class="big">${spkBtn(w.eu)}${esc(w.eu)}</div><div class="tr">${esc(w.es)}</div>${w.note?`<div class="note">${esc(w.note)}</div>`:''}${w.ex?`<div class="exs"><b>${esc(w.ex)}</b><span>${esc(w.exEs)}</span></div>`:''}</div></div>`;
  const ic=$('#i-ch'); ic.onclick=()=>{ act(ic,'talk'); speak(w.eu) }; body.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>act(ic,'talk')));
  setBtn('Continuar',true,()=>{SFX.tap();R.done++;advance()});
}
function rTip(it,body){
  body.innerHTML=`<div class="q-kind">Gramática</div><h2 class="q-title">${esc(it.g.t)}</h2><div class="tip">${it.g.h}</div>`;
  setBtn('Entendido',true,()=>{SFX.tap();R.done++;advance()});
}
function optList(opts,onSel){
  return opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('');
}
function bindOpts(body,onSel){
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(R.answered) return; SFX.tap(); body.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); onSel(+b.dataset.i) });
}
function rMC(it,body){
  const q = it.dir==='eu' ? `¿Qué significa <span class="eu">${esc(it.w.eu)}</span>?` : `¿Cómo se dice «${esc(it.w.es)}»?`;
  body.innerHTML=`<div class="q-kind">${it.review?'Repaso':'Elige la respuesta'}</div><h2 class="q-title">${it.dir==='eu'?spkBtn(it.w.eu):''}${q}</h2><div class="opts">${optList(it.opts)}</div>`;
  setBtn('Comprobar',false,null);
  bindOpts(body,i=>{ R.sel=i; setBtn('Comprobar',true,()=>{
    const ok=i===it.a; markOpts(body,i,it.a);
    grade(ok,{word:it.w,strong:!!it.review},ok?'':`Correcto: <b>${esc(it.opts[it.a])}</b>`, it.dir==='es'?it.w.eu:null);
  }) });
}
function markOpts(body,sel,a){ const os=body.querySelectorAll('.opt'); os[a].classList.add('right'); if(sel!==a){os[sel].classList.add('wrong','shake')} }
function rDrill(it,body){
  const d=it.d; const parts=esc(d.s).split('___');
  body.innerHTML=`<div class="q-kind">Gramática</div><h2 class="q-title">${esc(d.q)}</h2><div class="sentence">${parts[0]}<span class="blank" id="blank">&nbsp;</span>${parts[1]||''}</div><div class="opts">${optList(d.order||(d.order=shuffle(d.o.map((_,i)=>i))).map(i=>d.o[i]))}</div>`;
  setBtn('Comprobar',false,null);
  bindOpts(body,i=>{ const real=d.order[i]; const bl=$('#blank'); bl.textContent=d.o[real]; bl.classList.remove('filled'); void bl.offsetWidth; bl.classList.add('filled');
    setBtn('Comprobar',true,()=>{ const ok=real===d.a; markOpts(body,i,d.order.indexOf(d.a));
      grade(ok,null, ok?'':`Correcto: <b>${esc(d.s.replace('___',d.o[d.a]))}</b>`); }) });
}
function rType(it,body){
  const w=it.w;
  body.innerHTML=`<div class="q-kind">${it.review?'Repaso':'Escribe en euskera'}</div><h2 class="q-title">«${esc(w.es)}»</h2><textarea class="typebox" id="tb" placeholder="Escribe en euskera…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>`;
  const tb=$('#tb'); setTimeout(()=>tb.focus(),250);
  setBtn('Comprobar',false,null);
  const check=()=>{
    const a=norm(tb.value), targets=w.eu.split('/').map(norm);
    let ok=targets.includes(a), near=false;
    if(!ok && targets.some(t=>t.length>4 && lev(a,t)<=1)){ ok=true; near=true }
    tb.disabled=true;
    grade(ok,{word:w,strong:!!it.review}, ok?(near?`Casi perfecto. Se escribe: <b>${esc(w.eu)}</b>`:''):`Correcto: <b>${esc(w.eu)}</b>`, w.eu);
  };
  tb.oninput=()=>setBtn('Comprobar',!!tb.value.trim(),check);
  tb.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(tb.value.trim()&&!R.answered) check() } };
}
function rBuild(it,body){
  const toEu=it.lang==='eu';
  body.innerHTML=`<div class="q-kind">Traduce la frase</div><h2 class="q-title">${toEu?esc(it.es):spkBtn(it.eu)+esc(it.eu)}</h2><div class="answer-line" id="ans"></div><div class="bank" id="bank">${it.tiles.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
  const ans=$('#ans'), bank=$('#bank'); const chosen=[];
  const upd=()=>{ ans.innerHTML=chosen.map((i,k)=>`<button class="tile" data-k="${k}">${esc(it.tiles[i])}</button>`).join('');
    ans.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(R.answered)return; SFX.tap(); const i=chosen.splice(+b.dataset.k,1)[0]; bank.querySelector(`[data-i="${i}"]`).classList.remove('used'); upd() });
    setBtn('Comprobar',chosen.length>0,()=>{ const a=norm(chosen.map(i=>it.tiles[i]).join(' ')); const ok=a===it.toks.join(' ');
      grade(ok,null, ok?(toEu?'':`<small>${esc(it.es)}</small>`):`Correcto: <b>${esc(toEu?it.eu:it.es)}</b>`, toEu?it.eu:null) }) };
  bank.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ if(R.answered)return; SFX.tap(); b.classList.add('used'); chosen.push(+b.dataset.i); upd() });
  upd();
}
function rMatch(it,body){
  const L=shuffle(it.pairs), Rr=shuffle(it.pairs);
  body.innerHTML=`<div class="q-kind">Une las parejas</div><h2 class="q-title">Toca cada palabra y su traducción</h2><div class="match"><div class="col">${L.map(w=>`<button class="m" data-k="${esc(norm(w.eu))}" data-s="l">${esc(w.eu)}</button>`).join('')}</div><div class="col">${Rr.map(w=>`<button class="m" data-k="${esc(norm(w.eu))}" data-s="r">${esc(w.es)}</button>`).join('')}</div></div>`;
  $('#l-btn').style.visibility='hidden';
  let selL=null, selR=null, left=it.pairs.length, errs=0;
  body.querySelectorAll('.m').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('gone')) return;
    if(b.dataset.s==='l'){ if(selL)selL.classList.remove('sel'); selL=b; if(b.dataset.k&&canSpeak()) speak(it.pairs.find(w=>norm(w.eu)===b.dataset.k).eu) } else { if(selR)selR.classList.remove('sel'); selR=b }
    b.classList.add('sel'); SFX.tap();
    if(selL&&selR){
      const a=selL,c=selR; selL=selR=null;
      if(a.dataset.k===c.dataset.k){ [a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('ok')}); SFX.pair(); left--;
        const w=it.pairs.find(w=>norm(w.eu)===a.dataset.k); srsSeen(w); srsGrade(w,true,false);
        setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove('ok');x.classList.add('gone')})},350);
        if(!left) setTimeout(()=>{ $('#l-btn').style.visibility='visible'; grade(true,null, errs?`${errs} fallo${errs>1?'s':''} por el camino`:'¡Todas a la primera!') },450);
      } else { errs++; SFX.bad(); vibrate(60); [a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('bad')}); setTimeout(()=>[a,c].forEach(x=>x.classList.remove('bad')),400) }
    }
  });
}

/* corrección común */
function grade(ok,info,msg,sayEu){
  R.answered=true;
  const it=cur(); const firstTry=!R.retried.has(it);
  if(firstTry){ R.first++; if(ok) R.firstOk++ }
  if(info&&info.word){ srsSeen(info.word); srsGrade(info.word,ok,info.strong) }
  if(ok){ R.done++; R.combo++; R.maxCombo=Math.max(R.maxCombo,R.combo); SFX.ok();
    const c=$('#l-combo'); if(R.combo>=3){ c.textContent='🔥 ×'+R.combo; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); if(R.combo%5===0) setTimeout(SFX.combo,250) } }
  else { R.combo=0; $('#l-combo').classList.remove('on'); SFX.bad(); vibrate(120); $('#l-body').classList.add('shake'); setTimeout(()=>$('#l-body')&&$('#l-body').classList.remove('shake'),400);
    R.retried.add(it); R.queue.push(it); }
  setProgress();
  const praise=['¡Bikain!','¡Oso ondo!','¡Zuzena!','¡Primeran!','¡Ederki!'];
  $('#s-t').textContent= ok? praise[Math.floor(Math.random()*praise.length)] : 'Ez da zuzena';
  $('#s-ic').innerHTML= ok? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12c270" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d8445c" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  $('#s-b').innerHTML=(msg||'')+(sayEu&&canSpeak()?` ${spkBtn(sayEu)}`:'');
  $('#s-btn').className='btn wide '+(ok?'btn-green':'btn-red');
  $('#l-sheet').className='sheet show '+(ok?'ok':'bad');
  setTimeout(()=>act($('#s-ch'),ok?'jump':'sad'),120);
  $('#l-btn').style.visibility='hidden';
  if(sayEu&&ok&&canSpeak()) setTimeout(()=>speak(sayEu),150);
}
function next(){ SFX.tap(); advance() }
function advance(){
  R.answered=false; R.i++;
  if(R.i>=R.queue.length) return finish();
  // mezcla: si el siguiente es un reintento, sepáralo un poco
  showItem();
}
document.addEventListener('keydown',e=>{
  if(!R||!$('#lesson')) return;
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(e.key==='Enter'){ e.preventDefault(); if($('#l-sheet').classList.contains('show')) next(); else if(!$('#l-btn').disabled&&R.ready) R.ready() }
  if(/^[1-4]$/.test(e.key)){ const o=document.querySelectorAll('#l-body .opt')[+e.key-1]; if(o) o.click() }
});

function finish(){
  const m=R.meta, acc=R.first?Math.round(R.firstOk/R.first*100):100, secs=Math.round((Date.now()-R.start)/1000);
  let xp = m.review ? Math.max(5,R.firstOk) : 10 + (acc===100?5:0);
  addXP(xp);
  if(m.id && !m.review){ const prev=S.done[m.id]||{n:0,best:0}; S.done[m.id]={n:prev.n+1,best:Math.max(prev.best,acc)} }
  save();
  $('#lesson').remove();
  const f=document.createElement('div'); f.className='finish'; f.id='finish';
  const goalNow=S.days[today()]||0, reached=goalNow>=50&&goalNow-xp<50;
  const crew=[R.ch,...shuffle(CH_ORDER.filter(c=>c!==R.ch)).slice(0,2)];
  f.innerHTML=`<div class="troupe">${chImg(crew[1],'act-party d1')}${chImg(crew[0],'act-party')}${chImg(crew[2],'act-party d2')}</div><h1 class="wordmark">${m.review?'Errepasoa eginda!':'Ikasgaia osatuta!'}</h1><p>${esc(m.title||'')}${reached?' · ¡Objetivo diario cumplido!':''}</p>
  <div class="f-stats"><div class="f-stat"><div class="h" style="background:var(--yellow)">XP</div><div class="v" id="f-xp">0</div></div>
  <div class="f-stat"><div class="h" style="background:var(--mint)">Aciertos</div><div class="v">${acc}%</div></div>
  <div class="f-stat"><div class="h" style="background:var(--cyan)">Tiempo</div><div class="v">${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div></div></div>
  <button class="btn btn-green wide" id="f-ok" style="max-width:400px">Continuar</button>`;
  document.body.appendChild(f);
  SFX.done(); confetti();
  let n=0; const el=$('#f-xp'); const iv=setInterval(()=>{ n++; el.textContent=n; if(n>=xp) clearInterval(iv) },45);
  $('#f-ok').onclick=()=>{ SFX.tap(); CONF_STOP=true; f.remove(); document.body.style.overflow=''; R=null; render() };
}

/* pantalla de inicio: una vez al día (fecha en este navegador, no en el progreso) */
const SPL='ikasi-splash';
function showSplash(){
  if($('#splash')) return;
  const st=streak();
  const el=document.createElement('div'); el.className='splash'; el.id='splash';
  el.innerHTML=`<div class="logo"><img src="img/icon.webp" alt=""><div class="wm-wrap"><span class="wordmark">ikasi!</span></div></div><div class="scene"><img src="img/scene.webp" alt="Los personajes de Ikasi en un prado con un caserío"></div><div class="tag">Euskara A0–A2 · ${st?`racha de ${st} día${st===1?'':'s'}`:'Ongi etorri!'}</div><button class="btn btn-green wide" id="sp-go">Hasi!</button>`;
  document.body.appendChild(el);
  $('#sp-go',el).onclick=()=>{ SFX.done(); try{localStorage.setItem(SPL,today())}catch(e){} el.style.transition='opacity .25s,transform .25s'; el.style.opacity='0'; el.style.transform='scale(1.04)'; setTimeout(()=>{ el.remove(); act($('#hero-ch'),'jump') },250) };
}
$('#btn-home').onclick=()=>{ SFX.tap(); if(R) return; showSplash() };

/* confeti */
let CONF_STOP=false;
function confetti(){
  const cv=$('#confetti'); cv.classList.remove('hidden'); const ctx=cv.getContext('2d');
  const W=cv.width=innerWidth, H=cv.height=innerHeight; const cols=['#4ff5a8','#b1fbfb','#f7ee55','#fb6ee8','#ffad3b','#ffffff','#2d0a4e'];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0; CONF_STOP=false; (function f(){ t++; if(CONF_STOP) t=999; ctx.clearRect(0,0,W,H); P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(t<150) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.classList.add('hidden') } })();
}

/* =========================================================
   ARRANQUE + conexión con la base de datos del artefacto
   ========================================================= */
render();
try{ if(localStorage.getItem(SPL)!==today()) showSplash() }catch(e){ showSplash() }
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=='function'){ loadStaticDecks(); return; }
    claude.use('tts').then(t=>{ if(t){ TTS=t } }).catch(()=>{});
    const db=await claude.use('db'); if(!db) return; DB=db;
    const user=await claude.use('user');
    const id=user? await user.id() : null;
    if(id){
      UREF=db.doc('data/users/'+id+'/state');
      try{
        const s=await UREF.get();
        if(s.exists){ const d=s.data()||{};
          if((d.updatedAt||0)>(S.updatedAt||0)){ S=Object.assign({v:1,xp:0,days:{},done:{},srs:{},userDecks:[],settings:{sound:true}},JSON.parse(JSON.stringify(d))); try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} rebuildIndex(); if(!R) render(); }
          else if((S.updatedAt||0)>(d.updatedAt||0)) flush();
        } else if(S.updatedAt) flush();
      }catch(e){}
    }
    db.collection('decks').onSnapshot(q=>{
      CLOUD_DECKS=q.docs.map(d=>Object.assign({},d.data(),{id:d.id,cloud:true})).filter(d=>Array.isArray(d.words));
      rebuildIndex(); if(!R){ renderTop(); if(TAB==='dict') fillDict() }
    },()=>{});
  }catch(e){}
})();
/* web-app (GitHub Pages): fichas de decks.json y funcionamiento sin conexión */
async function loadStaticDecks(){
  try{
    const r=await fetch('decks.json',{cache:'no-cache'}); if(!r.ok) return;
    const list=await r.json();
    CLOUD_DECKS=(Array.isArray(list)?list:[]).map(d=>Object.assign({},d,{cloud:true})).filter(d=>d.id&&Array.isArray(d.words));
    rebuildIndex(); if(!R){ renderTop(); if(TAB==='dict') fillDict() }
  }catch(e){}
}
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had&&!reloaded&&!R){ reloaded=true; location.reload() } });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
}
